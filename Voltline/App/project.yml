name: VoltlineGame
options:
  bundleIdPrefix: com.joey
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Voltline:
    path: ..
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 93MYZUV85K
targets:
  VoltlineGame:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources/Assets.xcassets
    dependencies:
      - package: Voltline
        product: VoltlineSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joey.VoltlineGame
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  VoltlineGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: VoltlineGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joey.VoltlineGameTests
        GENERATE_INFOPLIST_FILE: YES
  VoltlineGameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: VoltlineGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joey.VoltlineGameUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoltlineGame:
    build:
      targets:
        VoltlineGame: all
        VoltlineGameTests: [test]
        VoltlineGameUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VoltlineGameTests
        - VoltlineGameUITests
    archive:
      config: Release
