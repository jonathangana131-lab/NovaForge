name: Apply phone provider reliability fix

# The repair controller on the temporary base branch applies this source script.
on:
  push:
    branches:
      - agent/fix-phone-provider-reliability

permissions:
  contents: write

concurrency:
  group: apply-phone-provider-reliability-fix
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate repair script
        run: python3 -m py_compile scripts/apply-phone-provider-reliability-fix.py

      - name: Apply deterministic source repair
        run: python3 scripts/apply-phone-provider-reliability-fix.py

      - name: Verify patch cleanliness and invariants
        run: |
          git diff --check
          ! grep -R -n 'AIProvider\.agentRuntimeProviders' AgentPad/Views
          grep -n 'LocalizedError' Packages/AgentHarnessKit/Sources/AgentProviders/ProviderFailures.swift
          grep -n 'static let userSelectableProviders' AgentPad/Services/AIProvider.swift

      - name: Commit repaired source
        env:
          BRANCH_NAME: agent/fix-phone-provider-reliability
        run: |
          rm -f .github/workflows/apply-phone-provider-reliability-fix.yml
          rm -f scripts/apply-phone-provider-reliability-fix.py
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix phone provider model failures"
          git push origin "HEAD:${BRANCH_NAME}"
