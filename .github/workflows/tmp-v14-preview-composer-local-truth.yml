name: Temporary V14 Preview Composer local truth patch

on:
  push:
    branches:
      - agent/v14-preview-composer-local-truth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical Composer truth patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AgentPad/Views/ChatComposer.swift')
          text = path.read_text()
          replacements = {
              'return "iPhone 12 safe · \\(localModels.status.title)"': 'return "On-device profile · \\(localModels.status.title)"',
              '? "Recommended for iPhone 12"': '? "Default local profile · qualification pending"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          if 'iPhone 12 safe' in text or 'Recommended for iPhone 12' in text:
              raise SystemExit('legacy positive device-qualification copy still present in ChatComposer.swift')
          path.write_text(text)
          PY

          git diff --check
          grep -F 'return "On-device profile · \(localModels.status.title)"' AgentPad/Views/ChatComposer.swift
          grep -F '? "Default local profile · qualification pending"' AgentPad/Views/ChatComposer.swift

      - name: Remove temporary workflow and publish patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-v14-preview-composer-local-truth.yml
          git add AgentPad/Views/ChatComposer.swift
          git commit -m "Preview: quarantine unqualified Composer device claims"
          git push origin HEAD:agent/v14-preview-composer-local-truth
