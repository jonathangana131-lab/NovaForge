name: V14 Local Model Qualification Final Trust Gate

on:
  push:
    branches:
      - 'worker/GPT56-SOL-NF-V14-LMQ-TRUST-8A10/whole-evidence/e1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/GPT56-SOL-NF-V14-LMQ-TRUST-8A10/whole-evidence/e1
          fetch-depth: 0

      - name: Verify package-only product diff
        run: |
          git merge-base --is-ancestor 1dfdf4968414084c068037d2992fb20f38e27f5d HEAD
          test -z "$(git diff --name-only 1dfdf4968414084c068037d2992fb20f38e27f5d...HEAD | grep -v '^Packages/LocalModelQualificationCore/' | grep -v '^.github/workflows/v14-lmq-trust-final.yml$' || true)"
          git diff --check 1dfdf4968414084c068037d2992fb20f38e27f5d...HEAD

      - name: Debug package tests
        run: swift test --package-path Packages/LocalModelQualificationCore -Xswiftc -warnings-as-errors

      - name: Release package tests
        run: swift test -c release --package-path Packages/LocalModelQualificationCore -Xswiftc -warnings-as-errors
