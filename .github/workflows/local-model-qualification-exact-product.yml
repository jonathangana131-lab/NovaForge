name: Local Model qualification exact-product validation

on:
  pull_request:
    paths:
      - ".github/workflows/local-model-qualification-exact-product.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Local Model qualification exact product
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact product parent and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected_product="46d37e391e045756535b16683e8db8f699645af5"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_product"
          changed="$(git diff --name-only "$expected_product"..HEAD)"
          test "$changed" = ".github/workflows/local-model-qualification-exact-product.yml"
          git diff --check "$expected_product"..HEAD
      - name: Test LocalModelQualificationCore Debug
        run: swift test --package-path Packages/LocalModelQualificationCore -Xswiftc -warnings-as-errors
      - name: Test LocalModelQualificationCore Release
        run: swift test --package-path Packages/LocalModelQualificationCore -c release -Xswiftc -warnings-as-errors
