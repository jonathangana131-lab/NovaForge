name: V13 Swift package contracts

on:
  pull_request:
    paths:
      - "Packages/**"
      - "scripts/verify-v13-packages.sh"
      - ".github/workflows/v13-package-contracts.yml"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "scripts/verify-v13-packages.sh"
      - ".github/workflows/v13-package-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v13-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Swift package contracts (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - name: Show discovered packages
        run: bash scripts/verify-v13-packages.sh --list
      - name: Test every checked-in Swift package
        env:
          NOVAFORGE_SWIFT_PACKAGE_CONFIGURATION: ${{ matrix.configuration }}
        run: bash scripts/verify-v13-packages.sh
