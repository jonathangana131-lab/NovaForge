name: V13 Swift package contracts Linux shadow

on:
  push:
    branches:
      - validation/GPT56-NF-V14-GO-8A08/current-all-packages-linux/e1

permissions:
  contents: read

concurrency:
  group: v13-packages-linux-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Swift package contracts Linux shadow (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Show discovered packages
        run: bash scripts/verify-v13-packages.sh --list
      - name: Test every checked-in Swift package
        env:
          NOVAFORGE_SWIFT_PACKAGE_CONFIGURATION: ${{ matrix.configuration }}
        run: bash scripts/verify-v13-packages.sh
