name: V14 Project Brain Trust Diagnostic

on:
  push:
    branches:
      - validation/GPT56-NF-V14-PBRAIN-TRUST-0809/diagnostic/**

jobs:
  debug-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        run: |
          test "$(git rev-parse HEAD^)" = "f7030e319d7842dac9c60c27c03c136d3d9e0468"
          git diff --check HEAD^

      - name: Debug with surfaced Swift diagnostics
        shell: bash
        run: |
          set +e
          swift test --package-path Packages/AgentHarnessKit --filter ProjectBrainContext -Xswiftc -warnings-as-errors > /tmp/pbrain.log 2>&1
          status=$?
          cat /tmp/pbrain.log
          if [ "$status" -ne 0 ]; then
            mapfile -t diagnostics < <(
              grep -E 'error:|fatal error:|failed - ' /tmp/pbrain.log \
                | grep -v 'emit-module command failed' \
                | head -n 12
            )
            if [ "${#diagnostics[@]}" -eq 0 ]; then
              diagnostics=("$(tail -n 30 /tmp/pbrain.log | tr '\n' ' ' | head -c 3000)")
            fi
            for diagnostic in "${diagnostics[@]}"; do
              diagnostic="${diagnostic:0:3000}"
              diagnostic="${diagnostic//'%'/'%25'}"
              diagnostic="${diagnostic//$'\r'/'%0D'}"
              diagnostic="${diagnostic//$'\n'/'%0A'}"
              echo "::error title=Project Brain Swift diagnostic::$diagnostic"
            done
            exit "$status"
          fi
