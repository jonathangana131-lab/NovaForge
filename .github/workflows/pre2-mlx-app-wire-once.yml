              }
          ''', 'execution label')

          text = replace_once(text,
          '''    var isNewRelease: Bool {
                  releaseDateISO8601 >= "2026-07-01"
              }
          }
          ''',
          '''    var isNewRelease: Bool {
                  releaseDateISO8601 >= "2026-07-01"
              }

              var usesMLX: Bool {
                  #if canImport(SwiftLlama)
                  mlxProfile != nil
                  #else
                  false
                  #endif
              }

              #if canImport(SwiftLlama)
              var mlxProfile: NovaForgeMLXProfile? {
                  switch id {
                  case NovaForgeMLXProfile.nanbeige42Coder3Bit.repositoryID:
                      .nanbeige42Coder3Bit
                  case NovaForgeMLXProfile.nanbeige42Coder2Bit.repositoryID:
                      .nanbeige42Coder2Bit
                  default:
                      nil
                  }
              }
              #endif
          }
          ''', 'mlx variant mapping')

          marker = '''    static let all: [LocalModelVariant] = [
                  .init(
                      id: "Qwen/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M",
          '''
          insertion = '''    static let all: [LocalModelVariant] = [
                  .init(
                      id: "MercuriusDream/Nanbeige4.2-3B-mlx-3bit",
                      displayName: "Nanbeige 4.2 3B — MLX 3-bit",
                      shortName: "Nanbeige 4.2 3B",
                      quantization: "MLX 3-bit",
