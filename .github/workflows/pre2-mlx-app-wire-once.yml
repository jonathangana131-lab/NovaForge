                  #endif
                  _ = try await LocalModelArtifactVerifier.shared.verifiedURL(
                      for: variant
                  )
              }
          ''', 'artifact verification dispatch')

          text = replace_once(text,
          '''        let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)
          ''',
          '''        #if canImport(SwiftLlama)
                  if let profile = variant.mlxProfile {
                      return try await performMLXAgentDecision(
                          request: request,
                          completedToolCallCount: completedToolCallCount,
                          profile: profile
                      )
                  }
                  #endif

                  let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)
          ''', 'agent decision dispatch')

          text = replace_once(text,
          '''    private static func boundedPlannerText(
          ''',
          '''    #if canImport(SwiftLlama)
              private func performMLXAgentDecision(
                  request: AgentLocalModelInferenceRequest,
                  completedToolCallCount: Int,
                  profile: NovaForgeMLXProfile
              ) async throws -> LocalAgentModelDecision {
                  let latestUserIndex = request.messages.lastIndex(where: { $0.role == .user })
                  let latestUser = latestUserIndex.map { request.messages[$0].content } ?? ""
                  let recentContext = latestUserIndex.map { index in
                      Self.boundedPlannerTranscript(Array(request.messages.dropFirst(index + 1)))
                  } ?? ""
                  let contextLine = recentContext.isEmpty
                      ? ""
                      : "\\nRecent validated actions and results:\\n\\(recentContext)"
                  let prompt = "Request: \\(Self.boundedPlannerText(latestUser, limit: 900))\\(contextLine)\\nCompleted actions: \\(completedToolCallCount)\\nReturn only the JSON decision object."
                  let accumulator = LocalMLXTextAccumulator()
                  _ = try await NovaForgeMLXRuntime.shared.generate(
                      profile: profile,
                      instructions: LocalAgentModelGrammar.routerPrompt,
                      prompt: prompt,
                      options: .init(maximumTokens: 192, temperature: 0, topP: 1)
                  ) { chunk in
                      await accumulator.append(chunk)
                  }
                  let output = await accumulator.value()
                  guard let json = Self.firstJSONObject(in: output),
                        let data = json.data(using: .utf8),
                        let decision = try? JSONDecoder().decode(LocalAgentModelDecision.self, from: data)
                  else {
                      throw LocalModelRuntimeError.invalidAgentDecisionOutput(
                          Self.boundedPlannerText(output, limit: 1_500)
                      )
                  }
                  return decision
              }
              #endif

              private static func firstJSONObject(in text: String) -> String? {
                  var start: String.Index?
                  var depth = 0
                  var insideString = false
                  var escaping = false
                  var index = text.startIndex

                  while index < text.endIndex {
                      let character = text[index]
                      if insideString {
                          if escaping {
                              escaping = false
                          } else if character == "\\\\" {
                              escaping = true
                          } else if character == "\\\"" {
                              insideString = false
                          }
                      } else if character == "\\\"" {
                          insideString = true
                      } else if character == "{" {
                          if depth == 0 { start = index }
                          depth += 1
                      } else if character == "}", depth > 0 {
                          depth -= 1
                          if depth == 0, let start {
                              return String(text[start...index])
                          }
                      }
                      index = text.index(after: index)
                  }
                  return nil
              }

              private static func mlxPrompt(
                  messages: [AgentLocalModelInferenceMessage]
              ) -> String {
                  var remaining = 12_000
                  var lines: [String] = []
                  for message in messages.suffix(16) {
                      guard remaining > 0 else { break }
                      let role = message.role.rawValue
                      let allowed = max(0, min(1_500, remaining - role.count - 2))
                      guard allowed > 0 else { break }
                      let content = boundedPlannerText(message.content, limit: allowed)
                      let line = "\\(role): \\(content)"
                      lines.append(line)
                      remaining -= line.count + 1
                  }
                  return lines.joined(separator: "\\n")
              }

              private static func boundedPlannerText(
          ''', 'mlx agent helper')

          old_stream = '''        let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)

                  let llamaMessages = request.messages.map { message in
          '''
          new_stream = '''        #if canImport(SwiftLlama)
                  if let profile = variant.mlxProfile {
                      let metrics = try await NovaForgeMLXRuntime.shared.generate(
                          profile: profile,
                          instructions: NovaForgeMLXRuntime.defaultCoderInstructions,
                          prompt: Self.mlxPrompt(messages: request.messages),
                          options: .init(
                              maximumTokens: Int(request.maximumOutputTokens),
                              temperature: Float(request.temperature),
                              topP: 0.9
                          )
                      ) { chunk in
                          if !chunk.isEmpty {
                              try await onEvent(.text(chunk))
                          }
                      }
                      try Task.checkCancellation()
                      try await onEvent(.usage(generatedTokenCount: UInt64(max(0, metrics.generatedTokenCount))))
                      let reason: AgentLocalModelInferenceFinishReason =
                          metrics.generatedTokenCount >= Int(request.maximumOutputTokens) ? .length : .completed
                      try await onEvent(.completed(reason: reason))
                      return
                  }
                  #endif

                  let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)

                  let llamaMessages = request.messages.map { message in
          '''
          # The same modelURL/service prelude appears in both agent decision and stream.
          # At this point the agent-decision occurrence was already changed, so exactly one remains.
          text = replace_once(text, old_stream, new_stream, 'text stream dispatch')

          text = replace_once(text,
          '''        let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)

                  let systemPrompt = localSystemPrompt(customSystemPrompt: customSystemPrompt, workspaceSummary: workspaceSummary)
          ''',
          '''        let systemPrompt = localSystemPrompt(customSystemPrompt: customSystemPrompt, workspaceSummary: workspaceSummary)
                  let sanitizedTranscript = ProviderMessageSanitizer.sanitize(systemPrompt: systemPrompt, history: messages)

                  #if canImport(SwiftLlama)
                  if let profile = variant.mlxProfile {
                      let accumulator = LocalMLXTextAccumulator()
                      let prompt = sanitizedTranscript.messages.suffix(10).map { message in
                          "\\(message.role): \\(Self.boundedPlannerText(message.content ?? "", limit: 1_200))"
                      }.joined(separator: "\\n")
                      _ = try await NovaForgeMLXRuntime.shared.generate(
                          profile: profile,
                          instructions: systemPrompt,
                          prompt: prompt,
                          options: .init(
                              maximumTokens: variant.maxNewTokens,
                              temperature: Float(min(max(temperature, 0), 2)),
                              topP: 0.9
                          )
                      ) { chunk in
                          await accumulator.append(chunk)
                          if !chunk.isEmpty {
                              await onContentBatch(chunk)
                          }
                      }
                      let output = await accumulator.value()
                      let cleanedOutput = Self.cleanLocalOutput(output)
                      let message = ChatCompletionsResponse.Choice.Message(
                          role: "assistant",
                          content: cleanedOutput.isEmpty ? nil : cleanedOutput,
                          tool_calls: nil
                      )
                      return ProviderResponse(message: message, roleLog: sanitizedTranscript.roleLog)
                  }
                  #endif

                  let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)

          ''', 'legacy stream dispatch')

          # The legacy path now created sanitizedTranscript before the MLX branch;
          # remove its original duplicate declaration after the llama service line.
          text = replace_once(text,
          '''        let sanitizedTranscript = ProviderMessageSanitizer.sanitize(systemPrompt: systemPrompt, history: messages)
                  let llamaMessages = localMessages(from: sanitizedTranscript.messages)
          ''',
          '''        let llamaMessages = localMessages(from: sanitizedTranscript.messages)
          ''', 'remove duplicate sanitizer')

          runtime_path.write_text(text)

          provider = provider_path.read_text()
          provider = replace_once(provider,
          '''        case .local:
                  "On-device Qwen Coder agent"
          ''',
          '''        case .local:
                  "On-device MLX + GGUF coding agent"
          ''', 'local provider subtitle')
          provider_path.write_text(provider)
          PY

          git diff --check
