name: Pre2 MLX app wire once

on:
  push:
    branches: [feat/pre2-nanbeige-mlx-a14]
    paths:
      - .github/workflows/pre2-mlx-app-wire-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pre2-nanbeige-mlx-a14
          fetch-depth: 0
      - name: Wire Nanbeige into Local catalog and runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('AgentPad/Services/LocalModelRuntime.swift')
          provider_path = Path('AgentPad/Services/AIProvider.swift')
          text = runtime_path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(text,
          '''    var executionLabel: String {
                  useGPU ? "Metal \\(gpuLayerCount)L" : "CPU-only"
              }
          ''',
