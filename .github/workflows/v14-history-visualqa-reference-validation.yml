name: V14 History Visual QA reference validation

on:
  pull_request:
    paths:
      - 'Packages/ForgeHistoryCore/**'
      - '.github/workflows/v14-history-visualqa-reference-validation.yml'

permissions:
  contents: read

jobs:
  forge-history-core:
    name: ForgeHistoryCore ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Assert validation composition
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git rev-parse HEAD^)" = "8beae05abb0bcef30a5e4307d023ffd9ac84479d"
      - name: Test ForgeHistoryCore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.configuration }}" == "release" ]]; then
            swift test --package-path Packages/ForgeHistoryCore -c release -Xswiftc -warnings-as-errors
          else
            swift test --package-path Packages/ForgeHistoryCore -Xswiftc -warnings-as-errors
          fi
