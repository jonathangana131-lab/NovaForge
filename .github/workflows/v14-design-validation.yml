name: V14 Design DNA validation

on:
  pull_request:
    paths:
      - "Packages/ForgeDesignCore/**"
      - ".github/workflows/v14-design-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-core:
    name: ForgeDesignCore (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Test ForgeDesignCore
        run: >-
          swift test
          --package-path Packages/ForgeDesignCore
          --configuration ${{ matrix.configuration }}
          -Xswiftc -warnings-as-errors
