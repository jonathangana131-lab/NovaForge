name: Swift package contracts

on:
  pull_request:
    paths:
      - "**/Package.swift"
      - "**/Sources/**"
      - "**/Tests/**"
      - "scripts/verify-swift-packages.sh"
      - ".github/workflows/swift-package-contracts.yml"
  push:
    branches: [main]
    paths:
      - "**/Package.swift"
      - "**/Sources/**"
      - "**/Tests/**"
      - "scripts/verify-swift-packages.sh"
      - ".github/workflows/swift-package-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Swift package contracts (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - name: Show discovered packages
        run: bash scripts/verify-swift-packages.sh --list
      - name: Verify every tracked Swift package
        env:
          NOVAFORGE_SWIFT_PACKAGE_CONFIGURATION: ${{ matrix.configuration }}
        run: bash scripts/verify-swift-packages.sh
