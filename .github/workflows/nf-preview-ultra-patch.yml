name: NovaForge Preview Ultra patch

on:
  push:
    branches:
      - worker/GPT56-SOL-NF-V14-PREVIEW-ULTRA-0810/effort-ultra/e1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: worker/GPT56-SOL-NF-V14-PREVIEW-ULTRA-0810/effort-ultra/e1
          fetch-depth: 0
      - name: Apply narrow Preview Ultra patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          composer = Path('AgentPad/Views/ChatComposer.swift')
          text = composer.read_text()

          replacements = [
              (
                  '''        case .ultraCode:\n            "UltraCode"\n        }\n    }\n\n    var body: some View {''',
                  '''        case .ultraCode:\n            "Ultra"\n        }\n    }\n\n    var body: some View {''',
                  1,
              ),
              (
                  '''            case .ultraCode: "UltraCode"''',
                  '''            case .ultraCode: "Ultra"''',
                  1,
              ),
              (
                  '''            case .ultraCode: "Max reasoning + isolated workspace agents"''',
                  '''            case .ultraCode: "Strongest orchestration with isolated specialist agents"''',
                  1,
              ),
              (
                  '''                Text(selection == .ultraCode\n                     ? "Max reasoning + isolated workspace agents"\n                     : selection.detail)''',
                  '''                Text(selection == .ultraCode\n                     ? ultraDetail\n                     : selection.detail)''',
                  1,
              ),
              (
                  '''    private var activeTint: Color {\n        selection == .ultraCode ? AgentPalette.indigo : provider.tint\n    }\n\n    private var selection: Level {''',
                  '''    private var activeTint: Color {\n        selection == .ultraCode ? AgentPalette.indigo : provider.tint\n    }\n\n    private var ultraDetail: String {\n        if provider == .openAICodex {\n            return "Strongest available model reasoning + isolated specialist agents"\n        }\n        return "Isolated specialist agents + lead verification"\n    }\n\n    private var selection: Level {''',
                  1,
              ),
              (
                  '''    private var tint: Color {\n        presentation.mode == .ultraCode ? AgentPalette.indigo : AgentPalette.lilac\n    }\n\n    var body: some View {''',
                  '''    private var tint: Color {\n        presentation.mode == .ultraCode ? AgentPalette.indigo : AgentPalette.lilac\n    }\n\n    private var presentationTitle: String {\n        presentation.mode == .ultraCode ? "Ultra" : presentation.mode.title\n    }\n\n    private var presentationHeadline: String {\n        guard presentation.mode == .ultraCode else { return presentation.headline }\n        return presentation.headline.replacingOccurrences(\n            of: "UltraCode",\n            with: "Ultra"\n        )\n    }\n\n    var body: some View {''',
                  1,
              ),
              (
                  '''                    Text(presentation.mode.title)\n                        .font(.headline.weight(.bold))\n                    Text(presentation.headline)''',
                  '''                    Text(presentationTitle)\n                        .font(.headline.weight(.bold))\n                    Text(presentationHeadline)''',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'ChatComposer replacement count mismatch: expected {expected}, found {count}: {old[:90]!r}')
              text = text.replace(old, new, expected)

          composer.write_text(text)

          ui = Path('AgentPadUITests/AgentPadUITests.swift')
          tests = ui.read_text()

          old = 'localizedCaseInsensitiveContains("UltraCode")'
          count = tests.count(old)
          if count < 3:
              raise SystemExit(f'Expected at least 3 UltraCode collapsed-label assertions, found {count}')
          tests = tests.replace(old, 'localizedCaseInsensitiveContains("Ultra")')

          old = 'format: "value == %@", "UltraCode"'
          count = tests.count(old)
          if count != 1:
              raise SystemExit(f'Expected one UltraCode slider-value assertion, found {count}')
          tests = tests.replace(old, 'format: "value == %@", "Ultra"')

          tests = tests.replace(
              '"UltraCode should compactly explain its maximum-reasoning workspace behavior."',
              '"Ultra should compactly explain its strongest real workspace orchestration behavior."',
              1,
          )
          tests = tests.replace(
              '"The collapsed liquid-glass control should retain the selected UltraCode mode."',
              '"The collapsed liquid-glass control should retain the selected Ultra mode."',
              1,
          )
          tests = tests.replace(
              '"The exact UltraCode stop must become the active mode."',
              '"The exact Ultra stop must become the active mode."',
              1,
          )
          tests = tests.replace(
              '"The collapsed composer must visibly retain UltraCode."',
              '"The collapsed composer must visibly retain Ultra."',
              1,
          )
          ui.write_text(tests)
          PY

          python3 - <<'PY'
          from pathlib import Path
          c = Path('AgentPad/Views/ChatComposer.swift').read_text()
          t = Path('AgentPadUITests/AgentPadUITests.swift').read_text()
          assert 'case .ultraCode: "Ultra"' in c
          assert 'case .ultraCode:\n            "Ultra"' in c
          assert 'Strongest available model reasoning + isolated specialist agents' in c
          assert 'Text(presentationTitle)' in c
          assert 'Text(presentationHeadline)' in c
          assert 'format: "value == %@", "Ultra"' in t
          assert 'localizedCaseInsensitiveContains("UltraCode")' not in t
          PY

          git diff --check
          git diff -- AgentPad/Views/ChatComposer.swift AgentPadUITests/AgentPadUITests.swift

          git config user.name "NovaForge GO Worker"
          git config user.email "novaforge-go-worker@users.noreply.github.com"
          git rm .github/workflows/nf-preview-ultra-patch.yml
          git add AgentPad/Views/ChatComposer.swift AgentPadUITests/AgentPadUITests.swift
          git commit -m "Preview: expose truthful Ultra effort mode"
          git push origin HEAD:worker/GPT56-SOL-NF-V14-PREVIEW-ULTRA-0810/effort-ultra/e1
