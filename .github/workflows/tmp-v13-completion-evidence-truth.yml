name: Temporary V13 completion evidence truth

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-stack-main-recovery/e1

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Harden completion evidence and verify
        shell: bash
        run: |
          set -euo pipefail
          base=8e3808448d38813c7c2155ea51a256dee8d6f72e
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-completion-evidence-truth.yml"

          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, found {n}")
              return text.replace(old, new, 1)

          mission_path = Path('Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMission.swift')
          archive_path = Path('Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift')
          tests_path = Path('Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift')

          s = mission_path.read_text()
          s = once(s,
          '''    case completionMissingExpectedEvidence\n    case completionMissingReceipt\n    case revisionOverflow\n''',
          '''    case completionMissingExpectedEvidence\n    case completionMissingReceipt\n    case completionInvalidKnownLimitation\n    case revisionOverflow\n''',
          'completion limitation error')

          s = once(s,
          '''        guard !evidence.receiptIDs.values.isEmpty,\n              evidence.receiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty }) else { throw ForgeMissionError.completionMissingReceipt }\n        guard constitution.expectedEvidence.values.allSatisfy(evidence.evidenceClasses.contains) else {\n''',
          '''        guard !evidence.receiptIDs.values.isEmpty,\n              evidence.receiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty }) else { throw ForgeMissionError.completionMissingReceipt }\n        guard evidence.knownLimitations.values.allSatisfy({ !$0.trimmed.isEmpty }) else {\n            throw ForgeMissionError.completionInvalidKnownLimitation\n        }\n        guard constitution.expectedEvidence.values.allSatisfy(evidence.evidenceClasses.contains) else {\n''',
          'completion evidence validation')
          mission_path.write_text(s)

          a = archive_path.read_text()
          a = once(a,
          '''                  checkpoint.authorityEpoch + 1 == state.authorityEpoch,\n                  !completion.receiptIDs.values.isEmpty,\n                  state.constitution.expectedEvidence.values.allSatisfy(completion.evidenceClasses.contains) else { throw ForgeMissionArchiveError.invalidCompletion }\n''',
          '''                  checkpoint.authorityEpoch + 1 == state.authorityEpoch,\n                  !completion.receiptIDs.values.isEmpty,\n                  completion.receiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty }),\n                  completion.knownLimitations.values.allSatisfy({ !$0.trimmed.isEmpty }),\n                  state.constitution.expectedEvidence.values.allSatisfy(completion.evidenceClasses.contains) else { throw ForgeMissionArchiveError.invalidCompletion }\n''',
          'persisted completion evidence validation')
          archive_path.write_text(a)

          t = tests_path.read_text()
          old = '''    func testKnownLimitationsProduceDistinctTerminalTruth() throws {\n        var mission = try completedReadyMission()\n        try mission.complete(with: MissionCompletionEvidence(\n            acceptedProjectStateID: "state:1",\n            evidenceClasses: .init([.runtimeTested]),\n            receiptIDs: .init(["completion:r"]),\n            knownLimitations: .init(["No physical-device proof"]),\n            acceptedAt: instant(30)\n        ))\n        XCTAssertEqual(mission.phase, .completedWithKnownLimitations)\n    }\n'''
          new = '''    func testKnownLimitationsProduceDistinctTerminalTruth() throws {\n        var mission = try completedReadyMission()\n        XCTAssertThrowsError(try mission.complete(with: MissionCompletionEvidence(\n            acceptedProjectStateID: "state:1",\n            evidenceClasses: .init([.runtimeTested]),\n            receiptIDs: .init(["completion:r"]),\n            knownLimitations: .init(["   "]),\n            acceptedAt: instant(29)\n        ))) { error in\n            XCTAssertEqual(error as? ForgeMissionError, .completionInvalidKnownLimitation)\n        }\n        try mission.complete(with: MissionCompletionEvidence(\n            acceptedProjectStateID: "state:1",\n            evidenceClasses: .init([.runtimeTested]),\n            receiptIDs: .init(["completion:r"]),\n            knownLimitations: .init(["No physical-device proof"]),\n            acceptedAt: instant(30)\n        ))\n        XCTAssertEqual(mission.phase, .completedWithKnownLimitations)\n    }\n'''
          t = once(t, old, new, 'known limitation reducer test')

          marker = '''    func testArchiveRejectsReadyPhaseWithManufacturedBlockedStage() throws {\n'''
          insertion = '''    func testArchiveRejectsBlankCompletionReceiptEvidence() throws {\n        var mission = try completedReadyMission()\n        try mission.complete(with: completion(state: "state:1", classes: [.runtimeTested]))\n        let archive = try ForgeMissionArchive(state: mission)\n        let data = try JSONEncoder().encode(archive)\n        var root = try XCTUnwrap(JSONSerialization.jsonObject(with: data) as? [String: Any])\n        var state = try XCTUnwrap(root["state"] as? [String: Any])\n        var completion = try XCTUnwrap(state["completionEvidence"] as? [String: Any])\n        completion["receiptIDs"] = ["values": ["   "]]\n        state["completionEvidence"] = completion\n        root["state"] = state\n\n        XCTAssertThrowsError(try JSONDecoder().decode(\n            ForgeMissionArchive.self,\n            from: JSONSerialization.data(withJSONObject: root)\n        ))\n    }\n\n'''
          if t.count(marker) != 1:
              raise SystemExit(f'archive test marker count={t.count(marker)}')
          tests_path.write_text(t.replace(marker, insertion + marker, 1))
          PY

          git diff --check
          focused="${RUNNER_TEMP}/MissionStackFocused"
          rm -rf "$focused"
          mkdir -p "$focused/Sources" "$focused/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$focused/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Sources/ForgeMission "$focused/Sources/ForgeMission"
          cp -R Packages/AgentHarnessKit/Tests/AgentDomainTests "$focused/Tests/AgentDomainTests"
          cp -R Packages/AgentHarnessKit/Tests/ForgeMissionTests "$focused/Tests/ForgeMissionTests"
          cat > "$focused/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "MissionStackFocused",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
                  .library(name: "ForgeMission", targets: ["ForgeMission"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .target(name: "ForgeMission", dependencies: ["AgentDomain"]),
                  .testTarget(name: "AgentDomainTests", dependencies: ["AgentDomain"]),
                  .testTarget(name: "ForgeMissionTests", dependencies: ["AgentDomain", "ForgeMission"]),
              ]
          )
          SWIFT
          swift test --package-path "$focused" -Xswiftc -warnings-as-errors
          git diff --check

          git config user.name "NovaForge V13 recovery"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMission.swift
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift
          git add Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift
          git rm .github/workflows/tmp-v13-completion-evidence-truth.yml
          git commit -m "Reject empty mission completion evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
