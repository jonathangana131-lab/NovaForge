name: Fix Forge Compact fallback regression

on:
  push:
    branches:
      - gpt56-sol-v14-preview-forgecompact-supplement-0814

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add byte-exact raw fallback regression
        env:
          TEST_B64: ""
          HELPER_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('AgentPadTests/AgentCanonicalContextPreparerTests.swift')
          text = path.read_text()
          test_anchor = '    func testSingleToolEnvelopeUsesExactProviderCallIDAndLosslessResult() async throws {\n'
          helper_anchor = 'private func assertCanonicalContextError<T: Sendable>(\n'
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(test_anchor)}')
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {text.count(helper_anchor)}')
          test = base64.b64decode(os.environ['TEST_B64']).decode()
          helper = base64.b64decode(os.environ['HELPER_B64']).decode()
          text = text.replace(test_anchor, test + test_anchor, 1)
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "AgentPadTests/AgentCanonicalContextPreparerTests.swift"
          grep -F 'testProjectMemorySupplementFailureFallsBackByteForByteToCanonicalRawJSON' AgentPadTests/AgentCanonicalContextPreparerTests.swift
          grep -F 'CanonicalContextSupplementMirror' AgentPadTests/AgentCanonicalContextPreparerTests.swift
      - name: Commit product regression and remove applicator
        run: |
          rm .github/workflows/fix-forgecompact-fallback-regression.yml
          git config user.name "novaforge-swarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPadTests/AgentCanonicalContextPreparerTests.swift .github/workflows/fix-forgecompact-fallback-regression.yml
          git commit -m "Preview: prove Forge Compact raw fallback is byte-exact"
          git push origin HEAD:${GITHUB_REF_NAME}
