name: V14 Mission full package macOS validation only

on:
  push:
    branches:
      - validation/GPT56-NF-V14-MISSION-CLOSER-8A08/full-package-macos-9db0

permissions:
  contents: read

jobs:
  agent-harness-full-package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: AgentHarnessKit debug warnings-as-errors
        run: swift test --package-path Packages/AgentHarnessKit -Xswiftc -warnings-as-errors
      - name: AgentHarnessKit release warnings-as-errors
        run: swift test --package-path Packages/AgentHarnessKit -c release -Xswiftc -warnings-as-errors
