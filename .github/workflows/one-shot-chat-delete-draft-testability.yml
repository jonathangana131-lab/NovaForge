name: One-shot chat delete draft testability patch

on:
  push:
    branches:
      - gpt56-sol-preview-chat-delete-draft-0810
    paths:
      - '.github/workflows/one-shot-chat-delete-draft-testability.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-chat-delete-draft-testability
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56-sol-preview-chat-delete-draft-0810
          fetch-depth: 0

      - name: Move helper into shared source and add XCTest
        run: |
          python3 scripts/one_shot_move_chat_draft_persistence_for_tests.py
          git diff --check
          grep -F 'final class ConversationDraftPersistence: @unchecked Sendable {' AgentPad/Models/Models.swift
          ! grep -F 'final class ConversationDraftPersistence: @unchecked Sendable {' AgentPad/Views/ChatView.swift
          grep -F 'func testDeletedConversationDraftPurgesOnlyTargetAndInstallsTombstone() throws {' AgentPadTests/AgentRuntimeLifecycleTests.swift

      - name: Commit product/test repair and remove one-shot files
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/one-shot-chat-delete-draft-testability.yml
          rm scripts/one_shot_move_chat_draft_persistence_for_tests.py
          git add AgentPad/Views/ChatView.swift AgentPad/Models/Models.swift AgentPadTests/AgentRuntimeLifecycleTests.swift .github/workflows/one-shot-chat-delete-draft-testability.yml scripts/one_shot_move_chat_draft_persistence_for_tests.py
          git commit -m "Exercise deleted chat draft persistence"
          git push origin HEAD:gpt56-sol-preview-chat-delete-draft-0810
