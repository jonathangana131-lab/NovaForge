name: V14 AgentProviders crypto portability validation

on:
  push:
    branches:
      - agent/v14-preview-agentproviders-crypto-portability
    paths:
      - 'Packages/AgentHarnessKit/Package.swift'
      - 'Packages/AgentHarnessKit/Sources/AgentProviders/**'
      - '.github/workflows/v14-agentproviders-crypto-portability-validation.yml'

permissions:
  contents: read

jobs:
  agentproviders-linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact product diff
        shell: bash
        run: |
          set -euo pipefail
          base=228eeb286bc48ee13ead3c084290062052532738
          expected=$(cat <<'EOF'
          Packages/AgentHarnessKit/Package.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/HostedReadOnlyToolsCapability.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/HostedSingleCallToolsCapability.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/HostedTextOnlyCapability.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/LocalModelSingleCallToolsCapability.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/ModelGateway.swift
          Packages/AgentHarnessKit/Sources/AgentProviders/ProviderAdapters.swift
          EOF
          )
          actual=$(git diff --name-only "$base"..HEAD -- Packages/AgentHarnessKit | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check "$base"..HEAD
          echo "validated product head: $(git rev-parse HEAD)"
      - name: Verify provider target owns portable crypto dependency
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n '^import CryptoKit$' Packages/AgentHarnessKit/Sources/AgentProviders; then
            echo 'AgentProviders still imports CryptoKit' >&2
            exit 1
          fi
          grep -F '.product(name: "Crypto", package: "swift-crypto")' Packages/AgentHarnessKit/Package.swift >/dev/null
          for file in \
            HostedReadOnlyToolsCapability.swift \
            HostedSingleCallToolsCapability.swift \
            HostedTextOnlyCapability.swift \
            LocalModelSingleCallToolsCapability.swift \
            ModelGateway.swift \
            ProviderAdapters.swift; do
            grep -F 'import Crypto' "Packages/AgentHarnessKit/Sources/AgentProviders/$file" >/dev/null
          done
      - name: Show Swift toolchain
        run: swift --version
      - name: Build AgentProviders debug on Linux
        run: swift build --package-path Packages/AgentHarnessKit --target AgentProviders -Xswiftc -warnings-as-errors
      - name: Build AgentProviders release on Linux
        run: swift build --package-path Packages/AgentHarnessKit -c release --target AgentProviders -Xswiftc -warnings-as-errors
