name: AgentPolicy release static probe validation

on:
  pull_request:
    paths:
      - .github/workflows/agentpolicy-release-static-probe-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "83e3a5d751d16bcda49f818442840a2044293a8c"
          git diff --check HEAD^

      - name: Debug static security probes
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/AgentHarnessKit \
            --filter MutationEffectStaticSecurityTests \
            -Xswiftc -warnings-as-errors

      - name: Release static security probes
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/AgentHarnessKit \
            -c release \
            --filter MutationEffectStaticSecurityTests \
            -Xswiftc -warnings-as-errors
