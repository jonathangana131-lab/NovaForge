name: V14 theme reset cache one-shot patch

on:
  push:
    branches:
      - agent/v14-preview-theme-reset-cache
    paths:
      - '.github/workflows/v14-theme-reset-cache-autopatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-preview-theme-reset-cache
          fetch-depth: 0
      - name: Apply exact one-line reset cache repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AgentPad/App/AgentPadApp.swift')
          source = path.read_text()
          old = '            AgentPalette.refreshThemeCache(AgentTheme.current)\n            AgentThemeUIKit.apply(AgentTheme.current)\n            UserDefaults.standard.removeObject(forKey: LaunchConversationSelection.persistedSelectionKey)'
          new = '            AgentPalette.refreshThemeCache(AgentTheme.normalizeStoredTheme())\n            AgentThemeUIKit.apply(AgentTheme.current)\n            UserDefaults.standard.removeObject(forKey: LaunchConversationSelection.persistedSelectionKey)'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one reset-theme cache target, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/v14-theme-reset-cache-autopatch.yml
          git diff --check
          git diff --exit-code -- AgentPad/App/AgentPadApp.swift >/dev/null && {
            echo 'Expected AgentPadApp.swift to change' >&2
            exit 1
          }
          test ! -e .github/workflows/v14-theme-reset-cache-autopatch.yml
      - name: Commit exact repair and remove one-shot workflow
        run: |
          git config user.name 'NovaForge Swarm'
          git config user.email 'actions@users.noreply.github.com'
          git add AgentPad/App/AgentPadApp.swift .github/workflows/v14-theme-reset-cache-autopatch.yml
          git commit -m 'fix: re-resolve theme after debug reset'
          git push origin HEAD:agent/v14-preview-theme-reset-cache
