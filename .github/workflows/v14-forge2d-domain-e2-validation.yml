name: V14 Forge2D Domain E2 Validation

on:
  push:
    branches:
      - 'validation/GPT56-SOL-NF-V14-2DRECOVER-8A10/domain-e2'

permissions:
  contents: read

jobs:
  exact-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert exact product parent and isolated validation delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d168b24c8bd1c6666d9a374c91bde094f26e22dd"
          git diff --check HEAD^..HEAD
          changed="$(git diff --name-only HEAD^..HEAD)"
          test "$changed" = ".github/workflows/v14-forge2d-domain-e2-validation.yml"

      - name: Toolchain
        run: |
          swift --version
          node --version

      - name: Debug package tests
        run: swift test --package-path Packages/Forge2DKit -Xswiftc -warnings-as-errors

      - name: Release package tests
        run: swift test --package-path Packages/Forge2DKit -c release -Xswiftc -warnings-as-errors
