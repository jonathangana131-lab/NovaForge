name: Temporary V13 ForgeMission archive schema truth

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-durable-state-hardening/e1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump schema and verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          base=0b50d607b9a68c40258f1fd45c16d325350dd779
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-archive-schema-truth.yml"

          python3 - <<'PY'
          from pathlib import Path
          archive = Path('Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift')
          tests = Path('Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift')
          a = archive.read_text()
          old = 'public static let currentSchemaVersion = 1'
          assert a.count(old) == 1
          archive.write_text(a.replace(old, 'public static let currentSchemaVersion = 2', 1))
          t = tests.read_text()
          old = '''        let archive = try ForgeMissionArchive(state: mission)\n        let encoder = JSONEncoder(); encoder.outputFormatting = [.sortedKeys]\n'''
          new = '''        let archive = try ForgeMissionArchive(state: mission)\n        XCTAssertEqual(ForgeMissionArchive.currentSchemaVersion, 2)\n        XCTAssertEqual(archive.schemaVersion, 2)\n        let encoder = JSONEncoder(); encoder.outputFormatting = [.sortedKeys]\n'''
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = '''        var json = try XCTUnwrap(JSONSerialization.jsonObject(with: data) as? [String: Any])\n        json["schemaVersion"] = 99\n        XCTAssertThrowsError(try JSONDecoder().decode(ForgeMissionArchive.self, from: JSONSerialization.data(withJSONObject: json)))\n'''
          new = '''        var json = try XCTUnwrap(JSONSerialization.jsonObject(with: data) as? [String: Any])\n        json["schemaVersion"] = 1\n        XCTAssertThrowsError(try JSONDecoder().decode(ForgeMissionArchive.self, from: JSONSerialization.data(withJSONObject: json)))\n        json["schemaVersion"] = 99\n        XCTAssertThrowsError(try JSONDecoder().decode(ForgeMissionArchive.self, from: JSONSerialization.data(withJSONObject: json)))\n'''
          assert t.count(old) == 1
          tests.write_text(t.replace(old, new, 1))
          PY

          git diff --check
          focused="${RUNNER_TEMP}/ForgeMissionFocused"
          rm -rf "$focused"
          mkdir -p "$focused/Sources" "$focused/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$focused/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Sources/ForgeMission "$focused/Sources/ForgeMission"
          cp -R Packages/AgentHarnessKit/Tests/ForgeMissionTests "$focused/Tests/ForgeMissionTests"
          cat > "$focused/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "ForgeMissionFocused",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
                  .library(name: "ForgeMission", targets: ["ForgeMission"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .target(name: "ForgeMission", dependencies: ["AgentDomain"]),
                  .testTarget(name: "ForgeMissionTests", dependencies: ["AgentDomain", "ForgeMission"]),
              ]
          )
          SWIFT
          swift test --package-path "$focused" -Xswiftc -warnings-as-errors
          git diff --check

          git config user.name "NovaForge V13 worker"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift
          git add Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift
          git rm .github/workflows/tmp-v13-archive-schema-truth.yml
          git commit -m "Version durable ForgeMission archive schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
