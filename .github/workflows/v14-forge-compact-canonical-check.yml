name: V14 Forge Compact canonical check

on:
  push:
    branches:
      - agent/v14-forge-compact-canonical-integration
  pull_request:
    paths:
      - "Packages/ForgeCompactCore/**"
      - ".github/workflows/v14-forge-compact-canonical-check.yml"

permissions:
  contents: read

jobs:
  forge-compact:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Debug package tests
        run: swift test --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
      - name: Release package tests
        run: swift test -c release --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
