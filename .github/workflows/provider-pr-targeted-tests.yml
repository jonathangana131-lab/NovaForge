name: Provider PR targeted tests

on:
  pull_request:
    branches:
      - agent/provider-repair-control
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: provider-pr-targeted-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provider-contracts:
    if: github.head_ref == 'agent/provider-contract-pr-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f30cdf5f9503b1d161672ec4ffe906a72d4c9ae0
      - name: Run provider contract tests
        run: swift test --package-path Packages/AgentHarnessKit --filter ProviderAdapterContractTests
      - name: Report success on repair PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 12 --repo jonathangana131-lab/NovaForge --body "✅ ProviderAdapterContractTests passed on clean repair commit f30cdf5f9503b1d161672ec4ffe906a72d4c9ae0."
