name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      run_screenshot_tour:
        description: Run the synchronized major-surface screenshot census
        required: false
        default: false
        type: boolean
      run_release_suite:
        description: Run every unit and UI journey
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-local-download:
    name: Apply local download recovery
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-phone-provider-reliability-clean'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          fetch-depth: 0
      - name: Patch interrupted-download state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("AgentPad/Services/LocalModelRuntime.swift")
          text = source.read_text()
          old_lines = [
              "            } catch {",
              "                await MainActor.run {",
              "                    self?.downloadTask = nil",
              "                    self?.refreshStatus()",
              "                    if case .partial = self?.status {",
              "                        return",
              "                    }",
              "                    self?.status = .failed(error.localizedDescription)",
              "                }",
              "            }",
          ]
          new_lines = [
              "            } catch {",
              "                await MainActor.run {",
              "                    guard let self else { return }",
              "                    self.downloadTask = nil",
              "                    guard self.selectedVariantID == variant.id else { return }",
              "",
              "                    let destination = try? LocalModelCatalog.fileURL(for: variant)",
              "                    let partialURL = destination.map(LocalModelDownloader.temporaryURL(for:))",
              "                    let partialBytes = partialURL.flatMap(self.fileSize(at:)) ?? 0",
              "                    if partialBytes > 0, partialBytes < variant.expectedBytes {",
              "                        self.downloadedBytes = partialBytes",
              "                        self.progress = .init(",
              "                            receivedBytes: partialBytes,",
              "                            totalBytes: variant.expectedBytes",
              "                        )",
              "                        self.status = .partial",
              "                    } else {",
              "                        self.status = .failed(error.localizedDescription)",
              "                    }",
              "                }",
              "            }",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one download catch block, found {count}")
          source.write_text(text.replace(old, new))
          PY
          git config user.name "NovaForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPad/Services/LocalModelRuntime.swift
          git commit -m "Preserve resumable local model downloads"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean

  verify:
    name: Critical verification
    runs-on: xcode-27
    # Build and test against the same iOS 27 SDK generation used by the
    # physical-device beta. GitHub's xcode-27 preview image includes Xcode 27
    # and the iOS 27 Simulator; ci/verify.sh still prints the selected version
    # into the job log so every run records its exact toolchain.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Build once, run contracts, units, and critical UI journeys
        run: bash ci/verify.sh
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-critical
          if-no-files-found: warn
          retention-days: 14

  screenshot-tour:
    name: Synchronized visual proof
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_screenshot_tour)
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run NovaForge visual census
        run: bash ci/pipeline.sh

  release-suite:
    name: Exhaustive release verification
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release_suite)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run every NovaForge unit and UI test
        env:
          NOVAFORGE_TEST_LANE: release
          XCODEBUILD_CAP_MINUTES: 80
        run: bash ci/verify.sh
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-release
          if-no-files-found: warn
          retention-days: 14
