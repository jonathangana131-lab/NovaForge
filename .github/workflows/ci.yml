name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      run_screenshot_tour:
        description: Run the synchronized major-surface screenshot census
        required: false
        default: false
        type: boolean
      run_release_suite:
        description: Run every unit and UI journey
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-ui-patch:
    name: One-shot provider UI contract patch
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/provider-ui-main-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v6
        with:
          ref: main
          path: controller
          fetch-depth: 1
      - name: Check out clean repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          path: source
          fetch-depth: 0
      - name: Execute reviewed patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('controller/.github/workflows/one-shot-provider-ui-patch.yml').read_text()
          start_marker = '      - name: Align UI contracts with public phone providers\n        run: |\n'
          end_marker = '\n      - name: Commit UI contract correction\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('trusted patch markers are missing or ambiguous')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          subprocess.run(['bash', '-lc', script], cwd='source', check=True)
          PY
      - name: Commit corrected UI contracts
        working-directory: source
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPadUITests/AgentPadUITests.swift
          git diff --cached --check
          git commit -m "Align provider UI tests with public phone routes"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean

  verify:
    name: Critical verification
    runs-on: macos-26
    # The critical lane now builds once and exercises the expanded harness,
    # provider-contract, persistence, and Simulator journey matrix. Recent
    # healthy runs finish near 43 minutes, so leave enough headroom for normal
    # hosted-runner variance instead of cancelling a correct verification.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Build once, run contracts, units, and critical UI journeys
        run: bash ci/verify.sh
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-critical
          if-no-files-found: warn
          retention-days: 14

  screenshot-tour:
    name: Synchronized visual proof
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_screenshot_tour)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run NovaForge visual census
        run: bash ci/pipeline.sh

  release-suite:
    name: Exhaustive release verification
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release_suite)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run every NovaForge unit and UI test
        env:
          NOVAFORGE_TEST_LANE: release
          XCODEBUILD_CAP_MINUTES: 80
        run: bash ci/verify.sh
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-release
          if-no-files-found: warn
          retention-days: 14
