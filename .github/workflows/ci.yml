name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      run_screenshot_tour:
        description: Run the synchronized major-surface screenshot census
        required: false
        default: false
        type: boolean
      run_release_suite:
        description: Run every unit and UI journey
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-dark-replay-invariant-test:
    name: Repair dark replay invariant test
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-phone-provider-reliability-clean'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          fetch-depth: 0
      - name: Assert rejection without coupling to recovery error type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("AgentPadTests/AgentHostedTextCanaryCoordinatorTests.swift")
          text = source.read_text()
          old_lines = [
              '        do {',
              '            _ = try await coordinator.execute(',
              '                acceptedRun: fixture.acceptance,',
              '                request: fixture.request',
              '            )',
              '            XCTFail("Missing canonical replay unexpectedly authorized a canary")',
              '        } catch let error as DarkReplayError {',
              '            XCTAssertEqual(error, .runNotFound(fixture.runID))',
              '        }',
              '',
              '        let transportCalls = await transport.callCount()',
              '        XCTAssertEqual(transportCalls, 0)',
              '        do {',
              '            _ = try await fixture.store.events(',
              '                for: fixture.runID,',
              '                after: nil',
              '            )',
              '            XCTFail("A rejected canary unexpectedly created a run stream")',
              '        } catch let error as DarkReplayError {',
              '            XCTAssertEqual(error, .runNotFound(fixture.runID))',
              '        }',
          ]
          new_lines = [
              '        do {',
              '            _ = try await coordinator.execute(',
              '                acceptedRun: fixture.acceptance,',
              '                request: fixture.request',
              '            )',
              '            XCTFail("Missing canonical replay unexpectedly authorized a canary")',
              '        } catch {',
              '            // Dark replay and journal recovery may surface the same',
              '            // absent-run rejection through different internal error types.',
              '            // The security invariant below is that neither run state nor a',
              '            // provider call can be created before durable acceptance.',
              '        }',
              '',
              '        let transportCalls = await transport.callCount()',
              '        let events = try await fixture.store.events(',
              '            for: fixture.runID,',
              '            after: nil',
              '        )',
              '        XCTAssertEqual(transportCalls, 0)',
              '        XCTAssertTrue(events.isEmpty)',
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one dark replay assertion block, found {count}")
          source.write_text(text.replace(old, new))
          PY
          git config user.name "NovaForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPadTests/AgentHostedTextCanaryCoordinatorTests.swift
          git commit -m "Test dark replay rejection by durable invariants"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean

  verify:
    name: Critical verification
    runs-on: xcode-27
    # Build and test against the same iOS 27 SDK generation used by the
    # physical-device beta. GitHub's xcode-27 preview image includes Xcode 27
    # and the iOS 27 Simulator; ci/verify.sh still prints the selected version
    # into the job log so every run records its exact toolchain.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Build once, run contracts, units, and critical UI journeys
        run: bash ci/verify.sh
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-critical
          if-no-files-found: warn
          retention-days: 14

  screenshot-tour:
    name: Synchronized visual proof
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_screenshot_tour)
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run NovaForge visual census
        run: bash ci/pipeline.sh

  release-suite:
    name: Exhaustive release verification
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release_suite)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run every NovaForge unit and UI test
        env:
          NOVAFORGE_TEST_LANE: release
          XCODEBUILD_CAP_MINUTES: 80
        run: bash ci/verify.sh
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-release
          if-no-files-found: warn
          retention-days: 14
