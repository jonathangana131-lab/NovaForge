name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      run_screenshot_tour:
        description: Run the synchronized major-surface screenshot census
        required: false
        default: false
        type: boolean
      run_release_suite:
        description: Run every unit and UI journey
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-legacy-provider-ui-test:
    name: Repair legacy provider UI test
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-phone-provider-reliability-clean'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          fetch-depth: 0
      - name: Convert stale device-code journey into migration proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("AgentPadUITests/AgentPadUITests.swift")
          text = source.read_text()
          start_marker = "    func testChatGPTDeviceCodeIsVisibleBeforeSafariHandoff() throws {\n"
          end_marker = "\n    func testComposerModelMenuUsesNativeGlassChooser() throws {\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    func testChatGPTDeviceCodeIsVisibleBeforeSafariHandoff() throws {
              let app = XCUIApplication()
              app.launchArguments = [
                  "--reset-ui",
                  "--settings-chatgpt-device-code",
              ]
              app.launch()

              XCTAssertTrue(app.otherElements["settingsRoot"].waitForExistence(timeout: 8))
              XCTAssertFalse(
                  app.buttons["settingsProvider-openAICodex"].exists,
                  "Legacy ChatGPT state must not restore the private provider choice."
              )
              XCTAssertFalse(app.staticTexts["ChatGPT subscription"].exists)
              XCTAssertFalse(app.staticTexts["TEST-CODE"].exists)
              XCTAssertFalse(app.buttons["Copy code & open Safari"].exists)

              let zenProvider = app.buttons["settingsProvider-openCodeZen"]
              XCTAssertTrue(
                  zenProvider.waitForExistence(timeout: 5),
                  "Legacy ChatGPT state should repair to the public Zen route."
              )
              zenProvider.tap()
              let modelPicker = app.buttons["modelPickerButton"]
              if !modelPicker.waitForExistence(timeout: 2) { app.swipeUp() }
              XCTAssertTrue(modelPicker.waitForExistence(timeout: 5))
              XCTAssertTrue(
                  modelPicker.label.localizedCaseInsensitiveContains("mimo") ||
                      app.staticTexts["mimo-v2.5-free"].exists,
                  "The repaired Zen route should select its safe free model."
              )
              capture("38b-settings-legacy-chatgpt-migrates-to-zen", app: app)
          }
          '''
          source.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name "NovaForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPadUITests/AgentPadUITests.swift
          git commit -m "Cover legacy ChatGPT migration in release UI tests"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean

  verify:
    name: Critical verification
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Build once, run contracts, units, and critical UI journeys
        run: bash ci/verify.sh
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-critical
          if-no-files-found: warn
          retention-days: 14

  screenshot-tour:
    name: Synchronized visual proof
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_screenshot_tour)
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run NovaForge visual census
        run: bash ci/pipeline.sh

  release-suite:
    name: Exhaustive release verification
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release_suite)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run every NovaForge unit and UI test
        env:
          NOVAFORGE_TEST_LANE: release
          XCODEBUILD_CAP_MINUTES: 80
        run: bash ci/verify.sh
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-release
          if-no-files-found: warn
          retention-days: 14
