name: Temporary V14 Preview Composer Local truth recovery

on:
  push:
    branches:
      - gpt56-sol-preview-composer-local-truth-0814

permissions:
  contents: write

jobs:
  recover-composer-local-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recompose exact reviewed Composer truth delta
        shell: bash
        run: |
          set -euo pipefail
          base=37b5305c459907917d1f27ddc7f08168a68c4bbe
          donor=178e4d579a01ab2b65ad31b532aa0d5f123939f5
          git fetch --no-tags origin "$base" "$donor"
          git diff --binary "$base" "$donor" -- \
            AgentPad/Views/ChatComposer.swift \
            scripts/verify_v14_preview_composer_local_truth.sh \
            .github/workflows/v14-preview-composer-local-truth.yml \
            > /tmp/composer-local-truth.patch
          test -s /tmp/composer-local-truth.patch
          git apply --3way /tmp/composer-local-truth.patch
          rm .github/workflows/_temp_v14_preview_composer_local_truth_recover.yml

      - name: Validate current-main truth tree
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_v14_preview_composer_local_truth.sh
          bash scripts/verify_v14_preview_effort_contract.sh
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'AgentPad/Views/ChatComposer.swift',
              'scripts/verify_v14_preview_composer_local_truth.sh',
              '.github/workflows/v14-preview-composer-local-truth.yml',
              '.github/workflows/_temp_v14_preview_composer_local_truth_recover.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected Composer truth recovery scope: expected={sorted(expected)} actual={sorted(actual)}')
          composer = open('AgentPad/Views/ChatComposer.swift', encoding='utf-8').read()
          forbidden = ['iPhone 12 safe', 'Recommended for iPhone 12']
          required = ['On-device profile', 'Default local profile · qualification pending']
          for needle in forbidden:
              if needle in composer:
                  raise SystemExit(f'unqualified Composer claim remains: {needle}')
          for needle in required:
              if needle not in composer:
                  raise SystemExit(f'expected truthful Composer copy missing: {needle}')
          print('V14 Preview Composer Local truth recovery: PASS')
          PY

      - name: Publish product head and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovaForge Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preview: remove unqualified iPhone 12 claims from Composer"
          git push origin HEAD:gpt56-sol-preview-composer-local-truth-0814
