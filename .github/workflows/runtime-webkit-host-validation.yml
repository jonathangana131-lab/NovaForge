name: Runtime WebKit host exact-product validation

on:
  pull_request:
    paths:
      - "Packages/ForgeRuntimeKit/**"
      - "Packages/ForgeRuntimeWebKitHost/**"
      - ".github/workflows/runtime-webkit-host-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: WebKit host Debug + Release
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Assert exact product parent
        env:
          EXPECTED_PRODUCT_HEAD: 1d5a637f7c76a3e502f98ca6fc7c10db1b0bfb6b
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_HEAD"
          git diff --check "$EXPECTED_PRODUCT_HEAD"
      - name: Debug package contracts
        run: swift test --package-path Packages/ForgeRuntimeWebKitHost -Xswiftc -warnings-as-errors
      - name: Release package contracts
        run: swift test --package-path Packages/ForgeRuntimeWebKitHost -c release -Xswiftc -warnings-as-errors
      - name: Cross-runtime replay regression
        run: swift test --package-path Packages/ForgeRuntimeWebKitHost --filter testAuthorizedInteractionCannotReplayAcrossRuntimeVersions -Xswiftc -warnings-as-errors
