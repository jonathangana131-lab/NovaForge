name: Provider repair controller

on:
  pull_request:
    branches:
      - agent/provider-repair-control
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: provider-repair-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-head:
    if: github.head_ref == 'agent/provider-migration-patch-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          fetch-depth: 0

      - name: Separate phone migration from durable provider repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected snippet exactly once, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          models = Path('AgentPad/Models/Models.swift')
          text = models.read_text()
          old = '''    @discardableResult
    func repairStaleModelSelection(now: Date = Date()) -> Bool {
        let decodedProvider = AIProvider(rawValue: providerRawValue ?? "")
        let selectedProvider = decodedProvider.flatMap {
            $0.isUserSelectable ? $0 : nil
        } ?? .openCodeZen
'''
          new = '''    /// Repairs the provider used for a fresh phone session without rewriting
    /// valid legacy provider state that durable recovery may still need.
    /// Only the retired private ChatGPT/Codex route migrates to anonymous Zen
    /// Free; unknown/corrupt data retains NovaForge's fail-safe Local behavior.
    @discardableResult
    func repairPhoneProviderSelection(now: Date = Date()) -> Bool {
        let previousProviderRawValue = providerRawValue
        let previousModelID = modelID
        switch AIProvider(rawValue: providerRawValue ?? "") {
        case .none:
            providerRawValue = AIProvider.local.rawValue
            modelID = AIProvider.local.defaultModel
        case .some(.openAICodex):
            providerRawValue = AIProvider.openCodeZen.rawValue
            modelID = AIProvider.openCodeZen.defaultModel
        case .some:
            break
        }
        let repaired = repairStaleModelSelection(now: now)
        let changed = repaired || previousProviderRawValue != providerRawValue ||
            previousModelID != modelID
        if changed { updatedAt = now }
        return changed
    }

    @discardableResult
    func repairStaleModelSelection(now: Date = Date()) -> Bool {
        let selectedProvider = AIProvider(rawValue: providerRawValue ?? "")
            ?? .local
'''
          if text.count(old) != 1:
              raise SystemExit('Models.swift provider repair snippet mismatch')
          models.write_text(text.replace(old, new, 1))

          launch = Path('AgentPad/Models/AppLaunchPersistence.swift')
          text = launch.read_text()
          old = '''        let previous = AgentSettingsPersistence.snapshot(settings)
        if AIProvider(rawValue: settings.providerRawValue ?? "") == nil {
            // Unknown/corrupt persisted data never authorized a network route.
            // Preserve NovaForge's existing fail-safe Local recovery contract.
            settings.providerRawValue = AIProvider.local.rawValue
        }
        let reportedChange = settings.repairStaleModelSelection(now: now)
'''
          new = '''        let previous = AgentSettingsPersistence.snapshot(settings)
        let reportedChange = settings.repairPhoneProviderSelection(now: now)
'''
          if text.count(old) != 1:
              raise SystemExit('AppRootPersistence launch repair snippet mismatch')
          text = text.replace(old, new, 1)
          old = '''        if AIProvider(rawValue: settings.providerRawValue ?? "") == nil {
            settings.providerRawValue = AIProvider.local.rawValue
        }
        _ = settings.repairStaleModelSelection(now: now)
'''
          new = '''        _ = settings.repairPhoneProviderSelection(now: now)
'''
          if text.count(old) != 1:
              raise SystemExit('AppRootLaunchRepair launch repair snippet mismatch')
          launch.write_text(text.replace(old, new, 1))

          replace_once(
              'AgentPad/Services/AIProvider.swift',
              '        guard self == .openAICodex else { return false }\n',
              '        guard self == .openAI || self == .openAICodex else { return false }\n',
              'GPT-5.6 alias boundary'
          )

          tests = Path('AgentPadTests/AgentSystemFreshRunRequestFactoryTests.swift')
          text = tests.read_text()
          old = '''    func testLegacyChatGPTSelectionRepairsToFreeZenOnPhone() {
        let settings = AgentSettings(
            provider: .openAICodex,
            modelID: "gpt-5.5"
        )

        XCTAssertTrue(settings.repairStaleModelSelection())
        XCTAssertEqual(settings.providerRawValue, AIProvider.openCodeZen.rawValue)
        XCTAssertEqual(settings.modelID, AIProvider.openCodeZen.defaultModel)
    }
'''
          new = '''    func testLegacyChatGPTSelectionRepairsToFreeZenOnPhone() {
        let settings = AgentSettings(
            provider: .openAICodex,
            modelID: "gpt-5.5"
        )

        XCTAssertTrue(settings.repairPhoneProviderSelection())
        XCTAssertEqual(settings.providerRawValue, AIProvider.openCodeZen.rawValue)
        XCTAssertEqual(settings.modelID, AIProvider.openCodeZen.defaultModel)
    }

    func testGenericRepairPreservesLegacyCustomProvider() {
        let settings = AgentSettings(
            provider: .custom,
            modelID: AIProvider.local.defaultModel
        )

        XCTAssertTrue(settings.repairStaleModelSelection())
        XCTAssertEqual(settings.providerRawValue, AIProvider.custom.rawValue)
        XCTAssertEqual(settings.modelID, AIProvider.custom.defaultModel)
    }
'''
          if text.count(old) != 1:
              raise SystemExit('phone migration test snippet mismatch')
          tests.write_text(text.replace(old, new, 1))

          replace_once(
              'AgentPad/Services/AgentSystemPresentationStore.swift',
              '            "This provider or model is not available for agent runs. Choose OpenCode Zen, OpenAI, ChatGPT, or Local in Control."\n',
              '            "This provider or model is not available for agent runs. Choose OpenCode Zen, OpenAI, or Local in Control."\n',
              'provider unsupported copy'
          )
          PY
          git diff --check

      - name: Commit correction to repair branch
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            AgentPad/Models/Models.swift \
            AgentPad/Models/AppLaunchPersistence.swift \
            AgentPad/Services/AIProvider.swift \
            AgentPad/Services/AgentSystemPresentationStore.swift \
            AgentPadTests/AgentSystemFreshRunRequestFactoryTests.swift
          git commit -m "Separate phone provider migration from durable repair"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean
