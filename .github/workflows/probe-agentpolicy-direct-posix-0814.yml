name: Probe AgentPolicy Darwin Glibc signature parity

on:
  push:
    branches:
      - validation/GPT56-SOL-NF-V14-POLICY-POSIX-0814/direct-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "787b39e6bbe6bd9f353699b8f0062e1f786f1476"
      - name: Apply disposable direct-import transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('Packages/AgentHarnessKit')
          manifest = root/'Package.swift'
          text = manifest.read_text()
          old = '''        .target(
              name: "AgentPolicy",
              dependencies: ["AgentDomain", "AgentTools"]
          ),'''
          new = '''        .target(
              name: "AgentPolicy",
              dependencies: [
                  "AgentDomain",
                  "AgentTools",
                  .product(name: "Crypto", package: "swift-crypto"),
              ]
          ),'''
          if old not in text:
              raise SystemExit('AgentPolicy manifest preimage not found')
          manifest.write_text(text.replace(old, new, 1))

          policy = root/'Sources/AgentPolicy'
          crypto = [policy/'DurableApproval.swift', policy/'PolicyCanonicalDigest.swift']
          darwin = [
              policy/'FileMutationEffectLifecycleStore.swift',
              policy/'FilePolicyAuthorityStore.swift',
              policy/'WorkspaceMutationProcessArbiter.swift',
          ]
          for p in crypto:
              s = p.read_text()
              if s.count('import CryptoKit') != 1:
                  raise SystemExit(f'unexpected CryptoKit count in {p}')
              p.write_text(s.replace('import CryptoKit', 'import Crypto', 1))
          platform_import = '''#if canImport(Darwin)
          import Darwin
          #elseif canImport(Glibc)
          import Glibc
          #else
          #error("AgentPolicy requires a POSIX libc")
          #endif'''
          for p in darwin:
              s = p.read_text()
              if s.count('import Darwin') != 1:
                  raise SystemExit(f'unexpected Darwin import count in {p}')
              s = s.replace('import Darwin', platform_import, 1)
              s = s.replace('Darwin.', '')
              p.write_text(s)
          PY
          git diff --check
          ! grep -R -n -E '^import (CryptoKit|Darwin)$|Darwin\.' Packages/AgentHarnessKit/Sources/AgentPolicy
      - name: Compile transformed full package
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/AgentHarnessKit -Xswiftc -warnings-as-errors
