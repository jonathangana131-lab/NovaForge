name: V14 Preview Ultra Patch E2

on:
  push:
    branches:
      - worker/GPT56-SOL-NF-V14-PREVIEW-EFFORT-0810/ultra-label/e2
    paths:
      - .github/workflows/v14-preview-ultra-patch-e2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch user-facing Ultra label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('AgentPad'), Path('AgentPadTests'), Path('Packages')]
          changed = []
          before = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.swift')):
                  text = path.read_text()
                  if 'UltraCode' in text:
                      for number, line in enumerate(text.splitlines(), 1):
                          if 'UltraCode' in line:
                              before.append(f'{path}:{number}:{line.strip()}')
                  updated = text.replace('"UltraCode"', '"Ultra"')
                  if updated != text:
                      path.write_text(updated)
                      changed.append(str(path))

          print('BEFORE')
          print('\n'.join(before) if before else '(none)')
          print('CHANGED')
          print('\n'.join(changed) if changed else '(none)')
          if changed != ['AgentPad/Services/AIProvider.swift', 'AgentPad/Views/ChatComposer.swift']:
              raise SystemExit(f'Unexpected scoped product files changed: {changed}')

          remaining = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.swift')):
                  text = path.read_text()
                  for number, line in enumerate(text.splitlines(), 1):
                      if '"UltraCode"' in line:
                          remaining.append(f'{path}:{number}:{line.strip()}')
          if remaining:
              raise SystemExit('Remaining exact user-facing UltraCode literals:\n' + '\n'.join(remaining))
          PY
          git diff --check
          git diff -- AgentPad/Services/AIProvider.swift AgentPad/Views/ChatComposer.swift
      - name: Commit scoped product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -- AgentPad/Services/AIProvider.swift AgentPad/Views/ChatComposer.swift
          git commit -m "[V14] Present strongest Preview effort mode as Ultra"
          git push origin "HEAD:${GITHUB_REF_NAME}"
