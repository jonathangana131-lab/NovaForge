name: Final Qwen 3.8 iOS 27 Stage

on:
  push:
    branches: [validation/qwen38-finalstage]
    paths:
      - 'ci/apply_ios27_target.py'
      - '.github/workflows/finalstage-xcode27.yml'
      - 'Vendor/swift-llama-cpp/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwen38-finalstage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/qwen38-finalstage
          fetch-depth: 1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Apply iOS 27-only deployment contract
        run: python3 ci/apply_ios27_target.py
      - name: Verify deployment contract
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 27.0;' AgentPad.xcodeproj/project.pbxproj
          if grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 26.0;' AgentPad.xcodeproj/project.pbxproj; then
            echo 'iOS 26 deployment target remains' >&2
            exit 1
          fi
      - name: Compile complete SwiftLlama graph
        working-directory: Vendor/swift-llama-cpp
        run: |
          set -euo pipefail
          swift package resolve
          swift build --build-tests
      - name: Compile final-stage AgentPad
        run: |
          set -euo pipefail
          xcodebuild \
            -project AgentPad.xcodeproj \
            -scheme AgentPad \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/qwen38-finalstage-build.log
      - name: Commit iOS 27 project contract
        run: |
          set -euo pipefail
          if git diff --quiet -- AgentPad.xcodeproj/project.pbxproj; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPad.xcodeproj/project.pbxproj
          git commit -m 'Require iOS 27 for Qwen 3.8 build'
          git push origin HEAD:validation/qwen38-finalstage
      - name: Upload build receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen38-finalstage-build-${{ github.run_id }}
          path: /tmp/qwen38-finalstage-build.log
          if-no-files-found: warn
          retention-days: 7
