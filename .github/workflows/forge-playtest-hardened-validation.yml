name: Forge Playtest hardened exact-product validation

on:
  pull_request:
    paths:
      - ".github/workflows/forge-playtest-hardened-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Forge Playtest hardened exact product
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact product parent and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected_product="e1b33a8dc5ff3d53e27974517a0a5396b76e55c4"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_product"
          changed="$(git diff --name-only "$expected_product"..HEAD)"
          test "$changed" = ".github/workflows/forge-playtest-hardened-validation.yml"
          git diff --check "$expected_product"..HEAD
      - name: Test ForgePlaytestCore Debug
        run: swift test --package-path Packages/ForgePlaytestCore -Xswiftc -warnings-as-errors
      - name: Test ForgePlaytestCore Release
        run: swift test --package-path Packages/ForgePlaytestCore -c release -Xswiftc -warnings-as-errors
