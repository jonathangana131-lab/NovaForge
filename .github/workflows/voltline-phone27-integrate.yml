name: Voltline PhoneOS 27 Integration

on:
  push:
    branches:
      - codex/voltline-authentic-displays
    paths:
      - .github/workflows/voltline-phone27-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voltline-authentic-displays
      - name: Replace PhoneOS shell and cockpit HUD
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phone_path = Path('Voltline/App/Sources/PhoneOSView.swift')
          source = phone_path.read_text()
          marker = 'private struct PhoneAppRouter: View {'
          assert marker in source
          remainder = marker + source.split(marker, 1)[1]

          prefix = r'''import SwiftUI

struct PhoneOSView: View {
    @ObservedObject var session: GameSession
    @State private var dragOrigin: CGSize = .zero
    @Namespace private var glassNamespace

    var body: some View {
        GeometryReader { proxy in
            let phoneHeight = min(366.0, max(320.0, proxy.size.height - 18.0))
            let phoneWidth = phoneHeight * (9.0 / 19.5)
            let baseX = proxy.size.width - phoneWidth * 0.5 - 13.0
            let baseY = proxy.size.height * 0.5

            phone(width: phoneWidth, height: phoneHeight, proxy: proxy, baseX: baseX, baseY: baseY)
                .position(x: baseX, y: baseY)
                .offset(session.phoneOffset)
        }
        .onAppear { dragOrigin = session.phoneOffset }
    }

    private func phone(
        width: CGFloat,
        height: CGFloat,
        proxy: GeometryProxy,
        baseX: CGFloat,
        baseY: CGFloat
    ) -> some View {
        ZStack {
            RoundedRectangle(cornerRadius: width * 0.19, style: .continuous)
                .fill(Color.black)

            VStack(spacing: 0) {
                phoneStatusBar(proxy: proxy, phoneWidth: width, phoneHeight: height, baseX: baseX, baseY: baseY)

                PhoneAppRouter(session: session)
                    .frame(maxWidth: .infinity, maxHeight: .infinity)
                    .background(
                        LinearGradient(
                            colors: [
                                Color(red: 0.035, green: 0.055, blue: 0.10),
                                Color(red: 0.015, green: 0.018, blue: 0.035),
                                .black
                            ],
                            startPoint: .topLeading,
                            endPoint: .bottomTrailing
                        )
                    )

                phoneDock
                    .padding(.horizontal, 8)
                    .padding(.bottom, 7)
            }
            .padding(5)
            .clipShape(RoundedRectangle(cornerRadius: width * 0.16, style: .continuous))

            RoundedRectangle(cornerRadius: width * 0.19, style: .continuous)
                .stroke(
                    LinearGradient(
                        colors: [.white.opacity(0.32), .gray.opacity(0.18), .black, .white.opacity(0.12)],
                        startPoint: .topLeading,
                        endPoint: .bottomTrailing
                    ),
                    lineWidth: 1.5
                )
                .allowsHitTesting(false)

            VStack {
                Capsule()
                    .fill(.black)
                    .frame(width: width * 0.31, height: max(12, width * 0.075))
                    .overlay(alignment: .trailing) {
                        Circle()
                            .fill(Color(red: 0.03, green: 0.08, blue: 0.13))
                            .frame(width: max(5, width * 0.028))
                            .padding(.trailing, 7)
                    }
                    .padding(.top, 7)
                Spacer()
            }
            .allowsHitTesting(false)
        }
        .frame(width: width, height: height)
        .shadow(color: .black.opacity(0.82), radius: 26, y: 12)
        .accessibilityElement(children: .contain)
        .accessibilityIdentifier("phoneOS")
    }

    private func phoneStatusBar(
        proxy: GeometryProxy,
        phoneWidth: CGFloat,
        phoneHeight: CGFloat,
        baseX: CGFloat,
        baseY: CGFloat
    ) -> some View {
        HStack(spacing: 6) {
            Text(phoneTime)
                .font(.system(size: 9, weight: .bold, design: .rounded))

            Spacer(minLength: 46)

            HStack(spacing: 4) {
                Image(systemName: "antenna.radiowaves.left.and.right")
                Image(systemName: "wifi")
                Image(systemName: "battery.75percent")
            }
            .font(.system(size: 7.5, weight: .bold))

            Button {
                session.togglePhone()
            } label: {
                Image(systemName: "xmark")
                    .font(.system(size: 9, weight: .black))
                    .frame(width: 20, height: 20)
            }
            .buttonStyle(.plain)
            .accessibilityIdentifier("closePhoneButton")
        }
        .padding(.horizontal, 10)
        .padding(.top, 8)
        .frame(height: 31)
        .contentShape(Rectangle())
        .gesture(
            DragGesture(minimumDistance: 8)
                .onChanged { value in
                    let proposed = CGSize(
                        width: dragOrigin.width + value.translation.width,
                        height: dragOrigin.height + value.translation.height
                    )
                    let minX = phoneWidth * 0.5 + 8 - baseX
                    let maxX = proxy.size.width - phoneWidth * 0.5 - 8 - baseX
                    let minY = phoneHeight * 0.5 + 8 - baseY
                    let maxY = proxy.size.height - phoneHeight * 0.5 - 8 - baseY
                    session.setPhoneOffset(CGSize(
                        width: min(max(proposed.width, minX), maxX),
                        height: min(max(proposed.height, minY), maxY)
                    ))
                }
                .onEnded { _ in dragOrigin = session.phoneOffset }
        )
    }

    @ViewBuilder
    private var phoneDock: some View {
        if #available(iOS 26.0, *) {
            GlassEffectContainer(spacing: 8) {
                HStack(spacing: 8) {
                    dockButton(.home, symbol: "square.grid.3x3.fill")
                    dockButton(.messages, symbol: "message.fill")
                    dockButton(.scooter, symbol: "scooter")
                    dockButton(.market, symbol: "bag.fill")
                }
            }
            .frame(height: 45)
        } else {
            HStack(spacing: 8) {
                fallbackDockButton(.home, symbol: "square.grid.3x3.fill")
                fallbackDockButton(.messages, symbol: "message.fill")
                fallbackDockButton(.scooter, symbol: "scooter")
                fallbackDockButton(.market, symbol: "bag.fill")
            }
            .frame(height: 45)
            .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 21, style: .continuous))
        }
    }

    @available(iOS 26.0, *)
    private func dockButton(_ app: PhoneApp, symbol: String) -> some View {
        Button {
            withAnimation(.spring(response: 0.34, dampingFraction: 0.82)) {
                session.selectedPhoneApp = app
            }
        } label: {
            Image(systemName: symbol)
                .font(.system(size: 14, weight: .semibold))
                .frame(width: 31, height: 31)
        }
        .buttonStyle(.glass)
        .glassEffectID(app.rawValue, in: glassNamespace)
    }

    private func fallbackDockButton(_ app: PhoneApp, symbol: String) -> some View {
        Button {
            session.selectedPhoneApp = app
        } label: {
            Image(systemName: symbol)
                .font(.system(size: 14, weight: .semibold))
                .frame(width: 31, height: 31)
                .background(.white.opacity(0.09), in: Circle())
        }
        .buttonStyle(.plain)
    }

    private var phoneTime: String {
        let totalMinutes = Int(session.gameSeconds / 4).quotientAndRemainder(dividingBy: 24 * 60).remainder
        let hour = totalMinutes / 60
        let minute = totalMinutes % 60
        return String(format: "%d:%02d", hour == 0 ? 12 : (hour > 12 ? hour - 12 : hour), minute)
    }
}

'''

          source = prefix + remainder
          source = source.replace(
              'private let columns = Array(repeating: GridItem(.flexible(), spacing: 10), count: 4)',
              'private let columns = Array(repeating: GridItem(.flexible(), spacing: 8), count: 3)',
              1,
          )
          source = source.replace('.font(.system(size: 19, weight: .semibold))', '.font(.system(size: 16, weight: .semibold))', 1)
          source = source.replace('.frame(width: 43, height: 43)', '.frame(width: 38, height: 38)', 1)
          source = source.replace('.padding(15)', '.padding(10)', 1)
          phone_path.write_text(source)

          root_path = Path('Voltline/App/Sources/GameRootView.swift')
          root = root_path.read_text()
          root = root.replace(
              '''                HStack(alignment: .top, spacing: 12) {
                    ScooterDashboardView(session: session)
                        .accessibilityIdentifier("scooterDashboard")

                    Spacer(minLength: 10)

                    VStack(alignment: .trailing, spacing: 9) {''',
              '''                HStack(alignment: .top, spacing: 12) {
                    Spacer(minLength: 10)

                    VStack(alignment: .trailing, spacing: 9) {''',
              1,
          )
          root = root.replace(
              '''                HStack(alignment: .bottom, spacing: 12) {
                    TelemetryCard(session: session)

                    Spacer()

                    TouchDrivingControls(session: session)
                }''',
              '''                HStack(alignment: .bottom, spacing: 12) {
                    Spacer()
                    TouchDrivingControls(session: session)
                }''',
              1,
          )
          root = root.replace(
              '''            if session.showPhone {
                PhoneOSView(session: session)''',
              '''            if session.camera == .pov && session.selectedScooterID == ScooterCatalogItem.maxshot.id {
                MaxshotFirstPersonCockpitView(session: session)
                    .allowsHitTesting(false)
                    .accessibilityIdentifier("maxshotFirstPersonCockpit")
                    .zIndex(8)
            }

            if session.showPhone {
                PhoneOSView(session: session)''',
              1,
          )
          root_path.write_text(root)
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "voltline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add Voltline/App/Sources/PhoneOSView.swift Voltline/App/Sources/GameRootView.swift
          git diff --cached --quiet && exit 0
          git commit -m "Integrate authentic POV cockpit and PhoneOS 27 shell"
          git push origin HEAD:codex/voltline-authentic-displays
