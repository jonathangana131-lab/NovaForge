name: V14 Mission persistence final validation only

on:
  push:
    branches:
      - validation/GPT56-NF-V14-MISSION-CLOSER-8A08/persistence-final-58af

permissions:
  contents: read

jobs:
  mission-persistence-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build signature-faithful Mission persistence harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$RUNNER_TEMP/novaforge-mission-persistence-harness"
          rm -rf "$HARNESS"
          mkdir -p "$HARNESS/Sources" "$HARNESS/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$HARNESS/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Sources/ForgeMission "$HARNESS/Sources/ForgeMission"
          cp -R Packages/AgentHarnessKit/Sources/AgentReducerCore "$HARNESS/Sources/AgentReducerCore"
          cp -R Packages/AgentHarnessKit/Sources/AgentStore "$HARNESS/Sources/AgentStore"
          cp -R Packages/AgentHarnessKit/Tests/AgentStoreTests "$HARNESS/Tests/AgentStoreTests"
          cat > "$HARNESS/Package.swift" <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "NovaForgeMissionPersistenceValidation",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
                  .library(name: "ForgeMission", targets: ["ForgeMission"]),
                  .library(name: "AgentReducerCore", targets: ["AgentReducerCore"]),
                  .library(name: "AgentStore", targets: ["AgentStore"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .target(name: "ForgeMission", dependencies: ["AgentDomain"]),
                  .target(name: "AgentReducerCore", dependencies: ["AgentDomain"]),
                  .target(name: "AgentStore", dependencies: ["AgentDomain", "AgentReducerCore", "ForgeMission"]),
                  .testTarget(name: "AgentStoreTests", dependencies: ["AgentDomain", "AgentStore", "ForgeMission"]),
              ]
          )
          EOF
      - name: Persistence debug warnings-as-errors
        run: swift test --package-path "$RUNNER_TEMP/novaforge-mission-persistence-harness" -Xswiftc -warnings-as-errors
      - name: Persistence release warnings-as-errors
        run: swift test --package-path "$RUNNER_TEMP/novaforge-mission-persistence-harness" -c release -Xswiftc -warnings-as-errors

  real-manifest-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Resolve real AgentHarnessKit manifest
        run: swift package --package-path Packages/AgentHarnessKit describe >/dev/null
      - name: ForgeMission debug target warnings-as-errors
        run: swift build --package-path Packages/AgentHarnessKit --target ForgeMission -Xswiftc -warnings-as-errors
      - name: AgentStore debug target warnings-as-errors
        run: swift build --package-path Packages/AgentHarnessKit --target AgentStore -Xswiftc -warnings-as-errors
      - name: ForgeMission release target warnings-as-errors
        run: swift build --package-path Packages/AgentHarnessKit -c release --target ForgeMission -Xswiftc -warnings-as-errors
      - name: AgentStore release target warnings-as-errors
        run: swift build --package-path Packages/AgentHarnessKit -c release --target AgentStore -Xswiftc -warnings-as-errors
