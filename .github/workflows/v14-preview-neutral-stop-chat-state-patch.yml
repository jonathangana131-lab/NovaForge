name: One-shot neutral stop chat state patch

on:
  push:
    branches:
      - agent/v14-preview-neutral-stop-chat-state
    paths:
      - '.github/workflows/v14-preview-neutral-stop-chat-state-patch.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-neutral-stop-chat-state-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-preview-neutral-stop-chat-state
          fetch-depth: 0

      - name: Patch canonical stopped-run presentation truth
        run: |
          python3 scripts/one_shot_neutral_stop_chat_state_patch.py
          git diff --check
          grep -F 'AgentCanonicalRunSurfacePolicy.presentsFailure(' AgentPad/Views/ChatView.swift
          grep -F 'AgentCanonicalRunSurfacePolicy.requiresRecoveryAction(' AgentPad/Views/ChatView.swift
          grep -F 'case .failed, .rejected, .interrupted:' AgentPad/Views/AgentCanonicalActivityPresentation.swift
          grep -F 'AgentCanonicalRunSurfacePolicy.presentsFailure(.cancelled)' AgentPadTests/AgentCanonicalActivityPresentationTests.swift

      - name: Commit product repair and remove one-shot files
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/v14-preview-neutral-stop-chat-state-patch.yml
          rm scripts/one_shot_neutral_stop_chat_state_patch.py
          git add AgentPad/Views/ChatView.swift AgentPad/Views/AgentCanonicalActivityPresentation.swift AgentPadTests/AgentCanonicalActivityPresentationTests.swift .github/workflows/v14-preview-neutral-stop-chat-state-patch.yml scripts/one_shot_neutral_stop_chat_state_patch.py
          git commit -m "Preview: keep stopped chat runs neutral"
          git push origin HEAD:agent/v14-preview-neutral-stop-chat-state
