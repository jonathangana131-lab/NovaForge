name: One-shot chat delete corrupt draft patch

on:
  push:
    branches:
      - gpt56-sol-preview-chat-delete-draft-0810
    paths:
      - '.github/workflows/one-shot-chat-delete-corrupt-draft.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-chat-delete-corrupt-draft
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56-sol-preview-chat-delete-draft-0810
          fetch-depth: 0

      - name: Repair malformed draft cleanup and add XCTest
        run: |
          python3 scripts/one_shot_chat_delete_corrupt_draft_patch.py
          git diff --check
          grep -F 'let storedValue = defaults.object(forKey: Self.storageKey)' AgentPad/Models/Models.swift
          grep -F 'defaults.removeObject(forKey: Self.storageKey)' AgentPad/Models/Models.swift
          grep -F 'func testDeletedConversationDraftClearsMalformedStorageAndInstallsTombstone() throws {' AgentPadTests/AgentRuntimeLifecycleTests.swift

      - name: Commit repair and remove one-shot files
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/one-shot-chat-delete-corrupt-draft.yml
          rm scripts/one_shot_chat_delete_corrupt_draft_patch.py
          git add AgentPad/Models/Models.swift AgentPadTests/AgentRuntimeLifecycleTests.swift .github/workflows/one-shot-chat-delete-corrupt-draft.yml scripts/one_shot_chat_delete_corrupt_draft_patch.py
          git commit -m "Clear corrupt drafts after chat deletion"
          git push origin HEAD:gpt56-sol-preview-chat-delete-draft-0810
