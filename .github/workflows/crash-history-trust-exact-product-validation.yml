name: Crash history trust exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/crash-history-trust-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f52f84e9f7b1751a20688e04b0815d07986fc9aa"
          git diff --check HEAD^

      - name: Debug Crash Doctor trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCrashDoctorCore \
            -Xswiftc -warnings-as-errors

      - name: Release Crash Doctor trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCrashDoctorCore \
            -c release \
            -Xswiftc -warnings-as-errors
