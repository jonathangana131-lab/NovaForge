name: TEMP V13 ProjectStore brace fix

on:
  push:
    branches:
      - 'worker/NF-V13-MIG-9A7C/project-store-app-cutover/e4'
    paths:
      - '.github/workflows/_temp_v13_project_store_brace_fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/worker/NF-V13-MIG-9A7C/project-store-app-cutover/e4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore selector function closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AgentPad/App/AgentPadApp.swift')
          text = path.read_text(encoding='utf-8')
          broken = "        }\n\n    private static func openCompatibilityContainer<Container>(\n"
          fixed = "        }\n    }\n\n    private static func openCompatibilityContainer<Container>(\n"
          if text.count(broken) != 1:
              raise SystemExit(f'unexpected selector closure preimage: {text.count(broken)} matches')
          text = text.replace(broken, fixed, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact structural repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only -- AgentPad/App/AgentPadApp.swift | wc -l | tr -d ' ')" = "1"
          test "$(grep -c 'ProjectStoreAuthorityPolicy.decide(' AgentPad/App/AgentPadApp.swift)" = "2"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('AgentPad/App/AgentPadApp.swift').read_text(encoding='utf-8')
          expected = "        }\n    }\n\n    private static func openCompatibilityContainer<Container>(\n"
          if text.count(expected) != 1:
              raise SystemExit('selector function closure was not restored exactly')
          PY
      - name: Commit repair and remove temporary fixer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_v13_project_store_brace_fix.yml
          git config user.name 'NovaForge V13 Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add AgentPad/App/AgentPadApp.swift .github/workflows/_temp_v13_project_store_brace_fix.yml
          git commit -m 'Restore launch selector function closure'
          git push origin HEAD:worker/NF-V13-MIG-9A7C/project-store-app-cutover/e4
