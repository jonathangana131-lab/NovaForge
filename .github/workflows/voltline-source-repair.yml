name: Voltline Source Repair

on:
  push:
    branches:
      - codex/voltline-release-parallel
      - codex/voltline-performance-parallel
    paths:
      - ".github/workflows/voltline-source-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rewrite traffic spawning with explicit types
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Voltline/App/Sources/GameSession.swift")
          source = path.read_text()
          pattern = re.compile(
              r"    private func buildTraffic\(\) \{.*?\n    \}\n\n    private func updateTraffic",
              re.DOTALL,
          )
          replacement = '''    private func buildTraffic() {
              var builtTraffic: [TrafficAgent] = []
              builtTraffic.reserveCapacity(10)
              for index in 0..<10 {
                  let evenLane = index.isMultiple(of: 2)
                  let laneX: Double = evenLane ? -3.4 : 3.4
                  let z: Double = Double(index * 34 - 130)
                  let speed: Double = Double(7 + index % 4)
                  let desiredSpeed: Double = Double(8 + index % 5)
                  let direction: Double = evenLane ? 1.0 : -1.0
                  let hue: Double = Double(index) / 10.0
                  let agent = TrafficAgent(
                      id: UUID(),
                      laneX: laneX,
                      z: z,
                      speedMetersPerSecond: speed,
                      desiredSpeedMetersPerSecond: desiredSpeed,
                      direction: direction,
                      bodyHue: hue
                  )
                  builtTraffic.append(agent)
              }
              traffic = builtTraffic

              var builtRiders: [ScooterRiderAgent] = []
              builtRiders.reserveCapacity(4)
              for index in 0..<4 {
                  let evenSide = index.isMultiple(of: 2)
                  let x: Double = evenSide ? -5.6 : 5.6
                  let z: Double = Double(index * 55 - 80)
                  let speed: Double = Double(5 + index)
                  let direction: Double = evenSide ? 1.0 : -1.0
                  let hue: Double = 0.12 + Double(index) * 0.18
                  let rider = ScooterRiderAgent(
                      id: UUID(),
                      x: x,
                      z: z,
                      speedMetersPerSecond: speed,
                      direction: direction,
                      scooterHue: hue
                  )
                  builtRiders.append(rider)
              }
              scooterRiders = builtRiders
          }

          private func updateTraffic'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one buildTraffic block, replaced {count}")
          path.write_text(updated)
          PY

      - name: Commit source repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Voltline/App/Sources/GameSession.swift
          git commit -m "Fix Xcode 26 traffic spawn type checking"
          git push origin "HEAD:${GITHUB_REF_NAME}"
