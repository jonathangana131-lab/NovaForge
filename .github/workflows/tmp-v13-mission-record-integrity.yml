name: Temporary V13 mission record integrity

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-stack-main-recovery/e1

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Harden durable record identity and verify
        shell: bash
        run: |
          set -euo pipefail
          base=ad7cc3761574fc7bb7d2ef1e8d30440774ff2e76
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-mission-record-integrity.yml"

          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, found {n}")
              return text.replace(old, new, 1)

          mission_path = Path('Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMission.swift')
          archive_path = Path('Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift')
          tests_path = Path('Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift')

          s = mission_path.read_text()
          s = once(s,
          '''    case acceptedCompletedStageWouldBeLost(MissionStageID)\n    case invalidRouteReceipt\n''',
          '''    case acceptedCompletedStageWouldBeLost(MissionStageID)\n    case acceptedRecordedStageWouldBeLost(MissionStageID)\n    case invalidRouteReceipt\n''',
          'recorded-stage error')

          s = once(s,
          '''        for gated in graph.stages where [.waitingForDecision, .blocked, .failedRecoverably].contains(gated.status) {\n            guard newByID[gated.stageID]?.status == gated.status else {\n                throw ForgeMissionError.invalidGraph\n            }\n        }\n        if let pendingDecision {\n''',
          '''        for gated in graph.stages where [.waitingForDecision, .blocked, .failedRecoverably].contains(gated.status) {\n            guard newByID[gated.stageID]?.status == gated.status else {\n                throw ForgeMissionError.invalidGraph\n            }\n        }\n        let recordedStageIDs = Set(\n            stageEvidence.map(\\.stageID) +\n            workerReceipts.map(\\.stageID) +\n            decisions.map(\\.stageID) +\n            recoveryRecords.map(\\.stageID)\n        )\n        for stageID in recordedStageIDs where newByID[stageID] == nil {\n            throw ForgeMissionError.acceptedRecordedStageWouldBeLost(stageID)\n        }\n        if let pendingDecision {\n''',
          'graph durable-record preservation')
          mission_path.write_text(s)

          a = archive_path.read_text()
          a = once(a,
          '''            missionID: state.missionID,\n            projectID: state.projectID\n        )\n\n        let activeStageIDs''',
          '''            missionID: state.missionID,\n            projectID: state.projectID,\n            knownStageIDs: Set(state.graph.stages.map(\\.stageID))\n        )\n        try validateCompletedStageEvidence(\n            stages: state.graph.stages,\n            stageEvidence: state.stageEvidence,\n            workerReceipts: state.workerReceipts\n        )\n\n        let activeStageIDs''',
          'current durable record validation')

          a = once(a,
          '''                missionID: checkpoint.missionID,\n                projectID: checkpoint.projectID\n            )\n            switch checkpoint.phase {\n''',
          '''                missionID: checkpoint.missionID,\n                projectID: checkpoint.projectID,\n                knownStageIDs: Set(checkpoint.graph.stages.map(\\.stageID))\n            )\n            try validateCompletedStageEvidence(\n                stages: checkpoint.graph.stages,\n                stageEvidence: checkpoint.stageEvidence,\n                workerReceipts: checkpoint.workerReceipts\n            )\n            switch checkpoint.phase {\n''',
          'checkpoint durable record validation')

          a = once(a,
          '''        recoveryRecords: [MissionRecoveryRecord],\n        missionID: MissionID,\n        projectID: ProjectID\n    ) throws {\n        guard stageEvidence.allSatisfy({\n            !$0.summary.trimmed.isEmpty &&\n            !$0.receiptIDs.values.isEmpty &&\n            $0.receiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty })\n        }) else { throw ForgeMissionArchiveError.invalidStageEvidence }\n        guard workerReceipts.allSatisfy({\n            $0.missionID == missionID &&\n            $0.projectID == projectID &&\n            !$0.summary.trimmed.isEmpty &&\n            $0.evidenceReceiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty })\n        }) else { throw ForgeMissionArchiveError.invalidWorkerReceipt }\n        guard decisions.allSatisfy({\n            !$0.acceptedAnswer.trimmed.isEmpty && !$0.decisionReceiptID.trimmed.isEmpty\n        }) else { throw ForgeMissionArchiveError.invalidDecisionRecord }\n        guard recoveryRecords.allSatisfy({ !$0.resolutionReceiptID.trimmed.isEmpty }) else {\n            throw ForgeMissionArchiveError.invalidRecoveryRecord\n        }\n    }\n''',
          '''        recoveryRecords: [MissionRecoveryRecord],\n        missionID: MissionID,\n        projectID: ProjectID,\n        knownStageIDs: Set<MissionStageID>\n    ) throws {\n        guard stageEvidence.allSatisfy({\n            knownStageIDs.contains($0.stageID) &&\n            !$0.summary.trimmed.isEmpty &&\n            !$0.receiptIDs.values.isEmpty &&\n            $0.receiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty })\n        }) else { throw ForgeMissionArchiveError.invalidStageEvidence }\n        guard workerReceipts.allSatisfy({\n            $0.missionID == missionID &&\n            $0.projectID == projectID &&\n            knownStageIDs.contains($0.stageID) &&\n            !$0.summary.trimmed.isEmpty &&\n            $0.evidenceReceiptIDs.values.allSatisfy({ !$0.trimmed.isEmpty })\n        }) else { throw ForgeMissionArchiveError.invalidWorkerReceipt }\n        guard decisions.allSatisfy({ record in\n            knownStageIDs.contains(record.stageID) &&\n            !record.acceptedAnswer.trimmed.isEmpty &&\n            !record.decisionReceiptID.trimmed.isEmpty &&\n            workerReceipts.contains(where: { $0.stageID == record.stageID && $0.kind == .needsDecision })\n        }) else { throw ForgeMissionArchiveError.invalidDecisionRecord }\n        guard recoveryRecords.allSatisfy({ record in\n            knownStageIDs.contains(record.stageID) &&\n            !record.resolutionReceiptID.trimmed.isEmpty &&\n            workerReceipts.contains(where: { receipt in\n                receipt.stageID == record.stageID &&\n                ((record.kind == .externalBlockResolved && receipt.kind == .blockedExternal) ||\n                 (record.kind == .recoverableFailureRetried && receipt.kind == .failedRecoverably))\n            })\n        }) else {\n            throw ForgeMissionArchiveError.invalidRecoveryRecord\n        }\n    }\n\n    private static func validateCompletedStageEvidence(\n        stages: [MissionStage],\n        stageEvidence: [MissionStageEvidence],\n        workerReceipts: [MissionAcceptedWorkerReceipt]\n    ) throws {\n        let completedStageIDs = Set(stages.lazy.filter { $0.status == .completed }.map(\\.stageID))\n        let evidencedStageIDs = Set(stageEvidence.map(\\.stageID))\n        guard evidencedStageIDs == completedStageIDs else {\n            throw ForgeMissionArchiveError.invalidStageEvidence\n        }\n        guard completedStageIDs.allSatisfy({ stageID in\n            workerReceipts.contains(where: { $0.stageID == stageID && $0.kind == .completed })\n        }), workerReceipts.lazy.filter({ $0.kind == .completed }).allSatisfy({ completedStageIDs.contains($0.stageID) }) else {\n            throw ForgeMissionArchiveError.invalidWorkerReceipt\n        }\n    }\n''',
          'durable record helper hardening')
          archive_path.write_text(a)

          t = tests_path.read_text()
          marker = '''    func testGraphReplacementCannotEraseOutstandingBlockGate() throws {\n'''
          insertion = '''    func testGraphReplacementCannotDropStageWithAcceptedDecisionHistory() throws {\n        var mission = try makeMission()\n        let stageID = try XCTUnwrap(mission.runnableStageIDs.first)\n        let lease = try mission.beginWork(on: [stageID])[0]\n        try mission.acceptWorkerResult(.init(lease: lease, outcome: .needsDecision, summary: "Choose camera"), at: instant(78))\n        let requestID = try XCTUnwrap(mission.pendingDecision?.requestID)\n        try mission.acceptDecision(\n            stageID: stageID,\n            decisionRequestID: requestID,\n            acceptedAnswer: "First person",\n            decisionReceiptID: "decision:camera:history",\n            at: instant(79)\n        )\n        let replacement = MissionStageGraph(missionID: mission.missionID, revision: mission.graph.revision + 1, stages: [])\n\n        XCTAssertThrowsError(try mission.replaceStageGraph(replacement)) { error in\n            XCTAssertEqual(error as? ForgeMissionError, .acceptedRecordedStageWouldBeLost(stageID))\n        }\n        XCTAssertNoThrow(try ForgeMissionArchive(state: mission))\n    }\n\n    func testArchiveRejectsCompletedStageWhenAcceptedEvidenceRecordIsRemoved() throws {\n        var mission = try makeMission()\n        let stageID = try XCTUnwrap(mission.runnableStageIDs.first)\n        let lease = try mission.beginWork(on: [stageID])[0]\n        try mission.acceptWorkerResult(\n            .init(lease: lease, outcome: .completed, summary: "Built", evidenceReceiptIDs: .init(["build:accepted"])),\n            at: instant(80)\n        )\n        let archive = try ForgeMissionArchive(state: mission)\n        let data = try JSONEncoder().encode(archive)\n        var root = try XCTUnwrap(JSONSerialization.jsonObject(with: data) as? [String: Any])\n        var state = try XCTUnwrap(root["state"] as? [String: Any])\n        state["stageEvidence"] = []\n        root["state"] = state\n\n        XCTAssertThrowsError(try JSONDecoder().decode(\n            ForgeMissionArchive.self,\n            from: JSONSerialization.data(withJSONObject: root)\n        ))\n    }\n\n'''
          if t.count(marker) != 1:
              raise SystemExit(f'test insertion marker count={t.count(marker)}')
          tests_path.write_text(t.replace(marker, insertion + marker, 1))
          PY

          git diff --check

          focused="${RUNNER_TEMP}/MissionStackFocused"
          rm -rf "$focused"
          mkdir -p "$focused/Sources" "$focused/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$focused/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Sources/ForgeMission "$focused/Sources/ForgeMission"
          cp -R Packages/AgentHarnessKit/Tests/AgentDomainTests "$focused/Tests/AgentDomainTests"
          cp -R Packages/AgentHarnessKit/Tests/ForgeMissionTests "$focused/Tests/ForgeMissionTests"
          cat > "$focused/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "MissionStackFocused",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
                  .library(name: "ForgeMission", targets: ["ForgeMission"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .target(name: "ForgeMission", dependencies: ["AgentDomain"]),
                  .testTarget(name: "AgentDomainTests", dependencies: ["AgentDomain"]),
                  .testTarget(name: "ForgeMissionTests", dependencies: ["AgentDomain", "ForgeMission"]),
              ]
          )
          SWIFT
          swift test --package-path "$focused" -Xswiftc -warnings-as-errors
          git diff --check

          git config user.name "NovaForge V13 recovery"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMission.swift
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift
          git add Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift
          git rm .github/workflows/tmp-v13-mission-record-integrity.yml
          git commit -m "Bind durable mission records to stage authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
