name: V14 Local Model Fabric fast contracts

on:
  push:
    branches: [agent/v14-local-model-fabric-core]
    paths:
      - "Packages/LocalModelFabricCore/**"
      - "Packages/LocalModelQualificationCore/**"
      - ".github/workflows/v14-local-model-fabric-fast-contracts.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Debug contracts
        run: swift test --package-path Packages/LocalModelFabricCore -Xswiftc -warnings-as-errors
      - name: Release contracts
        run: swift test --package-path Packages/LocalModelFabricCore -c release -Xswiftc -warnings-as-errors
      - name: Stack diff hygiene
        run: git diff --check origin/agent/v14-local-model-qualification-evidence...HEAD
