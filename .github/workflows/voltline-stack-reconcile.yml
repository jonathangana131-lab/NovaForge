name: Voltline Stack Reconcile

on:
  push:
    branches:
      - codex/voltline-performance-parallel
    paths:
      - ".github/workflows/voltline-stack-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 with full history
        uses: actions/checkout@v4
        with:
          ref: codex/voltline-performance-parallel
          fetch-depth: 0

      - name: Merge repaired Phase 2 head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/voltline-release-parallel
          git merge --no-edit -X ours origin/codex/voltline-release-parallel
          git push origin HEAD:codex/voltline-performance-parallel
