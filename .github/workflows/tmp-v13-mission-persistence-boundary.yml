name: Temporary V13 mission archive persistence boundary

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-persistence-boundary/e1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply isolated mission snapshot store and verify
        shell: bash
        run: |
          set -euo pipefail
          base=7abe074265a701f555b6c5b901dac21937e08f4e
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-mission-persistence-boundary.yml"

          python3 <<'PY'
          from pathlib import Path

          package = Path('Packages/AgentHarnessKit/Package.swift')
          text = package.read_text()
          old = '''        .target(\n            name: "AgentStore",\n            dependencies: ["AgentDomain", "AgentReducerCore"]\n        ),\n'''
          new = '''        .target(\n            name: "AgentStore",\n            dependencies: ["AgentDomain", "AgentReducerCore", "ForgeMission"]\n        ),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'AgentStore dependency preimage count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        .testTarget(\n            name: "AgentStoreTests",\n            dependencies: ["AgentDomain", "AgentStore"]\n        ),\n'''
          new = '''        .testTarget(\n            name: "AgentStoreTests",\n            dependencies: ["AgentDomain", "AgentStore", "ForgeMission"]\n        ),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'AgentStoreTests dependency preimage count={text.count(old)}')
          package.write_text(text.replace(old, new, 1))
          PY

          cat > Packages/AgentHarnessKit/Sources/AgentStore/ForgeMissionArchiveStore.swift <<'SWIFT'
          import AgentDomain
          import ForgeMission
          import Foundation

          /// Result of an atomic mission snapshot compare-and-set operation.
          public enum ForgeMissionArchiveCommitDisposition: String, Codable, Equatable, Sendable {
              case committed
              case idempotentReplay
          }

          /// Durable receipt returned only after the snapshot store accepts the exact archive bytes.
          public struct ForgeMissionArchiveCommit: Codable, Equatable, Sendable {
              public let missionID: MissionID
              public let projectID: ProjectID
              public let revision: UInt64
              public let authorityEpoch: UInt64
              public let disposition: ForgeMissionArchiveCommitDisposition

              public init(
                  missionID: MissionID,
                  projectID: ProjectID,
                  revision: UInt64,
                  authorityEpoch: UInt64,
                  disposition: ForgeMissionArchiveCommitDisposition
              ) {
                  self.missionID = missionID
                  self.projectID = projectID
                  self.revision = revision
                  self.authorityEpoch = authorityEpoch
                  self.disposition = disposition
              }
          }

          public enum ForgeMissionArchiveStoreError: Error, Equatable, Sendable {
              case invalidArchive
              case identityMismatch(
                  missionID: MissionID,
                  expectedProjectID: ProjectID,
                  actualProjectID: ProjectID
              )
              case staleWrite(expectedPreviousRevision: UInt64?, actualRevision: UInt64?)
              case revisionRegression(current: UInt64, proposed: UInt64)
              case authorityEpochRegression(current: UInt64, proposed: UInt64)
              case conflictingRevision(UInt64)
          }

          /// Canonical archive encoding boundary. Decode always re-enters ForgeMissionArchive's
          /// fail-closed schema/invariant validation instead of trusting persisted bytes.
          public struct ForgeMissionArchiveCodec: Sendable {
              public init() {}

              public func encode(_ archive: ForgeMissionArchive) throws -> Data {
                  do {
                      let encoder = JSONEncoder()
                      encoder.outputFormatting = [.sortedKeys]
                      return try encoder.encode(archive)
                  } catch {
                      throw ForgeMissionArchiveStoreError.invalidArchive
                  }
              }

              public func decode(_ data: Data) throws -> ForgeMissionArchive {
                  do {
                      return try JSONDecoder().decode(ForgeMissionArchive.self, from: data)
                  } catch {
                      throw ForgeMissionArchiveStoreError.invalidArchive
                  }
              }
          }

          /// Mission persistence authority is deliberately separate from AgentEventJournal.
          /// Implementations must atomically compare the previously accepted mission revision
          /// and persist the complete validated archive before returning `.committed`.
          public protocol ForgeMissionArchivePersisting: Sendable {
              func load(
                  missionID: MissionID,
                  projectID: ProjectID
              ) async throws -> ForgeMissionArchive?

              func save(
                  _ archive: ForgeMissionArchive,
                  expectedPreviousRevision: UInt64?
              ) async throws -> ForgeMissionArchiveCommit
          }

          /// Deterministic reference adapter used to prove compare-and-set and retry semantics.
          /// Production adapters can map the same contract to SwiftData/files/database storage.
          public actor InMemoryForgeMissionArchiveStore: ForgeMissionArchivePersisting {
              private struct StoredRecord: Sendable {
                  let projectID: ProjectID
                  let revision: UInt64
                  let authorityEpoch: UInt64
                  let canonicalData: Data
              }

              private var records: [MissionID: StoredRecord] = [:]
              private let codec: ForgeMissionArchiveCodec

              public init(codec: ForgeMissionArchiveCodec = ForgeMissionArchiveCodec()) {
                  self.codec = codec
              }

              public func load(
                  missionID: MissionID,
                  projectID: ProjectID
              ) async throws -> ForgeMissionArchive? {
                  guard let record = records[missionID] else { return nil }
                  guard record.projectID == projectID else {
                      throw ForgeMissionArchiveStoreError.identityMismatch(
                          missionID: missionID,
                          expectedProjectID: record.projectID,
                          actualProjectID: projectID
                      )
                  }

                  let archive = try codec.decode(record.canonicalData)
                  guard archive.state.missionID == missionID,
                        archive.state.projectID == projectID,
                        archive.state.revision == record.revision,
                        archive.state.authorityEpoch == record.authorityEpoch else {
                      throw ForgeMissionArchiveStoreError.invalidArchive
                  }
                  return archive
              }

              public func save(
                  _ archive: ForgeMissionArchive,
                  expectedPreviousRevision: UInt64?
              ) async throws -> ForgeMissionArchiveCommit {
                  // Canonical encode + validated decode means every accepted snapshot crosses
                  // the same schema/invariant boundary that a relaunch will use.
                  let canonicalData = try codec.encode(archive)
                  let validated = try codec.decode(canonicalData)
                  let state = validated.state
                  let missionID = state.missionID
                  let projectID = state.projectID

                  if let current = records[missionID] {
                      guard current.projectID == projectID else {
                          throw ForgeMissionArchiveStoreError.identityMismatch(
                              missionID: missionID,
                              expectedProjectID: current.projectID,
                              actualProjectID: projectID
                          )
                      }

                      // Check exact bytes before CAS so a response-loss retry of a successful
                      // commit is idempotent even when it repeats the old expected revision.
                      if current.canonicalData == canonicalData {
                          return commit(for: state, disposition: .idempotentReplay)
                      }

                      if state.revision == current.revision {
                          throw ForgeMissionArchiveStoreError.conflictingRevision(state.revision)
                      }
                      guard state.revision > current.revision else {
                          throw ForgeMissionArchiveStoreError.revisionRegression(
                              current: current.revision,
                              proposed: state.revision
                          )
                      }
                      guard state.authorityEpoch >= current.authorityEpoch else {
                          throw ForgeMissionArchiveStoreError.authorityEpochRegression(
                              current: current.authorityEpoch,
                              proposed: state.authorityEpoch
                          )
                      }
                      guard expectedPreviousRevision == current.revision else {
                          throw ForgeMissionArchiveStoreError.staleWrite(
                              expectedPreviousRevision: expectedPreviousRevision,
                              actualRevision: current.revision
                          )
                      }
                  } else {
                      guard expectedPreviousRevision == nil else {
                          throw ForgeMissionArchiveStoreError.staleWrite(
                              expectedPreviousRevision: expectedPreviousRevision,
                              actualRevision: nil
                          )
                      }
                  }

                  records[missionID] = StoredRecord(
                      projectID: projectID,
                      revision: state.revision,
                      authorityEpoch: state.authorityEpoch,
                      canonicalData: canonicalData
                  )
                  return commit(for: state, disposition: .committed)
              }

              private func commit(
                  for state: ForgeMissionState,
                  disposition: ForgeMissionArchiveCommitDisposition
              ) -> ForgeMissionArchiveCommit {
                  ForgeMissionArchiveCommit(
                      missionID: state.missionID,
                      projectID: state.projectID,
                      revision: state.revision,
                      authorityEpoch: state.authorityEpoch,
                      disposition: disposition
                  )
              }
          }
          SWIFT

          cat > Packages/AgentHarnessKit/Tests/AgentStoreTests/ForgeMissionArchiveStoreTests.swift <<'SWIFT'
          import AgentDomain
          import AgentStore
          import ForgeMission
          import Foundation
          import XCTest

          final class ForgeMissionArchiveStoreTests: XCTestCase {
              func testFirstSaveAndLoadRoundTripExactIdentityAndRevision() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let mission = try makeMission()
                  let archive = try ForgeMissionArchive(state: mission)

                  let commit = try await store.save(archive, expectedPreviousRevision: nil)
                  XCTAssertEqual(commit.disposition, .committed)
                  XCTAssertEqual(commit.missionID, mission.missionID)
                  XCTAssertEqual(commit.projectID, mission.projectID)
                  XCTAssertEqual(commit.revision, mission.revision)
                  XCTAssertEqual(commit.authorityEpoch, mission.authorityEpoch)

                  let loaded = try await store.load(
                      missionID: mission.missionID,
                      projectID: mission.projectID
                  )
                  XCTAssertEqual(loaded, archive)
              }

              func testExactSameSnapshotIsIdempotentReplay() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let archive = try ForgeMissionArchive(state: makeMission())
                  _ = try await store.save(archive, expectedPreviousRevision: nil)

                  let retry = try await store.save(archive, expectedPreviousRevision: nil)
                  XCTAssertEqual(retry.disposition, .idempotentReplay)
                  XCTAssertEqual(retry.revision, archive.state.revision)
              }

              func testResponseLossRetryRemainsIdempotentAfterRevisionAdvanced() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  var mission = try makeMission()
                  let firstRevision = mission.revision
                  _ = try await store.save(try ForgeMissionArchive(state: mission), expectedPreviousRevision: nil)

                  try mission.switchRoute(to: .init(routeReceiptID: "route:deep"))
                  let second = try ForgeMissionArchive(state: mission)
                  let committed = try await store.save(second, expectedPreviousRevision: firstRevision)
                  XCTAssertEqual(committed.disposition, .committed)

                  let lostResponseRetry = try await store.save(second, expectedPreviousRevision: firstRevision)
                  XCTAssertEqual(lostResponseRetry.disposition, .idempotentReplay)
              }

              func testDivergentSameRevisionWritersCannotBothCommit() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let base = try makeMission()
                  let baseRevision = base.revision
                  _ = try await store.save(try ForgeMissionArchive(state: base), expectedPreviousRevision: nil)

                  var firstWriter = base
                  var secondWriter = base
                  try firstWriter.switchRoute(to: .init(routeReceiptID: "route:first"))
                  try secondWriter.switchRoute(to: .init(routeReceiptID: "route:second"))
                  XCTAssertEqual(firstWriter.revision, secondWriter.revision)

                  _ = try await store.save(
                      try ForgeMissionArchive(state: firstWriter),
                      expectedPreviousRevision: baseRevision
                  )
                  do {
                      _ = try await store.save(
                          try ForgeMissionArchive(state: secondWriter),
                          expectedPreviousRevision: baseRevision
                      )
                      XCTFail("Divergent same-revision writer must not commit")
                  } catch {
                      XCTAssertEqual(
                          error as? ForgeMissionArchiveStoreError,
                          .conflictingRevision(secondWriter.revision)
                      )
                  }
              }

              func testStaleHigherRevisionWriterIsRejectedByCompareAndSet() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  var mission = try makeMission()
                  let firstRevision = mission.revision
                  _ = try await store.save(try ForgeMissionArchive(state: mission), expectedPreviousRevision: nil)
                  try mission.switchRoute(to: .init(routeReceiptID: "route:two"))
                  _ = try await store.save(
                      try ForgeMissionArchive(state: mission),
                      expectedPreviousRevision: firstRevision
                  )

                  let currentRevision = mission.revision
                  try mission.pauseByUser()
                  do {
                      _ = try await store.save(
                          try ForgeMissionArchive(state: mission),
                          expectedPreviousRevision: firstRevision
                      )
                      XCTFail("Stale compare-and-set must not commit")
                  } catch {
                      XCTAssertEqual(
                          error as? ForgeMissionArchiveStoreError,
                          .staleWrite(
                              expectedPreviousRevision: firstRevision,
                              actualRevision: currentRevision
                          )
                      )
                  }
              }

              func testMissionIDCannotBeReadUnderDifferentProjectIdentity() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let mission = try makeMission()
                  _ = try await store.save(try ForgeMissionArchive(state: mission), expectedPreviousRevision: nil)
                  let wrongProject = ProjectID()

                  do {
                      _ = try await store.load(missionID: mission.missionID, projectID: wrongProject)
                      XCTFail("Cross-project mission lookup must fail closed")
                  } catch {
                      XCTAssertEqual(
                          error as? ForgeMissionArchiveStoreError,
                          .identityMismatch(
                              missionID: mission.missionID,
                              expectedProjectID: mission.projectID,
                              actualProjectID: wrongProject
                          )
                      )
                  }
              }

              func testRevisionRegressionIsRejected() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let original = try makeMission()
                  var advanced = original
                  _ = try await store.save(try ForgeMissionArchive(state: original), expectedPreviousRevision: nil)
                  try advanced.switchRoute(to: .init(routeReceiptID: "route:advanced"))
                  _ = try await store.save(
                      try ForgeMissionArchive(state: advanced),
                      expectedPreviousRevision: original.revision
                  )

                  do {
                      _ = try await store.save(
                          try ForgeMissionArchive(state: original),
                          expectedPreviousRevision: advanced.revision
                      )
                      XCTFail("Revision regression must fail")
                  } catch {
                      XCTAssertEqual(
                          error as? ForgeMissionArchiveStoreError,
                          .revisionRegression(current: advanced.revision, proposed: original.revision)
                      )
                  }
              }

              func testAuthorityEpochRegressionIsRejectedEvenAtHigherRevision() async throws {
                  let store = InMemoryForgeMissionArchiveStore()
                  let base = try makeMission()
                  var authoritative = base
                  try authoritative.switchRoute(to: .init(routeReceiptID: "route:authority"))
                  _ = try await store.save(try ForgeMissionArchive(state: authoritative), expectedPreviousRevision: nil)

                  var lowerEpoch = base
                  while lowerEpoch.revision <= authoritative.revision {
                      _ = try lowerEpoch.checkpoint(
                          acceptedProjectStateID: "state:\(lowerEpoch.revision)",
                          evidenceReceiptIDs: .init(["receipt:\(lowerEpoch.revision)"]),
                          summary: "Revision-only checkpoint",
                          at: instant(Int64(lowerEpoch.revision + 20))
                      )
                  }
                  XCTAssertLessThan(lowerEpoch.authorityEpoch, authoritative.authorityEpoch)
                  XCTAssertGreaterThan(lowerEpoch.revision, authoritative.revision)

                  do {
                      _ = try await store.save(
                          try ForgeMissionArchive(state: lowerEpoch),
                          expectedPreviousRevision: authoritative.revision
                      )
                      XCTFail("Authority epoch regression must fail")
                  } catch {
                      XCTAssertEqual(
                          error as? ForgeMissionArchiveStoreError,
                          .authorityEpochRegression(
                              current: authoritative.authorityEpoch,
                              proposed: lowerEpoch.authorityEpoch
                          )
                      )
                  }
              }

              func testCodecIsDeterministicAndRejectsOldSchema() throws {
                  let codec = ForgeMissionArchiveCodec()
                  let archive = try ForgeMissionArchive(state: makeMission())
                  let first = try codec.encode(archive)
                  let second = try codec.encode(archive)
                  XCTAssertEqual(first, second)
                  XCTAssertEqual(try codec.encode(codec.decode(first)), first)

                  var json = try XCTUnwrap(JSONSerialization.jsonObject(with: first) as? [String: Any])
                  json["schemaVersion"] = 1
                  let oldSchema = try JSONSerialization.data(withJSONObject: json)
                  XCTAssertThrowsError(try codec.decode(oldSchema)) { error in
                      XCTAssertEqual(error as? ForgeMissionArchiveStoreError, .invalidArchive)
                  }
              }

              private func makeMission() throws -> ForgeMissionState {
                  let missionID = MissionID()
                  let projectID = ProjectID()
                  let stageID = MissionStageID()
                  return try ForgeMissionState(
                      constitution: MissionConstitution(
                          missionID: missionID,
                          projectID: projectID,
                          acceptedAt: instant(1),
                          productGoal: "Build a durable app",
                          projectType: "app",
                          persistenceExpectations: "Resume after relaunch"
                      ),
                      graph: MissionStageGraph(
                          missionID: missionID,
                          stages: [
                              MissionStage(
                                  stageID: stageID,
                                  kind: .implement,
                                  title: "Implement",
                                  order: 1
                              ),
                          ]
                      ),
                      route: .init(routeReceiptID: "route:balanced")
                  )
              }

              private func instant(_ value: Int64) -> AgentInstant {
                  AgentInstant(rawValue: value)
              }
          }
          SWIFT

          git diff --check

          focused="${RUNNER_TEMP}/MissionStoreFocused"
          rm -rf "$focused"
          mkdir -p "$focused/Sources" "$focused/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$focused/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Sources/AgentReducerCore "$focused/Sources/AgentReducerCore"
          cp -R Packages/AgentHarnessKit/Sources/ForgeMission "$focused/Sources/ForgeMission"
          cp -R Packages/AgentHarnessKit/Sources/AgentStore "$focused/Sources/AgentStore"
          cp -R Packages/AgentHarnessKit/Tests/AgentStoreTests "$focused/Tests/AgentStoreTests"
          cat > "$focused/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "MissionStoreFocused",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
                  .library(name: "AgentReducerCore", targets: ["AgentReducerCore"]),
                  .library(name: "ForgeMission", targets: ["ForgeMission"]),
                  .library(name: "AgentStore", targets: ["AgentStore"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .target(name: "AgentReducerCore", dependencies: ["AgentDomain"]),
                  .target(name: "ForgeMission", dependencies: ["AgentDomain"]),
                  .target(name: "AgentStore", dependencies: ["AgentDomain", "AgentReducerCore", "ForgeMission"]),
                  .testTarget(name: "AgentStoreTests", dependencies: ["AgentDomain", "AgentStore", "ForgeMission"]),
              ]
          )
          SWIFT
          swift test --package-path "$focused" -Xswiftc -warnings-as-errors
          git diff --check

          git config user.name "NovaForge V13 worker"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Package.swift
          git add Packages/AgentHarnessKit/Sources/AgentStore/ForgeMissionArchiveStore.swift
          git add Packages/AgentHarnessKit/Tests/AgentStoreTests/ForgeMissionArchiveStoreTests.swift
          git rm .github/workflows/tmp-v13-mission-persistence-boundary.yml
          git commit -m "Add durable ForgeMission archive persistence boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
