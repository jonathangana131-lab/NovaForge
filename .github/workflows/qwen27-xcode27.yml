name: Qwen 3.8 27B Xcode 27 Validation
# Exact-tree Xcode 27 + iOS 27 qualification for the Qwen-3.8-only product.

on:
  push:
    branches: [feature/qwen38-forge-ios27]
    paths-ignore:
      - 'QA/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwen38-xcode27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-xcode27:
    name: Xcode 27 runtime + app verification
    runs-on: xcode-27
    timeout-minutes: 75
    outputs:
      tested_sha: ${{ steps.patch.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply fail-closed production transforms
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_artifact_preview_mode_fix.py
          python3 ci/apply_qwen38_download_guard.py
          python3 ci/apply_qwen38_catalog_contract_fix.py
          python3 ci/apply_qwen38_static_catalog_assertion_fix.py
          git diff --check

          TRANSFORMED=(
            AgentPad/Views/ArtifactPreviewSheet.swift
            AgentPad/Services/LocalModelRuntime.swift
            AgentPadTests/AgentLocalModelProviderTransportTests.swift
            AgentPadTests/AgentRuntimeLifecycleTests.swift
          )
          if ! git diff --quiet -- "${TRANSFORMED[@]}"; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo 'Production Qwen 3.8 transforms are not committed on the PR head.' >&2
              git diff -- "${TRANSFORMED[@]}"
              exit 71
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${TRANSFORMED[@]}"
            git commit -m 'Make active local model authority Qwen 3.8 only'
            git fetch origin feature/qwen38-forge-ios27
            git rebase origin/feature/qwen38-forge-ios27
            git push origin HEAD:feature/qwen38-forge-ios27
          fi
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish live Xcode 27 receipt
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA='${{ steps.patch.outputs.tested_sha }}'
          mkdir -p QA
          cat > QA/qwen38-xcode27-latest.json <<JSON
          {
            "status": "RUNNING",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "testedSha": "${TESTED_SHA}",
            "verifyArtifact": "qwen38-xcode27-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
            "screensArtifact": "qwen38-xcode27-screens-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
            "packageArtifact": "TriInferCode-Qwen38-iOS27-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QA/qwen38-xcode27-latest.json
          git commit -m "QA: publish live Qwen 3.8 Xcode 27 run ${GITHUB_RUN_ID}" || true
          git fetch origin feature/qwen38-forge-ios27
          git rebase origin/feature/qwen38-forge-ios27 || true
          git push origin HEAD:feature/qwen38-forge-ios27 || true

      - name: Show Xcode and iOS runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Build SwiftLlama runtime test graph
        working-directory: Vendor/swift-llama-cpp
        run: |
          set -euo pipefail
          swift package resolve
          swift build --build-tests

      - name: Run giant-model runtime safety policy
        working-directory: Vendor/swift-llama-cpp
        run: |
          set -euo pipefail
          LLAMA_FRAMEWORK="$(find .build -type d -path '*/macos-*/llama.framework' -print | head -n 1)"
          if [ -z "$LLAMA_FRAMEWORK" ]; then
            echo 'Resolved macOS llama.framework was not found under .build' >&2
            find .build -maxdepth 9 -type d -name 'llama.framework' -print || true
            exit 69
          fi
          LLAMA_BINARY="$LLAMA_FRAMEWORK/Versions/Current/llama"
          test -f "$LLAMA_BINARY"
          LLAMA_FRAMEWORK_PARENT="$(cd "$(dirname "$LLAMA_FRAMEWORK")" && pwd)"
          export DYLD_FRAMEWORK_PATH="$LLAMA_FRAMEWORK_PARENT${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          swift test --skip-build --filter LlamaRuntimeTunerTests
          swift test --skip-build --filter LlamaPerformanceTests

      - name: Build and run critical verification
        env:
          NOVAFORGE_TEST_LANE: critical
          XCODEBUILD_CAP_MINUTES: 65
          UNIT_TEST_TIMEOUT: 540
        run: bash ci/verify.sh

      - name: Upload Xcode 27 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen38-xcode27-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-critical
          if-no-files-found: warn
          retention-days: 14

  visual-xcode27:
    name: Xcode 27 synchronized visual proof
    needs: verify-xcode27
    runs-on: xcode-27
    timeout-minutes: 95
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-xcode27.outputs.tested_sha }}
          fetch-depth: 1
      - name: Show Xcode and iOS runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install source-search dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Run synchronized NovaForge visual census
        run: bash ci/pipeline.sh
      - name: Upload rendered screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen38-xcode27-screens-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            captures
            artifacts/visual
          if-no-files-found: warn
          retention-days: 14

  package-tested-tree:
    name: Package exact tested app
    needs: [verify-xcode27, visual-xcode27]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-xcode27.outputs.tested_sha }}
          fetch-depth: 1
      - name: Build clean Xcode source archive
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA='${{ needs.verify-xcode27.outputs.tested_sha }}'
          ROOT='TriInferCode-Qwen38-iOS27'
          mkdir -p "package-root/$ROOT"
          rsync -a ./ "package-root/$ROOT/" \
            --exclude '.git/' \
            --exclude 'DerivedData/' \
            --exclude '.build/' \
            --exclude 'artifacts/' \
            --exclude 'QA/' \
            --exclude '*.xcresult' \
            --exclude '*.zip'
          cat > "package-root/$ROOT/BUILD-RECEIPT.txt" <<TXT
          NovaForge / TriInfer Code — Qwen 3.8 27B iOS 27
          Exact Xcode-27 critical + visual tested source: ${TESTED_SHA}
          Validation run: ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}
          Product target: exact Qwen 3.8 27B only; no Qwen 3.6/3.5 substitute
          Open in Xcode 27: AgentPad.xcodeproj
          TXT
          cd package-root
          zip -qry "../TriInferCode-Qwen38-iOS27-${TESTED_SHA:0:12}.zip" "$ROOT"
          cd ..
          unzip -tq "TriInferCode-Qwen38-iOS27-${TESTED_SHA:0:12}.zip"
          sha256sum "TriInferCode-Qwen38-iOS27-${TESTED_SHA:0:12}.zip" | tee package-sha256.txt
          echo "ARCHIVE=TriInferCode-Qwen38-iOS27-${TESTED_SHA:0:12}.zip" >> "$GITHUB_ENV"
      - name: Upload exact tested app package
        uses: actions/upload-artifact@v7
        with:
          name: TriInferCode-Qwen38-iOS27-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARCHIVE }}
            package-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
