name: Forge Quality exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/forge-quality-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "056f770bb522a598e07ccd5a9146b81a8b7e198b"
          git diff --check HEAD^

      - name: Debug Forge Quality contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeQualityCore \
            -Xswiftc -warnings-as-errors

      - name: Release Forge Quality contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeQualityCore \
            -c release \
            -Xswiftc -warnings-as-errors
