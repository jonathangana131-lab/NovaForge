name: V14 Preview theme audit

on:
  push:
    branches:
      - agent/v14-preview-theme-durability-0810

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-preview-theme-durability-0810
          fetch-depth: 0
      - name: Audit theme durability surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '--- AgentTheme declarations and storage API ---'
          grep -RnE --include='*.swift' 'novaForgeTheme|normalizeStoredTheme|refreshCurrentCache|refreshThemeCache|launchOverride|AgentTheme\.current|AgentTheme\.storageKey' AgentPad AgentPadTests AgentPadUITests || true
          echo '--- Five theme names in tests and UI ---'
          grep -RnE --include='*.swift' 'Matrix Rain|Midnight Black|White Gold|Arctic Glass|Ember Core|matrixRain|midnightBlack|whiteGold|arcticGlass|emberCore' AgentPadTests AgentPadUITests || true
          echo '--- Existing theme test files ---'
          find AgentPadTests AgentPadUITests -type f -iname '*theme*' -print | sort || true
