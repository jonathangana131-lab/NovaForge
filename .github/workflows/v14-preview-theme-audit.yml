name: V14 Preview theme current-main sync

on:
  push:
    branches:
      - agent/v14-preview-theme-durability-0810

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-preview-theme-durability-0810
          fetch-depth: 0
      - name: Merge current main without dropping theme repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'NovaForge V14 Preview Worker'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:agent/v14-preview-theme-durability-0810
