name: V14 Forge2D Domain Stack Validation

on:
  push:
    branches:
      - 'validation/GPT56-SOL-NF-V14-2DRECOVER-8A10/domain-e1'

permissions:
  contents: read

jobs:
  exact-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Assert exact product ancestor and isolated validation delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "4b8dbb94cd36b2496b3980b3c1c2459afa9358f9"
          git diff --check HEAD^^..HEAD
          changed="$(git diff --name-only HEAD^^..HEAD)"
          test "$changed" = ".github/workflows/v14-forge2d-domain-stack-validation.yml"

      - name: Toolchain
        run: |
          swift --version
          node --version

      - name: Debug package tests
        run: swift test --package-path Packages/Forge2DKit -Xswiftc -warnings-as-errors

      - name: Release package tests
        run: swift test --package-path Packages/Forge2DKit -c release -Xswiftc -warnings-as-errors
