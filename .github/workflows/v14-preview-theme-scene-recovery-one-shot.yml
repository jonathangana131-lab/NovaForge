name: V14 Preview theme scene resolver recovery one-shot

on:
  push:
    branches:
      - worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2
          fetch-depth: 0
      - name: Bind scene appearance to active launch theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NovaForge V14 Preview Worker'
          git config user.email 'actions@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          app_path = Path('AgentPad/App/AgentPadApp.swift')
          app = app_path.read_text()
          old = "\n".join([
              "    private var selectedTheme: AgentTheme {",
              "        AgentTheme.resolved(from: selectedThemeRawValue)",
              "    }",
          ])
          new = "\n".join([
              "    private var selectedTheme: AgentTheme {",
              "        AgentTheme.resolvedForLaunch(",
              "            storedRawValue: selectedThemeRawValue,",
              "            arguments: ProcessInfo.processInfo.arguments",
              "        )",
              "    }",
          ])
          count = app.count(old)
          if count != 1:
              raise SystemExit(f'expected one scene selectedTheme persisted-only resolver, found {count}')
          app_path.write_text(app.replace(old, new, 1))

          guard_path = Path('scripts/verify_v14_preview_theme_contract.sh')
          guard = guard_path.read_text()
          old_required = "\n".join([
              "required_app = [",
              "    '@AppStorage(AgentTheme.storageKey) private var selectedThemeRawValue = AgentTheme.defaultTheme.rawValue',",
              "    '.preferredColorScheme(selectedTheme.preferredColorScheme)',",
              "]",
          ])
          new_required = "\n".join([
              "required_app = [",
              "    '@AppStorage(AgentTheme.storageKey) private var selectedThemeRawValue = AgentTheme.defaultTheme.rawValue',",
              "    '.preferredColorScheme(selectedTheme.preferredColorScheme)',",
              "    'private var selectedTheme: AgentTheme {',",
              "    'storedRawValue: selectedThemeRawValue,',",
              "    'arguments: ProcessInfo.processInfo.arguments',",
              "]",
          ])
          count = guard.count(old_required)
          if count != 1:
              raise SystemExit(f'expected one app guard requirement block, found {count}')
          guard_path.write_text(guard.replace(old_required, new_required, 1))
          PY

          bash scripts/verify_v14_preview_theme_contract.sh
          bash scripts/verify_v14_preview_theme_reset_cache.sh
          git diff --check

          rm .github/workflows/v14-preview-theme-scene-recovery-one-shot.yml
          git add AgentPad/App/AgentPadApp.swift scripts/verify_v14_preview_theme_contract.sh .github/workflows/v14-preview-theme-scene-recovery-one-shot.yml
          git commit -m 'Preview: bind scene appearance to launch theme override'
          git push origin HEAD:worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2