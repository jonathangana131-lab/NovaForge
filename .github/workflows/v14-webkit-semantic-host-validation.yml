name: V14 WebKit Semantic Host Validation

on:
  pull_request:
    paths:
      - "Packages/ForgeRuntimeKit/**"
      - "Packages/ForgeRuntimeWebKitHost/**"
      - ".github/workflows/v14-webkit-semantic-host-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-host-package:
    name: WebKit host debug + release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Debug tests with warnings as errors
        run: swift test --package-path Packages/ForgeRuntimeWebKitHost -Xswiftc -warnings-as-errors
      - name: Release tests with warnings as errors
        run: swift test -c release --package-path Packages/ForgeRuntimeWebKitHost -Xswiftc -warnings-as-errors
