name: Apply Local Model Fabric opaque trust migration

on:
  push:
    branches:
      - agent/local-model-fabric-convergence
    paths:
      - .github/workflows/local-model-fabric-opaque-trust-migration.yml
  pull_request:
    branches:
      - agent/local-model-fabric-convergence

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/local-model-fabric-convergence
          fetch-depth: 2
      - name: Assert exact migration parent
        run: |
          test "$(git rev-parse HEAD^)" = "65287d597b16fc77d1e53454b91c755877e88d06"
      - name: Migrate Fabric to opaque qualification trust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("Packages/LocalModelFabricCore/Sources/LocalModelFabricCore/LocalModelFabricCore.swift")
          tests_path = Path("Packages/LocalModelFabricCore/Tests/LocalModelFabricCoreTests/LocalModelFabricCoreTests.swift")
          source = source_path.read_text()
          tests = tests_path.read_text()

          old_type = "Set<LocalModelQualificationEvidence>"
          if source.count(old_type) != 2:
              raise SystemExit(f"expected exactly two raw trust type uses, found {source.count(old_type)}")
          source = source.replace(old_type, "Set<LocalModelTrustedEvidence>")

          selector_start = source.index("    public static func select(\n", source.index("public enum LocalModelFabricSelector"))
          brace_start = source.index("{", selector_start)
          depth = 0
          selector_end = None
          for index in range(brace_start, len(source)):
              char = source[index]
              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
                  if depth == 0:
                      selector_end = index + 1
                      break
          if selector_end is None:
              raise SystemExit("could not find public selector function boundary")

          original_function = source[selector_start:selector_end]
          body_start = original_function.index("{") + 1
          body = original_function[body_start:-1]
          old_evaluate = "            let evaluation = evaluate(candidate: candidate, request: request)"
          if body.count(old_evaluate) != 1:
              raise SystemExit("selector evaluation call drifted")
          body = body.replace(
              old_evaluate,
              "            let evaluation = evaluate(\n"
              "                candidate: candidate,\n"
              "                request: request,\n"
              "                qualificationEvaluator: qualificationEvaluator\n"
              "            )"
          )

          replacement = '''    public static func select(
              candidates: [LocalModelFabricCandidate],
              request: LocalModelFabricRequest
          ) -> LocalModelFabricSelectionDecision {
              select(candidates: candidates, request: request) { record, claim, trustedEvidence in
                  record.readiness(for: claim, trustedEvidence: trustedEvidence)
              }
          }

          /// Internal policy-test seam. It lets this package exercise routing/ranking independently of the
          /// qualification package's producer boundary without exposing any public trust-minting path.
          static func selectForTesting(
              candidates: [LocalModelFabricCandidate],
              request: LocalModelFabricRequest,
              qualificationEvaluator: (
                  LocalModelQualificationRecord,
                  LocalModelQualificationClaim,
                  Set<LocalModelTrustedEvidence>
              ) -> LocalModelQualificationReadiness
          ) -> LocalModelFabricSelectionDecision {
              select(
                  candidates: candidates,
                  request: request,
                  qualificationEvaluator: qualificationEvaluator
              )
          }

          private static func select(
              candidates: [LocalModelFabricCandidate],
              request: LocalModelFabricRequest,
              qualificationEvaluator: (
                  LocalModelQualificationRecord,
                  LocalModelQualificationClaim,
                  Set<LocalModelTrustedEvidence>
              ) -> LocalModelQualificationReadiness
          ) -> LocalModelFabricSelectionDecision {''' + body + '''    }'''
          source = source[:selector_start] + replacement + source[selector_end:]

          old_signature = '''    private static func evaluate(
              candidate: LocalModelFabricCandidate,
              request: LocalModelFabricRequest
          ) -> Evaluation {'''
          new_signature = '''    private static func evaluate(
              candidate: LocalModelFabricCandidate,
              request: LocalModelFabricRequest,
              qualificationEvaluator: (
                  LocalModelQualificationRecord,
                  LocalModelQualificationClaim,
                  Set<LocalModelTrustedEvidence>
              ) -> LocalModelQualificationReadiness
          ) -> Evaluation {'''
          if source.count(old_signature) != 1:
              raise SystemExit("evaluate signature drifted")
          source = source.replace(old_signature, new_signature)

          old_readiness = "        let readiness = record.readiness(for: claim, trustedEvidence: candidate.trustedEvidence)"
          if source.count(old_readiness) != 1:
              raise SystemExit("canonical readiness call drifted")
          source = source.replace(
              old_readiness,
              "        let readiness = qualificationEvaluator(record, claim, candidate.trustedEvidence)"
          )

          if source.count("Set<LocalModelQualificationEvidence>") != 0:
              raise SystemExit("raw qualification evidence remains in Fabric trust surface")
          if source.count("Set<LocalModelTrustedEvidence>") < 4:
              raise SystemExit("opaque qualification trust is not wired through the Fabric selector")

          tests = tests.replace("LocalModelFabricSelector.select(", "selectWithTrustedQualification(")

          public_negative_tests = [
              "testUntrustedCanonicalEvidenceCannotAuthorizeMission",
              "testSimulatorEvidenceCannotAuthorizeMission",
              "testLocalOnlyRequiresCanonicalNetworkAudit",
          ]
          for name in public_negative_tests:
              pattern = rf"(    func {name}\(\) throws \{{.*?)(?=\n    func |\n    private func )"
              match = re.search(pattern, tests, flags=re.S)
              if not match:
                  raise SystemExit(f"could not find {name}")
              segment = match.group(1).replace(
                  "selectWithTrustedQualification(",
                  "LocalModelFabricSelector.select("
              )
              tests = tests[:match.start(1)] + segment + tests[match.end(1):]

          old_candidate_trust = "            trustedEvidence: trustEvidence ? Set(items) : []"
          if tests.count(old_candidate_trust) != 1:
              raise SystemExit("candidate trust fixture drifted")
          tests = tests.replace(old_candidate_trust, "            trustedEvidence: []")

          helper_marker = "    private func request(\n"
          if tests.count(helper_marker) != 1:
              raise SystemExit("request helper marker drifted")
          helper = '''    private func selectWithTrustedQualification(
              candidates: [LocalModelFabricCandidate],
              request: LocalModelFabricRequest
          ) -> LocalModelFabricSelectionDecision {
              LocalModelFabricSelector.selectForTesting(
                  candidates: candidates,
                  request: request
              ) { _, claim, _ in
                  LocalModelQualificationReadiness(claim: claim, blockingReasons: [])
              }
          }

'''
          tests = tests.replace(helper_marker, helper + helper_marker)

          if "trustedEvidence: trustEvidence ? Set(items) : []" in tests:
              raise SystemExit("test fixture still self-mints qualification trust")
          if tests.count("trustedEvidence: []") < 1:
              raise SystemExit("test fixtures do not fail closed on public trust input")
          if tests.count("selectWithTrustedQualification(") < 2:
              raise SystemExit("policy tests are not using the internal qualification seam")
          if tests.count("LocalModelFabricSelector.select(") < 3:
              raise SystemExit("public fail-closed mission tests were not preserved")

          source_path.write_text(source)
          tests_path.write_text(tests)
          PY
      - name: Validate migrated package
        run: |
          git diff --check
          grep -R "Set<LocalModelQualificationEvidence>" Packages/LocalModelFabricCore && exit 1 || true
          swift test --package-path Packages/LocalModelFabricCore -Xswiftc -warnings-as-errors
          swift test --package-path Packages/LocalModelFabricCore -c release -Xswiftc -warnings-as-errors
      - name: Publish product migration and remove applicator
        run: |
          rm .github/workflows/local-model-fabric-opaque-trust-migration.yml
          git add Packages/LocalModelFabricCore .github/workflows/local-model-fabric-opaque-trust-migration.yml
          git diff --cached --check
          git config user.name "novaforge-automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Seal Local Model Fabric qualification trust boundary"
          git push origin HEAD:agent/local-model-fabric-convergence
