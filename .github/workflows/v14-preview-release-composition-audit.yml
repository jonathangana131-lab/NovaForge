name: V14 Preview release composition audit

on:
  push:
    branches:
      - validation/GPT56-SOL-NF-V14-PREVIEW-RELEASE-0810/composition-contract/e2

permissions:
  contents: read

jobs:
  preview-release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Candidate composition must pass
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_v14_preview_release_contract.sh

      - name: Current-main baseline must expose theme durability blocker
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/preview-main-baseline"
          git worktree add --detach "$baseline" 70eeceb2c92fcb39962e02acd5bde85a8a0ccc81

          set +e
          output="$(bash scripts/verify_v14_preview_release_contract.sh --root "$baseline" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "Expected current-main baseline to fail the theme durability contract" >&2
            exit 1
          fi
          grep -Fq '[preview-release][PASS] EFFORT_CONTRACT' <<<"$output"
          grep -Fq '[preview-release][FAIL] THEME_LAUNCH_OVERRIDE_PERSISTS' <<<"$output"

      - name: Static hygiene
        shell: bash
        run: git diff --check 70eeceb2c92fcb39962e02acd5bde85a8a0ccc81...HEAD
