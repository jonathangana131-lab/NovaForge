name: Fix Forge Compact checkpoint authority

on:
  push:
    branches:
      - gpt56-sol-v14-preview-forgecompact-supplement-0814

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make checkpoint summaries advisory and add adversarial proof
        env:
          TEST_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          preparer = Path('AgentPad/Services/AgentCanonicalContextPreparer.swift')
          text = preparer.read_text()
          marker = 'kind: .checkpoint,'
          marker_index = text.find(marker)
          if marker_index < 0 or text.find(marker, marker_index + 1) >= 0:
              raise SystemExit('expected exactly one checkpoint provenance marker')
          authority = 'isAuthoritative: true'
          authority_index = text.find(authority, marker_index)
          if authority_index < 0:
              raise SystemExit('checkpoint authority flag not found')
          next_artifact = text.find('kind: .source,', marker_index)
          if next_artifact >= 0 and authority_index > next_artifact:
              raise SystemExit('checkpoint authority flag escaped checkpoint block')
          text = text[:authority_index] + 'isAuthoritative: false' + text[authority_index + len(authority):]
          preparer.write_text(text)

          tests = Path('AgentPadTests/AgentCanonicalContextPreparerTests.swift')
          test_text = tests.read_text()
          anchor = '    func testProjectMemorySupplementFailureFallsBackByteForByteToCanonicalRawJSON() async throws {\n'
          if test_text.count(anchor) != 1:
              raise SystemExit(f'expected one fallback-test anchor, found {test_text.count(anchor)}')
          addition = base64.b64decode(os.environ['TEST_B64']).decode()
          tests.write_text(test_text.replace(anchor, addition + anchor, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "AgentPad/Services/AgentCanonicalContextPreparer.swift AgentPadTests/AgentCanonicalContextPreparerTests.swift "
          grep -F 'isAuthoritative: false' AgentPad/Services/AgentCanonicalContextPreparer.swift
          grep -F 'testCompactedCheckpointSummaryRemainsAdvisoryWithoutProvenanceProof' AgentPadTests/AgentCanonicalContextPreparerTests.swift
      - name: Commit repair and remove applicator
        run: |
          rm .github/workflows/fix-forgecompact-checkpoint-authority.yml
          git config user.name "novaforge-swarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPad/Services/AgentCanonicalContextPreparer.swift AgentPadTests/AgentCanonicalContextPreparerTests.swift .github/workflows/fix-forgecompact-checkpoint-authority.yml
          git commit -m "Preview: keep unverified checkpoint summaries advisory"
          git push origin HEAD:${GITHUB_REF_NAME}
