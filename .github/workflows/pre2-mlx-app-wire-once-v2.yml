          ''','unload')

          rep('''        _ = try await LocalModelArtifactVerifier.shared.verifiedURL(
                      for: variant
                  )
              }

              /// Runs the tool-trained checkpoint''','''        #if canImport(SwiftLlama)
                  if let profile = variant.mlxProfile {
                      guard await NovaForgeMLXRuntime.shared.isCached(profile: profile) else {
