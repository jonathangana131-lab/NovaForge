                  let modelURL = try await LocalModelArtifactVerifier.shared
                      .verifiedURL(for: variant)

                  #if canImport(SwiftLlama)
                  let service = try await service(for: variant, modelURL: modelURL)

                  let llamaMessages = request.messages.map { message in
          ''','stream-dispatch')

          runtime_path.write_text(text)

          provider = provider_path.read_text()
          old = '''        case .local:
                  "On-device Qwen Coder agent"
          '''
          new = '''        case .local:
                  "On-device MLX + GGUF coding agent"
          '''
          if provider.count(old) != 1:
              raise SystemExit(f'provider-copy: expected one match, found {provider.count(old)}')
          provider_path.write_text(provider.replace(old, new, 1))
          PY

          git diff --check
          grep -q 'Nanbeige 4.2 3B — MLX 3-bit' AgentPad/Services/LocalModelRuntime.swift
          grep -q 'performMLXAgentDecision' AgentPad/Services/LocalModelRuntime.swift
          grep -q 'NovaForgeMLXRuntime.shared.generate' AgentPad/Services/LocalModelRuntime.swift
          grep -q 'On-device MLX + GGUF coding agent' AgentPad/Services/AIProvider.swift

      - name: Commit product wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPad/Services/LocalModelRuntime.swift AgentPad/Services/AIProvider.swift
          git commit -m 'Wire Nanbeige MLX into local app route'
