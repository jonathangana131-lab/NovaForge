name: Pre2 MLX app wire once v2

on:
  push:
    branches: [feat/pre2-nanbeige-mlx-a14]
    paths:
      - .github/workflows/pre2-mlx-app-wire-once-v2.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pre2-nanbeige-mlx-a14
          fetch-depth: 0
      - name: Apply fail-closed MLX app wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('AgentPad/Services/LocalModelRuntime.swift')
          provider_path = Path('AgentPad/Services/AIProvider.swift')
          text = runtime_path.read_text()

          def rep(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          rep('''    var executionLabel: String {
                  useGPU ? "Metal \\(gpuLayerCount)L" : "CPU-only"
              }
