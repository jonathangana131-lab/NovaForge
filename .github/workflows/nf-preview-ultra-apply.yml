name: NF Preview Ultra Patch Applicator

on:
  push:
    branches:
      - agent/preview-ultra-effort-sol

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Preview Ultra patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="swarm-patches/NF-PREVIEW-ULTRA-SOL.patch"
          if [[ ! -f "$patch_file" ]]; then
            echo "Patch already consumed; nothing to do."
            exit 0
          fi
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm "$patch_file"
          rm ".github/workflows/nf-preview-ultra-apply.yml"
          git diff --check
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPad/Views/ChatComposer.swift AgentPad/Services/AIProvider.swift "$patch_file" .github/workflows/nf-preview-ultra-apply.yml
          git diff --cached --check
          git commit -m "preview: expose Ultra effort mode"
          git push origin HEAD:agent/preview-ultra-effort-sol
