name: V14 Preview theme guard repair proof

on:
  push:
    branches:
      - validation/GPT56-SOL-NF-V14-PREVIEW-THEME-GUARD-0810/nonpersist/e1

permissions:
  contents: read

jobs:
  prove-theme-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Current main must be rejected for persisting launch override
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/current-main"
          git worktree add --detach "$baseline" 37b5305c459907917d1f27ddc7f08168a68c4bbe

          set +e
          output="$(bash scripts/verify_v14_preview_theme_contract.sh --root "$baseline" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "Expected current main to fail the corrected non-persistence contract" >&2
            exit 1
          fi
          grep -Fq 'launch-only theme override must not overwrite durable novaForgeTheme selection' <<<"$output"

      - name: Active durability candidate must satisfy corrected contract
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/theme-durability-candidate"
          git worktree add --detach "$candidate" e64e1ee0c1f596e67f043719fb9d7d510ce2c759
          bash scripts/verify_v14_preview_theme_contract.sh --root "$candidate"

      - name: Guard-only donor hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 37b5305c459907917d1f27ddc7f08168a68c4bbe...HEAD
          changed="$(git diff --name-only 37b5305c459907917d1f27ddc7f08168a68c4bbe...HEAD | sort)"
          printf '%s\n' "$changed"
          grep -Fxq 'scripts/verify_v14_preview_theme_contract.sh' <<<"$changed"
          grep -Fxq '.github/workflows/v14-preview-theme-guard-repair-audit.yml' <<<"$changed"
          [[ "$(wc -l <<<"$changed" | tr -d ' ')" == '2' ]]
