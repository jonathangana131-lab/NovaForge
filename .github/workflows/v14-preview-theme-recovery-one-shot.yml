name: V14 Preview theme durability recovery one-shot

on:
  push:
    branches:
      - worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2
          fetch-depth: 0

      - name: Reconcile abandoned durability fix onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NovaForge V14 Preview Worker'
          git config user.email 'actions@users.noreply.github.com'

          git fetch origin agent/v14-preview-theme-durability-0810
          git fetch origin validation/GPT56-SOL-NF-V14-PREVIEW-THEME-GUARD-0810/nonpersist/e1

          # Main changed none of these files after the durability donor's merge-base,
          # so recover their exact reviewed product/test deltas without reimplementing them.
          git checkout e64e1ee0c1f596e67f043719fb9d7d510ce2c759 -- \
            AgentPad/Design/AgentTheme.swift \
            AgentPad/Views/AppRootView.swift \
            AgentPad/Views/SettingsView.swift \
            AgentPadTests/AgentRuntimeLifecycleTests.swift \
            AgentPadUITests/AgentPadUITests.swift

          # AgentPadApp *did* gain the newer reset-cache repair on main. Reconcile only
          # the two theme launch blocks by exact source shape so that repair is preserved.
          python3 <<'PY'
          from pathlib import Path

          path = Path('AgentPad/App/AgentPadApp.swift')
          text = path.read_text()

          old_launch = '''        let arguments = ProcessInfo.processInfo.arguments
          if let launchTheme = AgentTheme.launchOverride(from: arguments) {
              UserDefaults.standard.set(launchTheme.rawValue, forKey: AgentTheme.storageKey)
              AgentPalette.refreshThemeCache(launchTheme)
          } else {
              AgentPalette.refreshThemeCache(AgentTheme.normalizeStoredTheme())
          }
          AgentThemeUIKit.apply(AgentTheme.current)
          '''
          new_launch = '''        let arguments = ProcessInfo.processInfo.arguments
          let storedThemeRawValue = UserDefaults.standard.string(forKey: AgentTheme.storageKey)
          let launchTheme = AgentTheme.resolvedForLaunch(
              storedRawValue: storedThemeRawValue,
              arguments: arguments
          )
          if AgentTheme.launchOverride(from: arguments) == nil {
              _ = AgentTheme.normalizeStoredTheme()
          }
          AgentPalette.refreshThemeCache(launchTheme)
          AgentThemeUIKit.apply(launchTheme)
          '''

          old_reset = '''            UserDefaults.standard.set(AgentTheme.defaultTheme.rawValue, forKey: AgentTheme.storageKey)
              if let launchTheme = AgentTheme.launchOverride(from: arguments) {
                  UserDefaults.standard.set(launchTheme.rawValue, forKey: AgentTheme.storageKey)
              }
              AgentPalette.refreshThemeCache(AgentTheme.normalizeStoredTheme())
              AgentThemeUIKit.apply(AgentTheme.current)
          '''
          new_reset = '''            UserDefaults.standard.set(AgentTheme.defaultTheme.rawValue, forKey: AgentTheme.storageKey)
              let resetLaunchTheme = AgentTheme.resolvedForLaunch(
                  storedRawValue: AgentTheme.defaultTheme.rawValue,
                  arguments: arguments
              )
              AgentPalette.refreshThemeCache(resetLaunchTheme)
              AgentThemeUIKit.apply(resetLaunchTheme)
          '''

          if text.count(old_launch) != 1:
              raise SystemExit(f'expected one current launch-theme persistence block, found {text.count(old_launch)}')
          if text.count(old_reset) != 1:
              raise SystemExit(f'expected one current reset-theme block, found {text.count(old_reset)}')
          text = text.replace(old_launch, new_launch, 1)
          text = text.replace(old_reset, new_reset, 1)
          path.write_text(text)
          PY

          # Pull forward the corrected permanent five-theme durability contract from #230.
          git show ee33e9574b928e256d1e332984db301a4fcdbca9:scripts/verify_v14_preview_theme_contract.sh \
            > scripts/verify_v14_preview_theme_contract.sh
          chmod +x scripts/verify_v14_preview_theme_contract.sh

          # Main's reset-cache contract predated ephemeral overrides and therefore
          # required the now-forbidden storage write. Preserve its cache determinism
          # purpose while updating it to the resolved active-launch theme.
          cat > scripts/verify_v14_preview_theme_reset_cache.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          app="$repo_root/AgentPad/App/AgentPadApp.swift"
          theme="$repo_root/AgentPad/Design/AgentTheme.swift"

          [[ -f "$app" ]] || { echo "missing AgentPadApp.swift" >&2; exit 1; }
          [[ -f "$theme" ]] || { echo "missing AgentTheme.swift" >&2; exit 1; }

          python3 - "$app" "$theme" <<'PY'
          from pathlib import Path
          import sys

          app = Path(sys.argv[1]).read_text()
          theme = Path(sys.argv[2]).read_text()

          reset_marker = 'if arguments.contains("--reset-ui") {'
          start = app.find(reset_marker)
          if start < 0:
              raise SystemExit('missing --reset-ui launch fixture')
          end = app.find('\n        }\n        #endif', start)
          if end < 0:
              raise SystemExit('could not isolate --reset-ui fixture')
          reset = app[start:end]

          required = [
              'UserDefaults.standard.set(AgentTheme.defaultTheme.rawValue, forKey: AgentTheme.storageKey)',
              'let resetLaunchTheme = AgentTheme.resolvedForLaunch(',
              'storedRawValue: AgentTheme.defaultTheme.rawValue',
              'arguments: arguments',
              'AgentPalette.refreshThemeCache(resetLaunchTheme)',
              'AgentThemeUIKit.apply(resetLaunchTheme)',
          ]
          for needle in required:
              if needle not in reset:
                  raise SystemExit(f'missing reset-theme determinism contract: {needle}')

          forbidden = 'UserDefaults.standard.set(launchTheme.rawValue, forKey: AgentTheme.storageKey)'
          if forbidden in reset:
              raise SystemExit('reset launch override must remain ephemeral')
          if 'AgentPalette.refreshThemeCache(AgentTheme.current)' in reset:
              raise SystemExit('reset fixture may not refresh AgentPalette from stale cached current theme')
          if 'static func resolvedForLaunch(' not in theme:
              raise SystemExit('missing active launch-theme resolver')
          if 'launchOverride(from: arguments) ?? resolved(from: storedRawValue)' not in theme:
              raise SystemExit('launch resolver must give explicit override precedence without persistence')

          print('Preview theme reset cache contract: stored default + ephemeral override -> resolved launch theme -> palette/UIKit')
          PY
          EOF
          chmod +x scripts/verify_v14_preview_theme_reset_cache.sh

          bash scripts/verify_v14_preview_theme_contract.sh
          bash scripts/verify_v14_preview_theme_reset_cache.sh
          git diff --check

          rm .github/workflows/v14-preview-theme-recovery-one-shot.yml

          git add \
            AgentPad/App/AgentPadApp.swift \
            AgentPad/Design/AgentTheme.swift \
            AgentPad/Views/AppRootView.swift \
            AgentPad/Views/SettingsView.swift \
            AgentPadTests/AgentRuntimeLifecycleTests.swift \
            AgentPadUITests/AgentPadUITests.swift \
            scripts/verify_v14_preview_theme_contract.sh \
            scripts/verify_v14_preview_theme_reset_cache.sh \
            .github/workflows/v14-preview-theme-recovery-one-shot.yml
          git commit -m 'Preview: keep launch theme overrides ephemeral'
          git push origin HEAD:worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2