name: Temporary #191 Preview recompose

on:
  push:
    branches:
      - validation/GPT56-SOL-PREVIEW-191-RECOMPOSE-0810/e1

permissions:
  contents: write

jobs:
  recompose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/GPT56-SOL-PREVIEW-191-RECOMPOSE-0810/e1
          fetch-depth: 0
      - name: Reapply reviewed Local truth tree onto live main
        run: |
          set -euo pipefail
          git config user.name 'NovaForge Swarm'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '37b5305c459907917d1f27ddc7f08168a68c4bbe'
          donor='cabcfae1de4ccb7b4e6c772dbc5fc10fe295de36'
          git cat-file -e "$donor^{commit}"
          git show "$donor:AgentPad/Services/LocalModelRuntime.swift" > AgentPad/Services/LocalModelRuntime.swift
          git show "$donor:AgentPad/Views/SettingsComponents.swift" > AgentPad/Views/SettingsComponents.swift
          git show "$donor:scripts/verify-local-model-proof-copy.sh" > scripts/verify-local-model-proof-copy.sh
          rm .github/workflows/zz-preview-191-recompose.yml
          git add -A
          bash scripts/verify-local-model-proof-copy.sh
          git diff --cached --check origin/main
          mapfile -t changed < <(git diff --cached --name-only origin/main | sort)
          expected=(
            'AgentPad/Services/LocalModelRuntime.swift'
            'AgentPad/Views/SettingsComponents.swift'
            'scripts/verify-local-model-proof-copy.sh'
          )
          printf 'canonical files: %s\n' "${changed[*]}"
          [[ "${changed[*]}" = "${expected[*]}" ]]
      - name: Commit exact canonical tree
        run: |
          set -euo pipefail
          git commit -m 'preview: recompose Local Model static truth on current main'
          git push origin HEAD:validation/GPT56-SOL-PREVIEW-191-RECOMPOSE-0810/e1
