name: Temporary V13 mission persistence fixture retry

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-persistence-boundary/e1

permissions:
  contents: write

jobs:
  retry-verified-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Re-run applicator with corrected adversarial fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-v13-mission-persistence-boundary.yml').read_text()
          marker = '        run: |\n'
          if workflow.count(marker) != 1:
              raise SystemExit('cannot isolate original workflow run block')
          raw = workflow.split(marker, 1)[1]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          ) + '\n'

          old = '''test "$(git rev-parse HEAD^)" = "$base"\ntest "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-mission-persistence-boundary.yml"'''
          new = '''git merge-base --is-ancestor "$base" HEAD\nunexpected="$(git diff --name-only "$base" HEAD | grep -Ev '^(.github/workflows/tmp-v13-mission-persistence-boundary.yml|.github/workflows/tmp-v13-mission-persistence-boundary-retry.yml)$' || true)"\ntest -z "$unexpected"'''
          if script.count(old) != 1:
              raise SystemExit(f'preimage guard count={script.count(old)}')
          script = script.replace(old, new, 1)

          old = '''        let currentRevision = mission.revision\n        try mission.pauseByUser()\n        do {'''
          new = '''        let currentRevision = mission.revision\n        try mission.switchRoute(to: .init(routeReceiptID: "route:three"))\n        do {'''
          if script.count(old) != 1:
              raise SystemExit(f'stale fixture count={script.count(old)}')
          script = script.replace(old, new, 1)

          start_marker = '    func testAuthorityEpochRegressionIsRejectedEvenAtHigherRevision() async throws {\n'
          end_marker = '    func testCodecIsDeterministicAndRejectsOldSchema() throws {\n'
          start = script.index(start_marker)
          end = script.index(end_marker, start)
          replacement = '''    func testAuthorityEpochRegressionIsRejectedEvenAtHigherRevision() async throws {\n        let store = InMemoryForgeMissionArchiveStore()\n        let missionID = MissionID()\n        let projectID = ProjectID()\n        let firstStageID = MissionStageID()\n        let secondStageID = MissionStageID()\n        let base = try ForgeMissionState(\n            constitution: MissionConstitution(\n                missionID: missionID,\n                projectID: projectID,\n                acceptedAt: instant(1),\n                productGoal: "Build a durable app",\n                projectType: "app"\n            ),\n            graph: MissionStageGraph(\n                missionID: missionID,\n                stages: [\n                    MissionStage(stageID: firstStageID, kind: .implement, title: "First", order: 1),\n                    MissionStage(stageID: secondStageID, kind: .test, title: "Second", order: 2),\n                ]\n            ),\n            route: .init(routeReceiptID: "route:balanced")\n        )\n\n        var authoritative = base\n        try authoritative.switchRoute(to: .init(routeReceiptID: "route:authority"))\n        _ = try await store.save(try ForgeMissionArchive(state: authoritative), expectedPreviousRevision: nil)\n\n        var lowerEpoch = base\n        let leases = try lowerEpoch.beginWork(on: lowerEpoch.runnableStageIDs)\n        for (index, lease) in leases.enumerated() {\n            try lowerEpoch.acceptWorkerResult(\n                .init(\n                    lease: lease,\n                    outcome: .completed,\n                    summary: "Completed stage \\(index)",\n                    evidenceReceiptIDs: .init(["stage:\\(index):receipt"])\n                ),\n                at: instant(Int64(index + 10))\n            )\n        }\n        XCTAssertLessThan(lowerEpoch.authorityEpoch, authoritative.authorityEpoch)\n        XCTAssertGreaterThan(lowerEpoch.revision, authoritative.revision)\n\n        do {\n            _ = try await store.save(\n                try ForgeMissionArchive(state: lowerEpoch),\n                expectedPreviousRevision: authoritative.revision\n            )\n            XCTFail("Authority epoch regression must fail")\n        } catch {\n            XCTAssertEqual(\n                error as? ForgeMissionArchiveStoreError,\n                .authorityEpochRegression(\n                    current: authoritative.authorityEpoch,\n                    proposed: lowerEpoch.authorityEpoch\n                )\n            )\n        }\n    }\n\n'''
          script = script[:start] + replacement + script[end:]

          old = 'git rm .github/workflows/tmp-v13-mission-persistence-boundary.yml\n'
          new = 'git rm .github/workflows/tmp-v13-mission-persistence-boundary.yml\ngit rm .github/workflows/tmp-v13-mission-persistence-boundary-retry.yml\n'
          if script.count(old) != 1:
              raise SystemExit(f'temporary cleanup count={script.count(old)}')
          script = script.replace(old, new, 1)

          Path('/tmp/mission-store-retry.sh').write_text(script)
          PY
          bash /tmp/mission-store-retry.sh
