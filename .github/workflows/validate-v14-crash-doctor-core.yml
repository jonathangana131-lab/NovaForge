name: Validate V14 Crash Doctor Core

on:
  push:
    branches:
      - validation/GPT56-NF-V14-CRASHDOC-8A09/crash-doctor-core/e1

permissions:
  contents: read

jobs:
  package:
    name: ForgeCrashDoctorCore (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.configuration }}" == "release" ]]; then
            swift test --package-path Packages/ForgeCrashDoctorCore --configuration release -Xswiftc -warnings-as-errors
          else
            swift test --package-path Packages/ForgeCrashDoctorCore -Xswiftc -warnings-as-errors
          fi
