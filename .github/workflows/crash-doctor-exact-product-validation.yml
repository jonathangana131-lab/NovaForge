name: Crash Doctor exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/crash-doctor-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "466bf59d22b230f6f924b63207687894afe61f68"
          git diff --check HEAD^

      - name: Debug Crash Doctor contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCrashDoctorCore \
            -Xswiftc -warnings-as-errors

      - name: Release Crash Doctor contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCrashDoctorCore \
            -c release \
            -Xswiftc -warnings-as-errors
