name: V14 Preview effort contract

on:
  pull_request:
    paths:
      - 'AgentPad/Views/ChatComposer.swift'
      - 'AgentPad/Services/AIProvider.swift'
      - 'AgentPad/Services/AgentSystemFreshRunRequestFactory.swift'
      - 'scripts/verify_v14_preview_effort_contract.sh'
      - '.github/workflows/v14-preview-effort-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'AgentPad/Views/ChatComposer.swift'
      - 'AgentPad/Services/AIProvider.swift'
      - 'AgentPad/Services/AgentSystemFreshRunRequestFactory.swift'
      - 'scripts/verify_v14_preview_effort_contract.sh'
      - '.github/workflows/v14-preview-effort-contract.yml'

permissions:
  contents: read

jobs:
  preview-effort-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify five-stop effort + Ultra runtime binding
        run: bash scripts/verify_v14_preview_effort_contract.sh
