name: Qwen 3.8 Model Storage Hygiene

on:
  push:
    branches: [validation/qwen38-storage-hygiene]
    paths:
      - 'ci/apply_model_backup_exclusion.py'
      - '.github/workflows/qwen38-storage-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/qwen38-storage-hygiene
          fetch-depth: 1
      - name: Apply storage hygiene patch
        run: python3 ci/apply_model_backup_exclusion.py
      - name: Verify source diff
        run: |
          set -euo pipefail
          git diff --check
          grep -n 'isExcludedFromBackup = true' AgentPad/Services/LocalModelRuntime.swift
      - name: Compile AgentPad
        run: |
          set -euo pipefail
          xcodebuild \
            -project AgentPad.xcodeproj \
            -scheme AgentPad \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Commit qualified source
        run: |
          set -euo pipefail
          if git diff --quiet -- AgentPad/Services/LocalModelRuntime.swift; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPad/Services/LocalModelRuntime.swift
          git commit -m 'Exclude downloaded Qwen weights from backup'
          git push origin HEAD:validation/qwen38-storage-hygiene
