name: Voltline Mission Touch Repair

on:
  push:
    branches:
      - codex/voltline-final-polish
    paths:
      - ".github/workflows/voltline-mission-touch-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: codex/voltline-final-polish

      - name: Remove full-screen mission hit-test surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Voltline/App/Sources/MissionLayerView.swift")
          source = path.read_text()
          old = '''    private var compactHUD: some View {
              Color.clear
                  .allowsHitTesting(false)
                  .overlay(alignment: .topLeading) {
                      Group {
                          if let mission = director.activeMission {
                              activeMissionButton(mission)
                          } else {
                              chooseMissionButton
                          }
                      }
                      .fixedSize()
                      .padding(.leading, 14)
                      .padding(.top, 146)
                      .allowsHitTesting(!director.isBoardPresented)
                  }
          }
          '''
          new = '''    private var compactHUD: some View {
              VStack(spacing: 0) {
                  HStack(spacing: 0) {
                      Group {
                          if let mission = director.activeMission {
                              activeMissionButton(mission)
                          } else {
                              chooseMissionButton
                          }
                      }
                      .fixedSize()
                      .allowsHitTesting(!director.isBoardPresented)

                      Spacer(minLength: 0)
                          .allowsHitTesting(false)
                  }
                  .padding(.leading, 14)
                  .padding(.top, 146)

                  Spacer(minLength: 0)
                      .allowsHitTesting(false)
              }
          }
          '''
          if old not in source:
              raise SystemExit("Expected compactHUD block was not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Voltline/App/Sources/MissionLayerView.swift
          git commit -m "fix: let ride controls receive touches under mission HUD"
          git push origin HEAD:codex/voltline-final-polish
