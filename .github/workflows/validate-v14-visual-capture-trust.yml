name: Validate V14 Visual Capture Trust

on:
  push:
    branches:
      - validation/GPT56-NF-V14-GO-8A08/visual-capture-trust/e1

permissions:
  contents: read

jobs:
  package:
    name: ForgeVisualQAKit (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.configuration }}" == "release" ]]; then
            swift test --package-path Packages/ForgeVisualQAKit --configuration release -Xswiftc -warnings-as-errors
          else
            swift test --package-path Packages/ForgeVisualQAKit -Xswiftc -warnings-as-errors
          fi
