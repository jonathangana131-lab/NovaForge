name: Forge Compact trust exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/forge-compact-trust-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cc5cc368825690a3f30fd7066e6400474fcc7cb3"
          git diff --check HEAD^

      - name: Debug Forge Compact trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCompactCore \
            -Xswiftc -warnings-as-errors

      - name: Release Forge Compact trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCompactCore \
            -c release \
            -Xswiftc -warnings-as-errors
