name: V14 Forge Compact capsule hardening check

on:
  push:
    branches:
      - agent/v14-forge-compact-capsule-retrieval-hardening

permissions:
  contents: read

jobs:
  forge-compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff check
        run: git diff --check 5cd5a75849fde2a0d16d5c915433364e7d8e8a60...HEAD
      - name: Debug package tests
        run: swift test --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
      - name: Release package tests
        run: swift test -c release --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
