name: Provider migration patch

on:
  pull_request:
    branches:
      - agent/provider-repair-control
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: provider-migration-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'agent/provider-migration-patch-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
          fetch-depth: 0
      - name: Preserve local recovery for corrupt provider data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AgentPad/Models/Models.swift')
          text = path.read_text()
          old = '''        let decodedProvider = AIProvider(rawValue: providerRawValue ?? "")
        let selectedProvider = decodedProvider.flatMap {
            $0.isUserSelectable ? $0 : nil
        } ?? .openCodeZen
'''
          new = '''        let decodedProvider = AIProvider(rawValue: providerRawValue ?? "")
        let selectedProvider: AIProvider
        switch decodedProvider {
        case .none:
            // Corrupt or unknown persisted data keeps the original safe local
            // recovery contract instead of silently selecting a network route.
            selectedProvider = .local
        case .some(let provider) where provider.isUserSelectable:
            selectedProvider = provider
        case .some:
            // A real saved legacy ChatGPT/Codex selection is no longer offered
            // for fresh phone runs; migrate it to the anonymous Zen Free route.
            selectedProvider = .openCodeZen
        }
'''
          if text.count(old) != 1:
              raise SystemExit('expected provider migration snippet was not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch to repair branch
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPad/Models/Models.swift
          git commit -m "Preserve local recovery for invalid provider data"
          git push origin HEAD:agent/fix-phone-provider-reliability-clean
