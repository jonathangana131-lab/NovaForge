name: Temporary V13 Project Brain context truth

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/project-brain-context-virtualization/e1

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Harden mission isolation, freshness priority, and budget accounting
        shell: bash
        run: |
          set -euo pipefail
          base=899697d286e06d2a196057d7d3aa65445ae29328
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = ".github/workflows/tmp-v13-project-brain-context-truth.yml"

          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return text.replace(old, new, 1)

          source = Path('Packages/AgentHarnessKit/Sources/AgentDomain/ProjectBrainContext.swift')
          tests = Path('Packages/AgentHarnessKit/Tests/AgentDomainTests/ProjectBrainContextTests.swift')
          s = source.read_text()

          s = once(s,
          '''            if let missionID = request.missionID {\n                guard fact.missionID == nil || fact.missionID == missionID else { continue }\n            }\n''',
          '''            if let missionID = request.missionID {\n                guard fact.missionID == nil || fact.missionID == missionID else { continue }\n            } else {\n                // Project-wide context must not silently merge facts from unrelated historical\n                // missions. Mission-scoped facts require an explicit mission neighborhood.\n                guard fact.missionID == nil else { continue }\n            }\n''',
          'project-wide mission isolation')

          s = once(s,
          '''/// 3. caller preferred fact kinds;\n/// 4. current before unknown before explicitly included stale facts;\n/// 5. most recently verified source evidence;\n''',
          '''/// 3. current before unknown before explicitly included stale facts;\n/// 4. caller preferred fact kinds;\n/// 5. most recently verified source evidence;\n''',
          'ranking documentation')

          s = once(s,
          '''        if lhs.kindRank != rhs.kindRank { return lhs.kindRank < rhs.kindRank }\n        if lhs.freshnessRank != rhs.freshnessRank {\n            return lhs.freshnessRank < rhs.freshnessRank\n        }\n''',
          '''        if lhs.freshnessRank != rhs.freshnessRank {\n            return lhs.freshnessRank < rhs.freshnessRank\n        }\n        if lhs.kindRank != rhs.kindRank { return lhs.kindRank < rhs.kindRank }\n''',
          'freshness priority')

          old_estimator = '''    /// Deterministic conservative character accounting for the full truth-bearing payload a\n    /// caller must preserve when serializing a fact into model context. This is deliberately not\n    /// presented as a token count; provider-specific token budgeting belongs above this layer.\n    public static func estimatedCharacterCount(of fact: ProjectBrainFact) -> Int {\n        var count = fact.statement.count\n        count += fact.kind.rawValue.count\n        count += fact.scope.kind.rawValue.count\n        count += fact.scope.reference?.count ?? 0\n        count += fact.staleReason?.count ?? 0\n        for provenance in fact.provenance {\n            count += provenance.kind.rawValue.count\n            count += provenance.reference.count\n            count += provenance.contentDigest?.count ?? 0\n        }\n        return count\n    }\n'''
          new_estimator = '''    /// Deterministic model-independent character estimate for the complete fact identity, scope,\n    /// freshness, statement, and provenance payload. Provider-specific serialization overhead and\n    /// tokenization belong above this domain layer.\n    public static func estimatedCharacterCount(of fact: ProjectBrainFact) -> Int {\n        var count = fact.statement.count\n        count += fact.factID.description.count\n        count += fact.projectID.description.count\n        count += fact.missionID?.description.count ?? 0\n        count += fact.kind.rawValue.count\n        count += fact.scope.kind.rawValue.count\n        count += fact.scope.reference?.count ?? 0\n        count += fact.freshness.rawValue.count\n        count += String(fact.lastVerifiedAt.rawValue).count\n        count += fact.staleReason?.count ?? 0\n        for provenance in fact.provenance {\n            count += provenance.kind.rawValue.count\n            count += provenance.reference.count\n            count += String(provenance.capturedAt.rawValue).count\n            count += provenance.contentDigest?.count ?? 0\n        }\n        return count\n    }\n'''
          s = once(s, old_estimator, new_estimator, 'character accounting')
          source.write_text(s)

          t = tests.read_text()
          mission_marker = '''    func testFreshnessPolicyIsExplicitAndIncludedStaleFactsRankLast() throws {\n'''
          project_test = '''    func testProjectLevelRequestDoesNotMixMissionSpecificFacts() throws {\n        let projectID = ProjectID()\n        let firstMissionID = MissionID()\n        let secondMissionID = MissionID()\n        let project = fact(\n            projectID: projectID,\n            statement: "Project-wide design DNA",\n            scope: .init(kind: .project),\n            verifiedAt: 1\n        )\n        let firstMission = fact(\n            projectID: projectID,\n            missionID: firstMissionID,\n            statement: "First mission choice",\n            scope: .init(kind: .mission, reference: "first"),\n            verifiedAt: 100\n        )\n        let secondMission = fact(\n            projectID: projectID,\n            missionID: secondMissionID,\n            statement: "Second mission choice",\n            scope: .init(kind: .mission, reference: "second"),\n            verifiedAt: 200\n        )\n\n        let slice = try ProjectBrainContextSelector.select(\n            from: [firstMission, project, secondMission],\n            request: .init(projectID: projectID)\n        )\n\n        XCTAssertEqual(slice.facts, [project])\n        XCTAssertEqual(slice.matchedFactCount, 1)\n    }\n\n'''
          if t.count(mission_marker) != 1:
              raise SystemExit('project-level test marker mismatch')
          t = t.replace(mission_marker, project_test + mission_marker, 1)

          preferred_marker = '''    func testPreferredKindOrderingIsDeterministic() throws {\n'''
          stale_test = '''    func testIncludedStalePreferredKindStillRanksAfterCurrentFact() throws {\n        let projectID = ProjectID()\n        let stalePreferred = fact(\n            projectID: projectID,\n            kind: .architecture,\n            statement: "Old architecture",\n            scope: .init(kind: .project),\n            verifiedAt: 999,\n            freshness: .stale,\n            staleReason: "Architecture changed"\n        )\n        let currentOther = fact(\n            projectID: projectID,\n            kind: .feature,\n            statement: "Current feature",\n            scope: .init(kind: .project),\n            verifiedAt: 1,\n            freshness: .current\n        )\n\n        let slice = try ProjectBrainContextSelector.select(\n            from: [stalePreferred, currentOther],\n            request: .init(\n                projectID: projectID,\n                preferredKinds: [.architecture],\n                freshnessPolicy: .includeStale\n            )\n        )\n\n        XCTAssertEqual(slice.facts.map(\\.factID), [currentOther.factID, stalePreferred.factID])\n    }\n\n'''
          if t.count(preferred_marker) != 1:
              raise SystemExit('stale-priority test marker mismatch')
          tests.write_text(t.replace(preferred_marker, stale_test + preferred_marker, 1))
          PY

          git diff --check
          focused="${RUNNER_TEMP}/ProjectBrainContextFocused"
          rm -rf "$focused"
          mkdir -p "$focused/Sources" "$focused/Tests"
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain "$focused/Sources/AgentDomain"
          cp -R Packages/AgentHarnessKit/Tests/AgentDomainTests "$focused/Tests/AgentDomainTests"
          cat > "$focused/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "ProjectBrainContextFocused",
              products: [.library(name: "AgentDomain", targets: ["AgentDomain"])],
              targets: [
                  .target(name: "AgentDomain"),
                  .testTarget(name: "AgentDomainTests", dependencies: ["AgentDomain"]),
              ]
          )
          SWIFT
          swift test --package-path "$focused" -Xswiftc -warnings-as-errors
          git diff --check

          git config user.name "NovaForge V13 worker"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Sources/AgentDomain/ProjectBrainContext.swift
          git add Packages/AgentHarnessKit/Tests/AgentDomainTests/ProjectBrainContextTests.swift
          git rm .github/workflows/tmp-v13-project-brain-context-truth.yml
          git commit -m "Harden Project Brain context truth boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
