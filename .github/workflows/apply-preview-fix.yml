name: Apply production preview fix

on:
  push:
    branches: [feature/qwen38-forge-ios27]
    paths:
      - 'ci/apply_preview_fix.py'
      - '.github/workflows/apply-preview-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/qwen38-forge-ios27
          fetch-depth: 1
      - name: Apply fail-closed WebKit preview patch
        run: python3 ci/apply_preview_fix.py
      - name: Verify expected diff only
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':(exclude)AgentPad/Views/ArtifactPreviewSheet.swift' && true
          git diff -- AgentPad/Views/ArtifactPreviewSheet.swift
      - name: Commit production fix
        run: |
          set -euo pipefail
          if git diff --quiet -- AgentPad/Views/ArtifactPreviewSheet.swift; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPad/Views/ArtifactPreviewSheet.swift
          git commit -m 'Fix normal HTML artifact preview readiness'
          git push origin HEAD:feature/qwen38-forge-ios27
