name: V14 Local Model Qualification Trust Repair

on:
  push:
    branches:
      - 'worker/GPT56-SOL-NF-V14-LMQ-TRUST-8A10/whole-evidence/e1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/GPT56-SOL-NF-V14-LMQ-TRUST-8A10/whole-evidence/e1

      - name: Assert exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "1dfdf4968414084c068037d2992fb20f38e27f5d" || {
            echo "Unexpected repair parent" >&2
            git log -3 --oneline
            exit 1
          }

      - name: Apply fail-closed trust repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('Packages/LocalModelQualificationCore/Sources/LocalModelQualificationCore/LocalModelQualification.swift')
          text = source.read_text()
          old = '''    /// Evaluates a claim only against receipt IDs independently trusted by the host qualification boundary.
              /// Persisted/model-authored JSON cannot promote itself merely by spelling `deterministicHarness`.
              public func readiness(
          '''.replace('              ', '    ')
          new = '''    /// Internal evaluator over complete evidence values already authenticated by the module-owned host boundary.
              /// Persisted/model-authored JSON remains candidate data and cannot call this evaluator through a normal import.
              func readiness(
          '''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'expected one public raw-evidence readiness declaration, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          trust_source = Path('Packages/LocalModelQualificationCore/Sources/LocalModelQualificationCore/LocalModelQualificationTrust.swift')
          trust_source.write_text(r'''/// Transient host-owned authentication of one complete qualification evidence value.
          ///
          /// Raw `LocalModelQualificationEvidence` remains Codable candidate transport. This binding is intentionally
          /// non-Codable, retains the whole evidence value, and has no public initializer, so ordinary module consumers
          /// cannot turn persisted/model-authored evidence into qualification authority.
          public struct LocalModelQualificationTrustBinding: Hashable, Sendable {
              let authenticatedEvidence: LocalModelQualificationEvidence

              init(authenticatedEvidence: LocalModelQualificationEvidence) {
                  self.authenticatedEvidence = authenticatedEvidence
              }
          }

          public extension LocalModelQualificationRecord {
              /// Evaluates qualification only from module-owned bindings over exact whole-evidence values.
              /// A binding for the same evidence ID with any changed subject/source/authority/status/payload does not match.
              func readiness(
                  for claim: LocalModelQualificationClaim,
                  trustedBindings: Set<LocalModelQualificationTrustBinding>
              ) -> LocalModelQualificationReadiness {
                  let authenticatedEvidence = Set(trustedBindings.map(\.authenticatedEvidence))
                  return readiness(for: claim, trustedEvidence: authenticatedEvidence)
              }
          }
          '''.replace('          ', ''))

          tests = Path('Packages/LocalModelQualificationCore/Tests/LocalModelQualificationCoreTests/LocalModelQualificationTests.swift')
          test_text = tests.read_text()
          marker = 'final class LocalModelQualificationTests: XCTestCase {\n'
          insertion = r'''
              func testProtectedTrustBindingQualifiesOnlyExactWholeEvidence() throws {
                  let subject = try makeSubject()
                  let artifact = try evidence(.artifactIntegrity, subject: subject, source: .staticAnalysis)
                  let record = try LocalModelQualificationRecord(revision: 1, subject: subject, evidence: [artifact])
                  let binding = LocalModelQualificationTrustBinding(authenticatedEvidence: artifact)

                  let readiness = record.readiness(for: .artifactVerified, trustedBindings: [binding])

                  XCTAssertTrue(readiness.isQualified)
                  XCTAssertTrue(readiness.blockingReasons.isEmpty)
              }

              func testProtectedTrustBindingRejectsSameIDEvidenceMutation() throws {
                  let subject = try makeSubject()
                  let trusted = try evidence(
                      .artifactIntegrity,
                      subject: subject,
                      source: .staticAnalysis,
                      evidenceID: "same-id"
                  )
                  let mutated = try evidence(
                      .artifactIntegrity,
                      subject: subject,
                      source: .staticAnalysis,
                      authority: .manualObservation,
                      evidenceID: "same-id"
                  )
                  let record = try LocalModelQualificationRecord(revision: 1, subject: subject, evidence: [mutated])
                  let binding = LocalModelQualificationTrustBinding(authenticatedEvidence: trusted)

                  let readiness = record.readiness(for: .artifactVerified, trustedBindings: [binding])

                  XCTAssertFalse(readiness.isQualified)
                  XCTAssertTrue(readiness.blockingReasons.contains { $0.contains("host qualification boundary") })
              }

          '''.replace('              ', '    ')
          if test_text.count(marker) != 1:
              raise SystemExit('test class marker missing or duplicated')
          tests.write_text(test_text.replace(marker, marker + insertion, 1))

          static_test = Path('Packages/LocalModelQualificationCore/Tests/LocalModelQualificationCoreTests/LocalModelQualificationStaticTrustBoundaryTests.swift')
          static_test.write_text(r'''import Foundation
          import XCTest
          @testable import LocalModelQualificationCore

          final class LocalModelQualificationStaticTrustBoundaryTests: XCTestCase {
              func testExternalConsumerCannotMintQualificationTrustBinding() throws {
                  let temporaryDirectory = FileManager.default.temporaryDirectory
                      .appendingPathComponent("local-model-qualification-static-trust-\(UUID().uuidString)", isDirectory: true)
                  try FileManager.default.createDirectory(at: temporaryDirectory, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(at: temporaryDirectory) }

                  let sourceURL = temporaryDirectory.appendingPathComponent("ExternalTrustMint.swift")
                  try """
                  import LocalModelQualificationCore

                  func attemptMint(_ evidence: LocalModelQualificationEvidence) {
                      _ = LocalModelQualificationTrustBinding(authenticatedEvidence: evidence)
                  }
                  """.write(to: sourceURL, atomically: true, encoding: .utf8)

                  let modulesURL = try activeModulesURL()
                  let process = Process()
                  let output = Pipe()
                  process.executableURL = URL(fileURLWithPath: "/usr/bin/env")
                  process.arguments = [
                      "swiftc",
                      "-typecheck",
                      "-swift-version",
                      "6",
                      "-I",
                      modulesURL.path,
                      sourceURL.path,
                  ]
                  process.standardOutput = output
                  process.standardError = output
                  try process.run()
                  process.waitUntilExit()

                  let diagnostics = String(decoding: output.fileHandleForReading.readDataToEndOfFile(), as: UTF8.self)
                  XCTAssertNotEqual(process.terminationStatus, 0, "External qualification trust mint unexpectedly compiled")
                  XCTAssertFalse(
                      diagnostics.localizedCaseInsensitiveContains("no such module 'LocalModelQualificationCore'"),
                      "Static boundary probe failed before reaching the trust API: \(diagnostics)"
                  )
                  XCTAssertTrue(
                      diagnostics.localizedCaseInsensitiveContains("inaccessible")
                          || diagnostics.localizedCaseInsensitiveContains("internal protection level"),
                      "Expected access-control rejection, got: \(diagnostics)"
                  )
              }

              private func activeModulesURL() throws -> URL {
                  let anchors = [
                      Bundle(for: LocalModelQualificationStaticTrustBoundaryTests.self).bundleURL,
                      URL(fileURLWithPath: CommandLine.arguments[0]),
                  ]

                  for anchor in anchors {
                      var directory = anchor.deletingLastPathComponent()
                      for _ in 0..<10 {
                          let modulesURL = directory.appendingPathComponent("Modules", isDirectory: true)
                          let moduleURL = modulesURL.appendingPathComponent("LocalModelQualificationCore.swiftmodule")
                          if FileManager.default.fileExists(atPath: moduleURL.path) {
                              return modulesURL
                          }
                          let parent = directory.deletingLastPathComponent()
                          if parent.path == directory.path { break }
                          directory = parent
                      }
                  }

                  throw NSError(
                      domain: "LocalModelQualificationStaticTrustBoundaryTests",
                      code: 1,
                      userInfo: [NSLocalizedDescriptionKey: "LocalModelQualificationCore module is missing from the active SwiftPM test bundle/executable ancestry"]
                  )
              }
          }
          '''.replace('          ', ''))
          PY

          git diff --check
          git diff -- Packages/LocalModelQualificationCore

      - name: Debug package tests
        run: swift test --package-path Packages/LocalModelQualificationCore -Xswiftc -warnings-as-errors

      - name: Release package tests
        run: swift test -c release --package-path Packages/LocalModelQualificationCore -Xswiftc -warnings-as-errors

      - name: Commit validated product bytes
        run: |
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/LocalModelQualificationCore
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m "fix(v14): protect local model qualification trust"
          git push origin HEAD:worker/GPT56-SOL-NF-V14-LMQ-TRUST-8A10/whole-evidence/e1
