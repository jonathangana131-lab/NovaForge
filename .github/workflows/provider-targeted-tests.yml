name: Provider targeted tests

on:
  push:
    branches:
      - agent/provider-repair-control

permissions:
  contents: read

concurrency:
  group: provider-targeted-tests-clean-repair
  cancel-in-progress: true

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-phone-provider-reliability-clean
      - name: Run provider contract tests
        run: swift test --package-path Packages/AgentHarnessKit --filter ProviderAdapterContractTests
