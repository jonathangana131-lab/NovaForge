name: V14 Mission semantic identity reproducer

on:
  push:
    branches:
      - review/GPT56-NF-V14-MISSION-SEMANTIC-REPRO-8A8I

jobs:
  mission-semantic-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Verify focused diff
        run: git diff --check
      - name: Run semantic identity reproducer
        run: swift test --package-path Packages/AgentHarnessKit -Xswiftc -warnings-as-errors --filter MissionStageSemanticIdentityReviewTests
