name: Apply Qwen 3.8 Catalog Contract

on:
  push:
    branches: [feature/qwen38-forge-ios27]
    paths:
      - 'ci/apply_qwen38_catalog_contract_fix.py'
      - '.github/workflows/apply-qwen38-catalog-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-qwen38-catalog-contract
  cancel-in-progress: true

jobs:
  apply-and-prove:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exact Qwen 3.8 catalog/test migration
        run: |
          set -euo pipefail
          python3 ci/apply_qwen38_catalog_contract_fix.py
          git diff --check
          rg -n 'static var all: \[LocalModelVariant\]|safestVariant|testLocalCatalogPresentsOnlyQwen38TargetAndNeverFallsBack' \
            AgentPad/Services/LocalModelRuntime.swift \
            AgentPadTests/AgentRuntimeLifecycleTests.swift
      - name: Syntax-build affected app test graph
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project AgentPad.xcodeproj \
            -scheme AgentPad \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/Qwen38CatalogContract \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit only after Xcode accepts the migration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Catalog contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AgentPad/Services/LocalModelRuntime.swift \
            AgentPadTests/AgentLocalModelProviderTransportTests.swift \
            AgentPadTests/AgentRuntimeLifecycleTests.swift
          git commit -m 'Make active local model authority Qwen 3.8 only'
          git fetch origin feature/qwen38-forge-ios27
          git rebase origin/feature/qwen38-forge-ios27
          git push origin HEAD:feature/qwen38-forge-ios27
