name: V14 ForgeRuntime State Authority Repair

on:
  push:
    branches:
      - "validation/GPT56-NF-V14-STATE-RECOVER-8B09/runtime-state-observation-proof"

permissions:
  contents: write

jobs:
  repair-and-prove:
    name: Repair trust seam + prove package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "worker/GPT56-NF-V14-STATE-RECOVER-8B09/runtime-state-observation/e1"
          fetch-depth: 0
      - name: Apply narrow authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Packages/ForgeRuntimeKit/Sources/ForgeRuntime/ForgeRuntimeStateObservation.swift")
          text = source.read_text()
          replacements = [
              (
                  "public protocol ForgeRuntimeStateEvidenceAuthenticating: Sendable {",
                  "protocol ForgeRuntimeStateEvidenceAuthenticating: Sendable {",
              ),
              (
                  "public enum ForgeRuntimeStateEvaluator {",
                  "enum ForgeRuntimeStateEvaluator {",
              ),
              (
                  "    public static func evaluate<Authenticator: ForgeRuntimeStateEvidenceAuthenticating>(",
                  "    static func evaluate<Authenticator: ForgeRuntimeStateEvidenceAuthenticating>(",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
          source.write_text(text)

          tests = Path("Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateObservationTests.swift")
          test_text = tests.read_text()
          marker = "import ForgeRuntime\n"
          if test_text.count(marker) != 1:
              raise SystemExit("expected one ForgeRuntime import in observation tests")
          tests.write_text(test_text.replace(marker, "@testable import ForgeRuntime\n", 1))

          trust_test = Path("Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateTrustBoundaryTests.swift")
          if trust_test.exists():
              raise SystemExit("trust-boundary test already exists unexpectedly")
          trust_test.write_text(r'''import Foundation
import XCTest
@testable import ForgeRuntime

final class ForgeRuntimeStateTrustBoundaryTests: XCTestCase {
    func testExternalConsumerCannotNameStateEvidenceAuthenticator() throws {
        let diagnostics = try typecheckExternalConsumer(
            named: "StateAuthenticator.swift",
            source: """
            import ForgeRuntime

            typealias LeakedStateAuthenticator = ForgeRuntimeStateEvidenceAuthenticating
            """
        )

        XCTAssertTrue(
            diagnostics.localizedCaseInsensitiveContains("cannot find type 'forgeruntimestateevidenceauthenticating'")
                || diagnostics.localizedCaseInsensitiveContains("cannot find 'forgeruntimestateevidenceauthenticating'"),
            "Expected state evidence authenticator to be hidden from external consumers, got: \(diagnostics)"
        )
    }

    func testExternalConsumerCannotCallStateAcceptanceEvaluator() throws {
        let diagnostics = try typecheckExternalConsumer(
            named: "StateEvaluator.swift",
            source: """
            import ForgeRuntime

            typealias LeakedStateEvaluator = ForgeRuntimeStateEvaluator
            """
        )

        XCTAssertTrue(
            diagnostics.localizedCaseInsensitiveContains("cannot find type 'forgeruntimestateevaluator'")
                || diagnostics.localizedCaseInsensitiveContains("cannot find 'forgeruntimestateevaluator'"),
            "Expected state acceptance evaluator to be hidden from external consumers, got: \(diagnostics)"
        )
    }

    private func typecheckExternalConsumer(
        named fileName: String,
        source: String
    ) throws -> String {
        let temporaryDirectory = FileManager.default.temporaryDirectory
            .appendingPathComponent("forge-runtime-state-trust-\(UUID().uuidString)", isDirectory: true)
        try FileManager.default.createDirectory(
            at: temporaryDirectory,
            withIntermediateDirectories: true
        )
        defer { try? FileManager.default.removeItem(at: temporaryDirectory) }

        let sourceURL = temporaryDirectory.appendingPathComponent(fileName)
        try source.write(to: sourceURL, atomically: true, encoding: .utf8)

        let modulesURL = try activeModulesURL()
        let process = Process()
        let output = Pipe()
        process.executableURL = URL(fileURLWithPath: "/usr/bin/env")
        process.arguments = [
            "swiftc",
            "-typecheck",
            "-swift-version",
            "6",
            "-I",
            modulesURL.path,
            sourceURL.path,
        ]
        process.standardOutput = output
        process.standardError = output
        try process.run()
        process.waitUntilExit()

        let diagnostics = String(
            decoding: output.fileHandleForReading.readDataToEndOfFile(),
            as: UTF8.self
        )

        XCTAssertNotEqual(process.terminationStatus, 0, "External state trust bypass unexpectedly compiled")
        XCTAssertFalse(
            diagnostics.localizedCaseInsensitiveContains("no such module 'forgeruntime'"),
            "Static boundary probe failed before reaching the ForgeRuntime trust API: \(diagnostics)"
        )
        return diagnostics
    }

    private func activeModulesURL() throws -> URL {
        var directory = URL(fileURLWithPath: CommandLine.arguments[0])
            .deletingLastPathComponent()

        for _ in 0..<10 {
            let modulesURL = directory.appendingPathComponent("Modules", isDirectory: true)
            let moduleURL = modulesURL.appendingPathComponent("ForgeRuntime.swiftmodule")
            if FileManager.default.fileExists(atPath: moduleURL.path) {
                return modulesURL
            }

            let parent = directory.deletingLastPathComponent()
            if parent.path == directory.path {
                break
            }
            directory = parent
        }

        throw NSError(
            domain: "ForgeRuntimeStateTrustBoundaryTests",
            code: 1,
            userInfo: [
                NSLocalizedDescriptionKey:
                    "ForgeRuntime module is missing from the active SwiftPM test executable ancestry"
            ]
        )
    }
}
''')
          PY
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          Packages/ForgeRuntimeKit/Sources/ForgeRuntime/ForgeRuntimeStateObservation.swift
          Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateObservationTests.swift
          Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateTrustBoundaryTests.swift
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Swift version
        run: swift --version
      - name: Debug package proof
        run: swift test --package-path Packages/ForgeRuntimeKit -Xswiftc -warnings-as-errors
      - name: Release package proof
        run: swift test -c release --package-path Packages/ForgeRuntimeKit -Xswiftc -warnings-as-errors
      - name: Commit repaired authority boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovaForge V14 worker"
          git config user.email "actions@users.noreply.github.com"
          git add \
            Packages/ForgeRuntimeKit/Sources/ForgeRuntime/ForgeRuntimeStateObservation.swift \
            Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateObservationTests.swift \
            Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateTrustBoundaryTests.swift
          git commit -m "[V14] Quarantine Forge Runtime state acceptance authority"
          git push origin HEAD:worker/GPT56-NF-V14-STATE-RECOVER-8B09/runtime-state-observation/e1
