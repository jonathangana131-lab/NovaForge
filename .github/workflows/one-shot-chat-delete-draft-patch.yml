name: One-shot chat delete draft patch

on:
  push:
    branches:
      - gpt56-sol-preview-chat-delete-draft-0810
    paths:
      - '.github/workflows/one-shot-chat-delete-draft-patch.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-chat-delete-draft-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56-sol-preview-chat-delete-draft-0810
          fetch-depth: 0

      - name: Patch successful-delete draft invalidation
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          grep -F 'ConversationDraftPersistence.shared.markDeletedAndPurge(conversationID)' AgentPad/Views/AppRootView.swift
          grep -F 'guard ConversationDraftPersistence.shared.shouldPersist(conversationID) else {' AgentPad/Views/ChatView.swift

      - name: Commit narrow repair and remove one-shot workflow
        run: |
          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/one-shot-chat-delete-draft-patch.yml
          git add AgentPad/Views/AppRootView.swift AgentPad/Views/ChatView.swift .github/workflows/one-shot-chat-delete-draft-patch.yml
          git commit -m "Purge persisted drafts after chat deletion"
          git push origin HEAD:gpt56-sol-preview-chat-delete-draft-0810
