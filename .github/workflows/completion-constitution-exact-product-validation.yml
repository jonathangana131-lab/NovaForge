name: Completion Constitution exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/completion-constitution-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4418e308765bf1eea464369829cecd166c61d1d5"
          git diff --check HEAD^

      - name: Debug Completion Constitution contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCompletionCore \
            -Xswiftc -warnings-as-errors

      - name: Release Completion Constitution contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/ForgeCompletionCore \
            -c release \
            -Xswiftc -warnings-as-errors
