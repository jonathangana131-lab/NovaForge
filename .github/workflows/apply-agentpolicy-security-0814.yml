name: Apply pinned-descriptor AgentPolicy security repair

on:
  push:
    branches:
      - patch/GPT56-SOL-NF-V14-POLICY-POSIX-0814/e6-security

permissions:
  contents: write

jobs:
  patch-product-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/GPT56-SOL-NF-V14-POLICY-POSIX-0814/e1
          fetch-depth: 0

      - name: Apply exact guarded security repair
        shell: bash
        run: |
          set -euo pipefail
          expected="804b5a6c02b98ca3b588587f75e4a745bf2c866f"
          test "$(git rev-parse HEAD)" = "$expected"

          python3 - <<'PY'
          from pathlib import Path

          store = Path('Packages/AgentHarnessKit/Sources/AgentPolicy/FilePolicyAuthorityStore.swift')
          source = store.read_text()

          location_start = source.index('    struct Location: Sendable {\n')
          location_end = source.index('    struct Preparation: Sendable {\n', location_start)
          old_location = source[location_start:location_end]
          expected_location = (
              '    struct Location: Sendable {\n'
              '        let directoryURL: URL\n'
              '        let fileName: String\n'
              '        let lockName: String\n'
              '        let directoryIdentity: FileIdentity\n'
              '        let lockIdentity: FileIdentity\n'
              '    }\n\n'
          )
          if old_location != expected_location:
              raise SystemExit('Location block drifted from audited preimage')
          new_location = (
              '    final class DescriptorPins: @unchecked Sendable {\n'
              '        let directoryDescriptor: Int32\n'
              '        let lockDescriptor: Int32\n\n'
              '        init(directoryDescriptor: Int32, lockDescriptor: Int32) {\n'
              '            self.directoryDescriptor = directoryDescriptor\n'
              '            self.lockDescriptor = lockDescriptor\n'
              '        }\n\n'
              '        deinit {\n'
              '            close(lockDescriptor)\n'
              '            close(directoryDescriptor)\n'
              '        }\n'
              '    }\n\n'
              '    struct Location: Sendable {\n'
              '        let directoryURL: URL\n'
              '        let fileName: String\n'
              '        let lockName: String\n'
              '        let directoryIdentity: FileIdentity\n'
              '        let lockIdentity: FileIdentity\n'
              '        let descriptorPins: DescriptorPins\n'
              '    }\n\n'
          )
          source = source[:location_start] + new_location + source[location_end:]

          prepare_start = source.index('    static func prepare(\n')
          prepare_end = source.index('    static func withExclusiveLock<Result: Sendable>(\n', prepare_start)
          prepare = source[prepare_start:prepare_end]

          directory_open = (
              '        let directoryDescriptor = try openDirectory(at: directoryURL)\n'
              '        defer { close(directoryDescriptor) }\n'
          )
          directory_keepalive = (
              '        let directoryDescriptor = try openDirectory(at: directoryURL)\n'
              '        var shouldCloseDirectoryDescriptor = true\n'
              '        defer {\n'
              '            if shouldCloseDirectoryDescriptor { close(directoryDescriptor) }\n'
              '        }\n'
          )
          if prepare.count(directory_open) != 1:
              raise SystemExit(f'prepare directory preimage count={prepare.count(directory_open)}')
          prepare = prepare.replace(directory_open, directory_keepalive, 1)

          lock_open = (
              '        let lockDescriptor = try openLock(\n'
              '            directoryDescriptor: directoryDescriptor,\n'
              '            name: lockName\n'
              '        )\n'
              '        defer { close(lockDescriptor) }\n'
          )
          lock_keepalive = (
              '        let lockDescriptor = try openLock(\n'
              '            directoryDescriptor: directoryDescriptor,\n'
              '            name: lockName\n'
              '        )\n'
              '        var shouldCloseLockDescriptor = true\n'
              '        defer {\n'
              '            if shouldCloseLockDescriptor { close(lockDescriptor) }\n'
              '        }\n'
          )
          if prepare.count(lock_open) != 1:
              raise SystemExit(f'prepare lock preimage count={prepare.count(lock_open)}')
          prepare = prepare.replace(lock_open, lock_keepalive, 1)

          location_init = (
              '        let location = Location(\n'
              '            directoryURL: directoryURL,\n'
              '            fileName: fileName,\n'
              '            lockName: lockName,\n'
              '            directoryIdentity: FileIdentity(directoryStatus),\n'
              '            lockIdentity: FileIdentity(lockStatus)\n'
              '        )\n'
          )
          location_with_pins = (
              '        let location = Location(\n'
              '            directoryURL: directoryURL,\n'
              '            fileName: fileName,\n'
              '            lockName: lockName,\n'
              '            directoryIdentity: FileIdentity(directoryStatus),\n'
              '            lockIdentity: FileIdentity(lockStatus),\n'
              '            descriptorPins: DescriptorPins(\n'
              '                directoryDescriptor: directoryDescriptor,\n'
              '                lockDescriptor: lockDescriptor\n'
              '            )\n'
              '        )\n'
              '        shouldCloseDirectoryDescriptor = false\n'
              '        shouldCloseLockDescriptor = false\n'
          )
          if prepare.count(location_init) != 1:
              raise SystemExit(f'prepare Location init preimage count={prepare.count(location_init)}')
          prepare = prepare.replace(location_init, location_with_pins, 1)
          source = source[:prepare_start] + prepare + source[prepare_end:]
          store.write_text(source)

          tests = Path('Packages/AgentHarnessKit/Tests/AgentPolicyTests/MutationEffectStaticSecurityTests.swift')
          test_source = tests.read_text()
          helper_start = test_source.index('    private func compileMisuse(\n')
          helper = test_source[helper_start:]
          executable = '        process.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")\n'
          arguments_start = '        process.arguments = [\n'
          if helper.count(executable) != 1 or helper.count(arguments_start) != 1:
              raise SystemExit('compileMisuse executable/argument preimage drifted')
          helper = helper.replace(executable, '', 1)
          helper = helper.replace(arguments_start, '        let compilerArguments = [\n', 1)
          arguments_end = (
              '            sourceURL.path,\n'
              '        ]\n'
              '        process.standardOutput = output\n'
          )
          replacement_end = (
              '            sourceURL.path,\n'
              '        ]\n'
              '#if os(macOS)\n'
              '        process.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")\n'
              '#else\n'
              '        process.executableURL = URL(fileURLWithPath: "/usr/bin/env")\n'
              '#endif\n'
              '        process.arguments = compilerArguments\n'
              '        process.standardOutput = output\n'
          )
          if helper.count(arguments_end) != 1:
              raise SystemExit(f'compileMisuse argument terminator count={helper.count(arguments_end)}')
          helper = helper.replace(arguments_end, replacement_end, 1)
          tests.write_text(test_source[:helper_start] + helper)
          PY

          expected_files=$(cat <<'EOF'
          Packages/AgentHarnessKit/Sources/AgentPolicy/FilePolicyAuthorityStore.swift
          Packages/AgentHarnessKit/Tests/AgentPolicyTests/MutationEffectStaticSecurityTests.swift
          EOF
          )
          test "$(git status --short | awk '{print $2}' | sort)" = "$(printf '%s\n' "$expected_files" | sort)"
          git diff --check
          grep -q 'final class DescriptorPins' Packages/AgentHarnessKit/Sources/AgentPolicy/FilePolicyAuthorityStore.swift
          grep -q 'shouldCloseDirectoryDescriptor = false' Packages/AgentHarnessKit/Sources/AgentPolicy/FilePolicyAuthorityStore.swift
          grep -q 'shouldCloseLockDescriptor = false' Packages/AgentHarnessKit/Sources/AgentPolicy/FilePolicyAuthorityStore.swift
          grep -q 'URL(fileURLWithPath: "/usr/bin/env")' Packages/AgentHarnessKit/Tests/AgentPolicyTests/MutationEffectStaticSecurityTests.swift

          git config user.name "NovaForge Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add $expected_files
          git commit -m "AgentPolicy: pin authority descriptors for identity stability"
          git push origin HEAD:worker/GPT56-SOL-NF-V14-POLICY-POSIX-0814/e1
