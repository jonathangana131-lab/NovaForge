name: V14 Preview theme durability targeted UI one-shot

on:
  push:
    branches:
      - worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2

permissions:
  contents: write

jobs:
  targeted-theme-durability:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2
          fetch-depth: 0

      - name: Select current Xcode and Simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          newest_xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -1)
          test -n "$newest_xcode"
          sudo xcode-select -s "$newest_xcode/Contents/Developer"
          xcodebuild -version
          udid=$(xcrun simctl list -j devices available | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true and (.name | startswith("iPhone")))] | last | .udid // empty')
          if [[ -z "$udid" ]]; then
            device_type=$(xcrun simctl list -j devicetypes | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")] | last | .identifier // empty')
            test -n "$device_type"
            udid=$(xcrun simctl create "NovaForge Theme Durability" "$device_type")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build test bundle once
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          rm -rf DerivedData/ThemeDurability
          xcodebuild \
            -project AgentPad.xcodeproj \
            -scheme AgentPad \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData/ThemeDurability \
            -skipPackageUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          xctestrun=$(find DerivedData/ThemeDurability/Build/Products -maxdepth 1 -name 'AgentPad_*.xctestrun' -print | head -1)
          test -n "$xctestrun"
          echo "$xctestrun" > /tmp/novaforge-theme-durability-xctestrun

      - name: Run persisted-theme relaunch journey
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xctestrun=$(cat /tmp/novaforge-theme-durability-xctestrun)
          xcodebuild \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            test-without-building \
            '-only-testing:AgentPadUITests/AgentPadUITests/testThemeLaunchOverrideDoesNotReplacePersistedSelection'

      - name: Remove one-shot workflow after proof
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NovaForge V14 Preview Worker'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/v14-preview-theme-durability-ui-one-shot.yml
          git add .github/workflows/v14-preview-theme-durability-ui-one-shot.yml
          git commit -m 'ci: remove targeted theme durability Simulator probe'
          git push origin HEAD:worker/GPT56-SOL-NF-V14-PREVIEW-THEME-RECOVER-0810/e2

      - name: Shutdown Simulator
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true