name: Core AI Qwen3.5 Draft Qualification

on:
  push:
    branches: [experiment/coreai-qwen35-draft]
    paths:
      - 'Research/CoreAIDraft/**'
      - '.github/workflows/coreai-draft-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreai-draft-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qualification:
    name: Token identity + state layout
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Show toolchain
        run: |
          xcodebuild -version
          python3 --version
      - name: Prove official tokenizer assets are identical
        run: python3 Research/CoreAIDraft/tokenizer_compatibility.py
      - name: Validate persistent-state memory budget
        run: python3 Research/CoreAIDraft/qwen35_state_contract.py
      - name: Validate ANE-safe functional state shapes
        run: python3 Research/CoreAIDraft/qwen35_coreai_state_contract.py

  delta-equivalence:
    name: DeltaNet recurrent math equivalence
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact numerical reference stack
        run: python -m pip install --disable-pip-version-check 'torch==2.9.0' 'transformers==5.5.0'
      - name: Compare NovaForge recurrent primitive with Transformers
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python Research/CoreAIDraft/qwen35_delta_equivalence.py

  coreai-functional-state-export:
    name: Core AI functional-state export smoke
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show Core AI host toolchain
        run: |
          xcodebuild -version
          python --version
      - name: Install Apple-pinned Core AI exporter stack
        run: |
          python -m pip install --disable-pip-version-check \
            'torch==2.9.0' \
            'coreai-core==1.0.0b2' \
            'coreai-torch==0.4.1'
          python - <<'PY'
          import coreai_torch
          print('coreai_torch=', coreai_torch.__file__)
          PY
      - name: Export FP16 functional recurrent-state graph
        run: |
          set -euo pipefail
          mkdir -p artifacts/coreai-draft-smoke
          python Research/CoreAIDraft/coreai_functional_state_smoke.py \
            --dtype float16 \
            --output artifacts/coreai-draft-smoke/qwen35-functional-state-smoke.aimodel
          test -e artifacts/coreai-draft-smoke/qwen35-functional-state-smoke.aimodel
      - name: Discover AOT compiler capability
        id: aot
        run: |
          set -euo pipefail
          if xcrun --find coreai-build >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            xcrun coreai-build --help | head -40 || true
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Hosted Xcode 27 beta image does not include coreai-build; export remains valid and AOT is delegated to a newer/self-hosted Xcode lane.'
          fi
      - name: Compile synthetic graph for iOS when AOT is installed
        if: steps.aot.outputs.available == 'true'
        run: |
          set -euo pipefail
          xcrun coreai-build compile \
            artifacts/coreai-draft-smoke/qwen35-functional-state-smoke.aimodel \
            --platform iOS
      - name: Record hosted compiler capability
        run: |
          printf 'aot_coreai_build=%s\n' '${{ steps.aot.outputs.available }}' \
            > artifacts/coreai-draft-smoke/host-capability.txt
          xcodebuild -version >> artifacts/coreai-draft-smoke/host-capability.txt
      - name: Upload exported graph and capability receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coreai-qwen35-functional-state-smoke-${{ github.run_id }}
          path: artifacts/coreai-draft-smoke
          if-no-files-found: warn
          retention-days: 7
