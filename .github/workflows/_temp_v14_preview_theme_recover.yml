name: Temporary V14 Preview theme durability recovery

on:
  push:
    branches:
      - gpt56-sol-preview-theme-durability-0814

permissions:
  contents: write

jobs:
  recover-theme-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile the accepted theme durability delta
        shell: bash
        run: |
          set -euo pipefail
          base=991ece0ed9add9acf1108055f489b25f6cc9843f
          donor=ce04a0da005be789ecbd97d0847d11b50daf1b2f
          git fetch --no-tags origin "$base" "$donor"
          git diff --binary "$base" "$donor" -- \
            AgentPad/App/AgentPadApp.swift \
            AgentPad/Design/AgentTheme.swift \
            AgentPad/Views/AppRootView.swift \
            AgentPad/Views/SettingsView.swift \
            AgentPadTests/AgentRuntimeLifecycleTests.swift \
            AgentPadUITests/AgentPadUITests.swift \
            scripts/verify_v14_preview_theme_contract.sh \
            scripts/verify_v14_preview_theme_reset_cache.sh \
            > /tmp/theme-durability.patch
          test -s /tmp/theme-durability.patch
          git apply --3way /tmp/theme-durability.patch
          rm .github/workflows/_temp_v14_preview_theme_recover.yml

      - name: Validate recovered product tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify_v14_preview_theme_contract.sh
          bash -n scripts/verify_v14_preview_theme_reset_cache.sh
          bash scripts/verify_v14_preview_theme_contract.sh
          bash scripts/verify_v14_preview_theme_reset_cache.sh
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'AgentPad/App/AgentPadApp.swift',
              'AgentPad/Design/AgentTheme.swift',
              'AgentPad/Views/AppRootView.swift',
              'AgentPad/Views/SettingsView.swift',
              'AgentPadTests/AgentRuntimeLifecycleTests.swift',
              'AgentPadUITests/AgentPadUITests.swift',
              'scripts/verify_v14_preview_theme_contract.sh',
              'scripts/verify_v14_preview_theme_reset_cache.sh',
              '.github/workflows/_temp_v14_preview_theme_recover.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected recovery scope: expected={sorted(expected)} actual={sorted(actual)}')
          print('V14 Preview theme durability recovery scope: PASS')
          PY

      - name: Publish reconciled product head and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovaForge Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preview: keep launch-only theme overrides ephemeral"
          git push origin HEAD:gpt56-sol-preview-theme-durability-0814
