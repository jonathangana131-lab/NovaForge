name: V14 Forge Compact contract

on:
  pull_request:
    paths:
      - 'Packages/ForgeCompactCore/**'
      - '.github/workflows/v14-forge-compact-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Forge Compact warnings-as-errors
        run: swift test --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
