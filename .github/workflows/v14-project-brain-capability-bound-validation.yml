name: V14 Project Brain Capability-Bound Validation

on:
  push:
    branches:
      - validation/GPT56-NF-V14-PBRAIN-TRUST-0809/capability-bound/**

jobs:
  exact-agent-domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Record toolchain
        run: swift --version

      - name: Assert exact product parent
        run: |
          test "$(git rev-parse HEAD^)" = "fcf1b8b5d9cc9199cea2c0884ce262bd401596d7"
          git diff --check HEAD^

      - name: Build real AgentDomain target Debug with warnings as errors
        run: swift build --package-path Packages/AgentHarnessKit --target AgentDomain -Xswiftc -warnings-as-errors

      - name: Build real AgentDomain target Release with warnings as errors
        run: swift build --package-path Packages/AgentHarnessKit -c release --target AgentDomain -Xswiftc -warnings-as-errors

      - name: Assemble exact-source AgentDomain test harness
        shell: bash
        run: |
          rm -rf /tmp/ProjectBrainExactHarness
          mkdir -p /tmp/ProjectBrainExactHarness/Sources/AgentDomain
          mkdir -p /tmp/ProjectBrainExactHarness/Tests/AgentDomainTests
          cp -R Packages/AgentHarnessKit/Sources/AgentDomain/. /tmp/ProjectBrainExactHarness/Sources/AgentDomain/
          cp -R Packages/AgentHarnessKit/Tests/AgentDomainTests/. /tmp/ProjectBrainExactHarness/Tests/AgentDomainTests/
          cat > /tmp/ProjectBrainExactHarness/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "ProjectBrainExactHarness",
              products: [
                  .library(name: "AgentDomain", targets: ["AgentDomain"]),
              ],
              targets: [
                  .target(name: "AgentDomain"),
                  .testTarget(name: "AgentDomainTests", dependencies: ["AgentDomain"]),
              ]
          )
          EOF

      - name: Run exact AgentDomain tests Debug with warnings as errors
        run: swift test --package-path /tmp/ProjectBrainExactHarness -Xswiftc -warnings-as-errors

      - name: Run exact AgentDomain tests Release with warnings as errors
        run: swift test --package-path /tmp/ProjectBrainExactHarness -c release -Xswiftc -warnings-as-errors
