name: Temporary V13 mission durable-state hardening

on:
  push:
    branches:
      - worker/GPT56-NF-CONSOLIDATE-7A8E/mission-durable-state-hardening/e1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply and verify exact stacked patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 406181529a8f0cedbd9ce9fadaeec8da5142db57 HEAD
          unexpected="$(git diff --name-only 406181529a8f0cedbd9ce9fadaeec8da5142db57 HEAD | grep -Ev '^(.github/workflows/tmp-v13-mission-durable-state-hardening.yml|scripts/tmp_v13_mission_durable_state_hardening.py)$' || true)"
          test -z "$unexpected"
          python3 scripts/tmp_v13_mission_durable_state_hardening.py
          git diff --check
          swift test --package-path Packages/AgentHarnessKit -Xswiftc -warnings-as-errors
          git diff --check
          git config user.name "NovaForge V13 worker"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMission.swift
          git add Packages/AgentHarnessKit/Sources/ForgeMission/ForgeMissionArchive.swift
          git add Packages/AgentHarnessKit/Tests/ForgeMissionTests/ForgeMissionTests.swift
          git rm .github/workflows/tmp-v13-mission-durable-state-hardening.yml
          git rm scripts/tmp_v13_mission_durable_state_hardening.py
          git commit -m "Harden durable ForgeMission decisions and restore lineage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
