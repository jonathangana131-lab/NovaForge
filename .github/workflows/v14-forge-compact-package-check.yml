name: V14 Forge Compact package check

on:
  push:
    branches:
      - worker/GPT56-NF-V14-CAPS-8A08/forge-compact-capsule/e1
  workflow_dispatch:

jobs:
  forge-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test ForgeCompactCore with warnings as errors
        run: swift test --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
