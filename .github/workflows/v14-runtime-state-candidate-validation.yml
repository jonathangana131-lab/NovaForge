name: V14 Runtime State Candidate Validation

on:
  push:
    branches:
      - validation/GPT56-NF-V14-STATE-RECOVER-0809/runtime-state-candidate-gate/e4

permissions:
  contents: read

jobs:
  runtime-state-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact latest-main product parent and diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5bda297c516b644794bdbc1b10608729c9b0cd07"
          test "$(git hash-object Packages/ForgeRuntimeKit/Sources/ForgeRuntime/ForgeRuntimeStateObservation.swift)" = "111e776336ae64973b2a3843b5574075757d16fd"
          test "$(git hash-object Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateObservationTests.swift)" = "f7872fb8161f14b67af95c85730578fbf9b79993"
          test "$(git hash-object Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateStaticTrustBoundaryTests.swift)" = "8ada05711e6ef5e83283094a0d31c29611682d94"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/v14-runtime-state-candidate-validation.yml"
          printf '%s\n' \
            'Packages/ForgeRuntimeKit/Sources/ForgeRuntime/ForgeRuntimeStateObservation.swift' \
            'Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateObservationTests.swift' \
            'Packages/ForgeRuntimeKit/Tests/ForgeRuntimeTests/ForgeRuntimeStateStaticTrustBoundaryTests.swift' > /tmp/expected
          git diff --name-only f7560acbc50c624af46858a3aefc195fae5bc48f HEAD^ > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check f7560acbc50c624af46858a3aefc195fae5bc48f HEAD^

      - name: Swift version
        run: swift --version

      - name: ForgeRuntimeKit debug tests
        run: swift test --package-path Packages/ForgeRuntimeKit -Xswiftc -warnings-as-errors

      - name: ForgeRuntimeKit release tests
        run: swift test --package-path Packages/ForgeRuntimeKit -c release -Xswiftc -warnings-as-errors
