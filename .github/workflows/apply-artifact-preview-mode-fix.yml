name: Apply Artifact Preview Mode Fix

on:
  push:
    branches: [feature/qwen38-forge-ios27-polish]
    paths:
      - '.github/workflows/apply-artifact-preview-mode-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-preview-proof:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply fail-closed source transform
        run: |
          set -euo pipefail
          python3 ci/apply_artifact_preview_mode_fix.py
          git diff --check
          rg -n 'Normal preview' AgentPad/Views/ArtifactPreviewSheet.swift
      - name: Select newest Xcode and iOS 27 simulator
        id: sim
        run: |
          set -euo pipefail
          NEWEST_XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          xcodebuild -version
          UDID=$(xcrun simctl list -j devices available | jq -r '[.devices | to_entries[] | select(.key | contains("iOS 27")) | .value[] | select(.isAvailable == true and (.name | startswith("iPhone")))] | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo 'No iOS 27 iPhone simulator is available.' >&2
            xcrun simctl list devices available
            exit 69
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Run failing web-artifact journey only
        run: |
          set -euo pipefail
          rm -rf DerivedData/PreviewFix artifacts/preview-fix
          mkdir -p artifacts/preview-fix
          xcodebuild test \
            -project AgentPad.xcodeproj \
            -scheme AgentPad \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath DerivedData/PreviewFix \
            -resultBundlePath artifacts/preview-fix/PreviewFix.xcresult \
            -only-testing:AgentPadUITests/AgentPadUITests/testLocalWebArtifactCreatesPreviewableLandingPage \
            CODE_SIGNING_ALLOWED=NO \
            | tee artifacts/preview-fix/xcodebuild.log
      - name: Commit production source only after focused proof passes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPad/Views/ArtifactPreviewSheet.swift
          git commit -m 'Fix normal artifact preview mode state'
          git push origin HEAD:feature/qwen38-forge-ios27-polish
      - name: Upload focused simulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-preview-mode-proof-${{ github.run_id }}
          path: artifacts/preview-fix
          if-no-files-found: warn
          retention-days: 14
