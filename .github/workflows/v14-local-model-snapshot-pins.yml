name: V14 Local model snapshot pins

on:
  pull_request:
    paths:
      - 'Vendor/swift-llama-cpp/Sources/SwiftLlama/NovaForgeMLXRuntime.swift'
      - 'scripts/validate_v14_local_model_snapshot_pins.py'
      - 'scripts/validate_v14_local_model_cache_revision_binding.py'
      - '.github/workflows/v14-local-model-snapshot-pins.yml'
  push:
    branches:
      - main
    paths:
      - 'Vendor/swift-llama-cpp/Sources/SwiftLlama/NovaForgeMLXRuntime.swift'
      - 'scripts/validate_v14_local_model_snapshot_pins.py'
      - 'scripts/validate_v14_local_model_cache_revision_binding.py'
      - '.github/workflows/v14-local-model-snapshot-pins.yml'

permissions:
  contents: read

jobs:
  immutable-model-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile validators
        run: >-
          python3 -m py_compile
          scripts/validate_v14_local_model_snapshot_pins.py
          scripts/validate_v14_local_model_cache_revision_binding.py
      - name: Run snapshot-pin adversarial self-test
        run: python3 scripts/validate_v14_local_model_snapshot_pins.py --self-test --repo-root .
      - name: Run cache-revision adversarial self-test
        run: python3 scripts/validate_v14_local_model_cache_revision_binding.py --self-test --repo-root .
      - name: Validate repository MLX snapshot pins
        run: python3 scripts/validate_v14_local_model_snapshot_pins.py --repo-root .
      - name: Validate repository MLX cache revision binding
        run: python3 scripts/validate_v14_local_model_cache_revision_binding.py --repo-root .
      - name: Reject obvious mutable MLX cache revision fallback
        shell: bash
        run: |
          runtime='Vendor/swift-llama-cpp/Sources/SwiftLlama/NovaForgeMLXRuntime.swift'
          if [[ ! -f "$runtime" ]]; then
            echo '[PASS] MLX runtime is not present on this head.'
            exit 0
          fi
          if grep -Eq 'ref:[[:space:]]*"(main|master|latest)"' "$runtime"; then
            echo '[FAIL] MLX cache lookup must not resolve a mutable branch/latest label.' >&2
            exit 1
          fi
          if grep -Fq 'revision ??' "$runtime"; then
            echo '[FAIL] Optional MLX download revisions must fail closed instead of defaulting.' >&2
            exit 1
          fi
          echo '[PASS] MLX cache lookup has no mutable branch/latest or optional-revision fallback.'
