name: V14 Forge Compact Repair Exact Head

on:
  push:
    branches:
      - 'worker/GPT56-NF-V14-COMPACT-REPAIR-8A8/forge-compact-postmerge-hardening/e1'
  pull_request:
    paths:
      - 'Packages/ForgeCompactCore/**'
      - '.github/workflows/v14-forge-compact-repair-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: v14-forge-compact-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-package:
    name: ForgeCompactCore debug + release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Debug package tests with warnings as errors
        run: swift test --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
      - name: Release package tests with warnings as errors
        run: swift test -c release --package-path Packages/ForgeCompactCore -Xswiftc -warnings-as-errors
