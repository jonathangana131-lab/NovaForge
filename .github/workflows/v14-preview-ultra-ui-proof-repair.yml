name: V14 Preview Ultra UI Proof Repair

on:
  push:
    branches:
      - worker/GPT56SOL-NF-V14-PREVIEW-ULTRA-INTEGRATION-0810/e1
    paths:
      - .github/workflows/v14-preview-ultra-ui-proof-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align UI proof with user-facing Ultra label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AgentPadUITests/AgentPadUITests.swift')
          text = path.read_text()
          exact_literal_count = text.count('"UltraCode"')
          if exact_literal_count < 3:
              raise SystemExit(f'Expected at least 3 exact UltraCode UI literals, found {exact_literal_count}')

          updated = text.replace('"UltraCode"', '"Ultra"')
          if updated == text:
              raise SystemExit('No UI proof expectations changed')
          path.write_text(updated)

          required = [
              'NSPredicate(format: "value == %@", "Ultra")',
              'localizedCaseInsensitiveContains("Ultra")',
              'format: "label CONTAINS[c] %@",\n                "Ultra"',
          ]
          repaired = path.read_text()
          for needle in required:
              if needle not in repaired:
                  raise SystemExit(f'Missing repaired Ultra UI proof seam: {needle}')

          if '"UltraCode"' in repaired:
              raise SystemExit('An exact user-facing UltraCode UI expectation remains')

          print(f'Repaired {exact_literal_count} exact user-facing UltraCode UI expectations')
          PY
          git diff --check
          git diff -- AgentPadUITests/AgentPadUITests.swift
      - name: Commit proof repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v14-preview-ultra-ui-proof-repair.yml
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git add AgentPadUITests/AgentPadUITests.swift .github/workflows/v14-preview-ultra-ui-proof-repair.yml
          git diff --cached --check
          git commit -m "test: align Ultra UI proof labels"
          git push origin HEAD:${GITHUB_REF_NAME}
