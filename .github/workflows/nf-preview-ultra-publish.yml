name: NF Preview Ultra Publisher

on:
  push:
    branches:
      - agent/preview-ultra-effort-sol

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open draft PR and record swarm handoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/preview-ultra-effort-sol
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            cat > /tmp/pr-body.md <<'EOF'
          ## What changed

          - changes the normal five-stop Composer top effort label from `UltraCode` to **Ultra**
          - keeps the internal persisted/orchestration identity as `.ultraCode`
          - keeps Ultra bound to the already-implemented strongest behavior: max reasoning plus isolated coding workspaces, verification, and an integrating lead agent
          - updates orchestration presentation titles so user-facing status also says Ultra
          - adds a regression contract proving the internal raw identity remains `ultraCode` while user-facing title/short title are `Ultra` and the strongest-behavior detail remains intact

          ## Why

          The V14 Preview acceptance contract requires `Low -> Medium -> High -> Extra High -> Ultra`. `UltraCode` was developer-facing terminology leaking through the otherwise polished five-stop control. This closes that mismatch without creating a second effort authority or changing provider/local-model/runtime routing.

          ## Scope

          - `AgentPad/Views/ChatComposer.swift`
          - `AgentPad/Services/AIProvider.swift`
          - `AgentPadTests/AgentProviderTransportRouterTests.swift`

          No provider route changes, Local Model qualification claims, Xcode project mutation, or Plan Space/Full Forge authority changes.

          ## Validation so far

          - exact base: `fd9edf6da45571d70d45ca1e9b70a86c8797ac04`
          - branch patch was applied with `git apply --check` + `git diff --check` in isolated applicator run `31379690404`, which completed successfully
          - source diff inspected after application
          - focused unit contract added

          Fresh PR-triggered verification is required before merge. No Simulator or physical-device visual acceptance is claimed yet.
          EOF
            pr_url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --draft --title 'Preview: expose Ultra as the top effort mode' --body-file /tmp/pr-body.md)"
          fi
          gh issue comment 23 --repo "$REPO" --body "RESULT | worker=NF-PREVIEW-ULTRA-SOL | lane=V14-PREVIEW-EFFORT-ULTRA | branch=$BRANCH | PR=$pr_url | base=fd9edf6da45571d70d45ca1e9b70a86c8797ac04 | source=Composer top stop/user-facing orchestration now Ultra; internal .ultraCode raw identity and strongest behavior preserved | regression=AgentOrchestrationPresentationContractTests | applicator_run=31379690404 success | merge=NOT CLAIMED; fresh PR CI + acceptance still required"
          rm .github/workflows/nf-preview-ultra-publish.yml
          git config user.name "NovaForge Swarm"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/nf-preview-ultra-publish.yml
          git diff --cached --check
          git commit -m "chore: remove Preview Ultra publisher"
          git push origin HEAD:"$BRANCH"
