name: Fix residency evidence paths

on:
  push:
    branches:
      - gpt56-sol-v14-preview-residency-soak-0814

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retarget QA path and remove superseded document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/v14-preview-residency-signal.yml')
          text = workflow.read_text()
          old = 'QA/v14-preview-streaming-soak.md'
          new = 'QA/v14-preview-residency-signal.md'
          if text.count(old) != 2:
              raise SystemExit(f'expected two old QA path anchors, found {text.count(old)}')
          workflow.write_text(text.replace(old, new))
          PY
          rm QA/v14-preview-streaming-soak.md
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = ".github/workflows/v14-preview-residency-signal.yml QA/v14-preview-streaming-soak.md "
      - name: Commit cleanup and remove applicator
        run: |
          rm .github/workflows/fix-residency-paths.yml
          git config user.name "novaforge-swarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/v14-preview-residency-signal.yml .github/workflows/fix-residency-paths.yml QA/v14-preview-streaming-soak.md
          git commit -m "Preview: finalize residency evidence paths"
          git push origin HEAD:${GITHUB_REF_NAME}
