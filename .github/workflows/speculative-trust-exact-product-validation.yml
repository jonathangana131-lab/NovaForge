name: Speculative trust exact-product validation

on:
  pull_request:
    paths:
      - .github/workflows/speculative-trust-exact-product-validation.yml

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Assert exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5fbdef7f55ef305e8e3acb5bf39a72979563d943"
          git diff --check HEAD^

      - name: Debug speculative trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/LocalAISpeculativeCore \
            -Xswiftc -warnings-as-errors

      - name: Release speculative trust contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/LocalAISpeculativeCore \
            -c release \
            -Xswiftc -warnings-as-errors
